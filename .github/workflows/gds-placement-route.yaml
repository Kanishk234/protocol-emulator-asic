name: gds-placement-route

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful measured source screen
        required: true
        default: "37408506116"
        type: string
      source_variant:
        description: One isolated measured physical variant
        required: true
        default: placement
        type: choice
        options: [placement, lane, sram, cts, bs-resync, bs-event-late, bs-event-drop-qual, bs-event-rx-timer, bs-event-rx-shared, bs-event-pin-banked, bs-load-flat]
      repaired_source_run_id:
        description: Audited banked SRAM or event NOR2 repair-only run, otherwise empty
        required: false
        default: ""
        type: string
      repair_postantenna_hold:
        description: One bounded repair if antenna changes create hold-only violations
        required: false
        default: false
        type: boolean
      pre_route_hold_target:
        description: Isolated event-late hold-headroom target in ns
        required: false
        default: source
        type: choice
        options: [source, "0.10", "0.125", "0.15"]

permissions:
  contents: read
  actions: read

concurrency:
  group: gds-placement-route-3393eea-${{ inputs.source_variant }}
  cancel-in-progress: false

jobs:
  harden:
    name: Guarded timing-placement antenna and detailed route
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PDK_ROOT: /home/runner/pdk
      CANDIDATE_SHA: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
      GRT_ADJUSTMENT: "0.16"
      VARIANT: timing-placement
      SOURCE_VARIANT: ${{ inputs.source_variant }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      REPAIRED_SOURCE_RUN_ID: ${{ inputs.repaired_source_run_id || '' }}
      REPAIR_POSTANTENNA_HOLD: ${{ inputs.repair_postantenna_hold && '1' || '0' }}
      PRE_ROUTE_HOLD_TARGET: ${{ inputs.pre_route_hold_target || 'source' }}

    steps:
      - name: Check out the measured R4 candidate
        uses: actions/checkout@v6
        with:
          ref: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
          fetch-depth: 0
          submodules: recursive

      - name: Check out experiment helpers
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-src

      - name: Verify unchanged hardware for placement comparison change
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git diff --name-only)"
          sha256sum src/config.json src/trw_pin_io.v

      - name: Check out Tiny Tapeout tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ihp-sg13cmos5l
          path: tt

      - name: Check out the pinned IHP installer
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: ihp-cmos5l
          path: .tt-gds-action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tt/requirements.txt

      - name: Install Tiny Tapeout prerequisites
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librsvg2-bin pngquant ghdl-llvm
          version: tinytapeout_gds_action

      - name: Install flow dependencies
        run: pip install -r tt/requirements.txt

      - name: Install IHP PDK
        run: ./.tt-gds-action/install_sg13cmos5l.sh

      - name: Install pinned LibreLane
        run: pip install librelane==3.1.0.dev3

      - name: Prepare trusted source fingerprints before artifact download
        run: |
          python workflow-src/scripts/ci/route_source.py prepare \
            --variant "$SOURCE_VARIANT" --run-id "$SOURCE_RUN_ID" \
            --identity /tmp/placement-source-identity.json

      - name: Download the audited all-corner placement screen
        if: inputs.repaired_source_run_id == ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.source_variant == 'placement' && 'gds-placement-multicorner-timing-placement' || inputs.source_variant == 'cts' && 'gds-cts-cluster-cts-cluster8' || startsWith(inputs.source_variant, 'bs-') && format('gds-drop-counter-{0}', inputs.source_variant) || format('gds-{0}-slew-{0}', inputs.source_variant) }}-${{ inputs.source_run_id }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Download the audited repaired candidate checkpoint
        if: inputs.repaired_source_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.source_variant == 'bs-event-late' && 'gds-event-nor2' || 'gds-banked-sram-hold' }}-${{ inputs.repaired_source_run_id }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.repaired_source_run_id }}

      - name: Validate exact source artifact provenance and fingerprints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > /tmp/placement-source-run.json
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$PWD" = /home/runner/work/protocol-emulator-asic/protocol-emulator-asic
          python workflow-src/scripts/ci/route_source.py validate \
            --variant "$SOURCE_VARIANT" --run-id "$SOURCE_RUN_ID" \
            --identity /tmp/placement-source-identity.json \
            --run-json /tmp/placement-source-run.json
          if [[ -n "$REPAIRED_SOURCE_RUN_ID" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REPAIRED_SOURCE_RUN_ID" > /tmp/placement-repaired-run.json
          fi

      - name: Build pinned region-reservation image
        run: docker build --tag tripwire-hotspot:local --file workflow-src/scripts/ci/Dockerfile.openroad-hotspot workflow-src/scripts/ci

      - name: Check antennas and fresh timing before detailed routing
        timeout-minutes: 325
        run: python workflow-src/scripts/ci/placement_route.py

      - name: Upload matched screen evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gds-placement-route-${{ github.run_id }}
          path: |
            runs/rtl-grt-screen/**
            runs/placement-route/**
            runs/event-nor2/**
            runs/slew-screen/**
            src/**
            macro/**
            info.yaml
          if-no-files-found: warn
