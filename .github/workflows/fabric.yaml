name: fabric
# WARP's own workflow: build a FABulous fabric, compile user designs to bitstreams, and run them
# on the fabric simulation. Phase 0: the stock-fabric two-bitstream demo (spikes/fab_demo).
# Tool versions: docs/VERSIONS.md (FABulous 2.2.0 needs OSS CAD Suite 2026-06-29).
on:
  push:
    paths:
      - 'arch/**'
      - 'macro/**'
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'protocols/**'
      - 'spikes/fab_demo/**'
      - 'tools/**'
      - 'requirements-dev.txt'
      - '.github/workflows/fabric.yaml'
  workflow_dispatch:

env:
  OSS_CAD_SUITE_TAG: '2026-06-29'

jobs:
  fab_demo:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # Ubuntu 24.04's own Python 3.12 (as in local WSL); FABulous needs >= 3.12 and imports tkinter.
      - name: Install Icarus, Python venv and Tk
        run: sudo apt-get update && sudo apt-get install -y iverilog python3-venv python3-tk

      - name: Cache OSS CAD Suite
        id: ocs
        uses: actions/cache@v5
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-${{ env.OSS_CAD_SUITE_TAG }}

      - name: Install OSS CAD Suite
        if: steps.ocs.outputs.cache-hit != 'true'
        run: |
          D=${OSS_CAD_SUITE_TAG//-/}
          curl -sfL -o /tmp/ocs.tgz "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$OSS_CAD_SUITE_TAG/oss-cad-suite-linux-x64-$D.tgz"
          tar -xzf /tmp/ocs.tgz -C ~

      - name: Create venv
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Tool versions
        run: |
          export PATH="$PATH:$HOME/oss-cad-suite/bin"
          yosys -V; nextpnr-generic --version 2>&1 | head -1; iverilog -V 2>&1 | head -1
          .venv/bin/pip show FABulous-FPGA | head -2

      - name: Two bitstreams in one fabric (spikes/fab_demo/run.sh)
        run: spikes/fab_demo/run.sh

      - name: Upload logs
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: fab_demo_logs
          path: |
            build/fab_demo_logs/
            build/fab_demo/user_design/*_npnr_log.txt

  # WARP's own fabric (arch/CURRENT, macro/<fabric>): compile the example user designs with
  # tools/compile (must reproduce the committed test/bitstreams), then run the whole pin-level
  # suite with the generated fabric RTL in place of the black box, loading the real bitstreams
  # through the host SPI interface (test/test_bitstream.py).
  warp_fabric:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Icarus and Python venv
        run: sudo apt-get update && sudo apt-get install -y iverilog python3-venv python3-tk

      - name: Cache OSS CAD Suite
        id: ocs
        uses: actions/cache@v5
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-${{ env.OSS_CAD_SUITE_TAG }}

      - name: Install OSS CAD Suite
        if: steps.ocs.outputs.cache-hit != 'true'
        run: |
          D=${OSS_CAD_SUITE_TAG//-/}
          curl -sfL -o /tmp/ocs.tgz "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$OSS_CAD_SUITE_TAG/oss-cad-suite-linux-x64-$D.tgz"
          tar -xzf /tmp/ocs.tgz -C ~

      - name: Create venv
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      # D-028: the compile flow's nextpnr comes from a newer suite (hard-primitive timing arcs)
      - name: Cache nextpnr (OSS CAD Suite 2026-09-27)
        uses: actions/cache@v5
        with:
          path: ~/.cache/warp/ocs-2026-09-27
          key: oss-cad-suite-nextpnr-2026-09-27

      - name: Fetch nextpnr
        run: scripts/fetch_nextpnr.sh

      - name: Compile the example designs (must match test/bitstreams)
        run: scripts/build_test_bitstreams.sh --check

      - name: Compile every design-set protocol onto the chip fabric (UART, SPI, I2C controller must fit)
        run: |
          source .venv/bin/activate
          export PATH="$PATH:$HOME/oss-cad-suite/bin"
          cd tools
          python -m compile.protocols -o ../build/protocols --require uart spi_ctrl i2c_ctrl

      - name: Pin-level suite on the fabric RTL with real bitstreams
        run: |
          source .venv/bin/activate
          # the system Icarus (as in the test job) first; OSS CAD Suite only for the compile flow
          make -C test clean
          make -C test WARP_FABRIC=rtl
          ! grep failure test/results.xml
          grep -q 'test_two_bitstreams' test/results.xml
          for t in test_prims test_uart test_spi_ctrl test_i2c_ctrl; do grep -q "$t" test/results.xml; done

      - name: Upload results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: warp_fabric
          path: |
            test/results.xml
            build/compile/*/report.json
            build/compile/*/*.log
            build/protocols/results.json
            build/protocols/*/report.json
