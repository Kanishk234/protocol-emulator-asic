name: native LUT variant
on:
  push:
    branches: [efpga]
    paths:
      - 'test_internal/cloud_lut_variant.py'
      - 'patches/fabulous_lut_mux_tree.patch'
      - '.github/workflows/lut_variant.yaml'
      - 'spikes/compact_edges/test_shell.py'
  workflow_dispatch:
    inputs:
      implementation:
        description: LUT implementation for matched synthesis control
        type: choice
        default: mux_tree
        options: [mux_tree, original_control]
      uart_stress:
        description: Real loaded UART data coverage
        type: choice
        default: edge_patterns
        options: [edge_patterns, smoke]
permissions:
  contents: read
concurrency:
  group: warp-native-lut-variant-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PDK_ROOT: ${{ github.workspace }}/build/cloud_pdk
      WARP_LUT_IMPLEMENTATION: ${{ inputs.implementation || 'mux_tree' }}
      WARP_COMPACT_UART_STRESS: ${{ inputs.uart_stress || 'edge_patterns' }}
    steps:
      - uses: actions/checkout@v6
      - name: Project tools and simulation venv
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog yosys python3-venv
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install -r test/requirements.txt pyyaml==6.0.3
      - name: Fetch pinned design and PDK
        run: |
          bash spikes/cloud/fetch_checkpoint.sh
          bash spikes/cloud/fetch_pdk.sh
          mkdir -p "$HOME/.cache/warp/iverilog-13"
          curl -sfL -o build/iverilog13.deb https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          dpkg-deb -x build/iverilog13.deb "$HOME/.cache/warp/iverilog-13"
      - name: Regenerate LUT tiles and load actual UART through SPI
        timeout-minutes: 20
        run: |
          source .venv/bin/activate
          python test_internal/cloud_lut_variant.py
      - name: Retain candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-lut-variant-${{ github.run_id }}
          path: build/lut_variant_evidence/
          retention-days: 3
