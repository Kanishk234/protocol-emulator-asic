name: gds-placement-extracted-timing

on:
  workflow_run:
    workflows: [gds-placement-route]
    types: [completed]
  workflow_dispatch:
    inputs:
      route_run_id:
        description: Completed repaired routing run with a final clean DRT checkpoint
        required: true
        default: "37412965189"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: gds-placement-route-${{ github.event.workflow_run.id || inputs.route_run_id }}
  cancel-in-progress: false

jobs:
  detailed-route:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    name: R4 placement extracted all-corner timing diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PDK_ROOT: /home/runner/pdk
      CANDIDATE_SHA: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
      OPENROAD_THREADS: "4"
      GRT_ADJUSTMENT: "0.16"

    steps:
      - name: Check out the exact R4 candidate at the artifact's original path
        uses: actions/checkout@v6
        with:
          ref: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
          fetch-depth: 0
          submodules: recursive

      - name: Check out workflow helpers
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-src

      - name: Check out Tiny Tapeout tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ihp-sg13cmos5l
          path: tt

      - name: Check out the pinned IHP installer
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: ihp-cmos5l
          path: .tt-gds-action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tt/requirements.txt

      - name: Install Tiny Tapeout prerequisites
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librsvg2-bin pngquant ghdl-llvm
          version: tinytapeout_gds_action

      - name: Install flow dependencies
        run: pip install -r tt/requirements.txt

      - name: Install IHP PDK
        run: ./.tt-gds-action/install_sg13cmos5l.sh

      - name: Install pinned LibreLane
        run: pip install librelane==3.1.0.dev3

      - name: Download the completed repaired routing artifact
        uses: actions/download-artifact@v7
        with:
          name: gds-placement-route-${{ github.event.workflow_run.id || inputs.route_run_id }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || inputs.route_run_id }}

      - name: Validate candidate and completed routing provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROUTE_RUN_ID: ${{ github.event.workflow_run.id || inputs.route_run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ROUTE_RUN_ID" > /tmp/route-run.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path("/tmp/route-run.json").read_text())
          assert run["conclusion"] == "success"
          assert run["head_branch"] == "main"
          assert run["id"] == int(os.environ["ROUTE_RUN_ID"])
          assert run["path"] == ".github/workflows/gds-placement-route.yaml"
          assert Path.cwd().resolve() == Path("/home/runner/work/protocol-emulator-asic/protocol-emulator-asic")
          expected = {"TRW_LANES": "2", "TRW_UNITS": "4", "TRW_PC_UNITS_BITSYNC": "4'b0001"}
          defs = Path("src/trw_defs.vh").read_text().splitlines()
          for key, value in expected.items():
              assert f"`define {key} {value}" in defs
          states = list(Path("runs/placement-route/drt").glob("*-openroad-detailedrouting/state_out.json"))
          assert len(states) == 1, "Completed DRT checkpoint required"
          state = json.loads(states[0].read_text())
          assert state["metrics"]["route__drc_errors"] == 0
          import sys
          sys.path.insert(0, str(Path('workflow-src/scripts/ci').resolve()))
          from route_source import validate_saved
          identity = validate_saved(Path.cwd())
          if identity:
              print(f"Source variant: {identity['variant']}; screen run: {identity['source_run_id']}")
          print("Successful routing artifact and final zero-DRC checkpoint validated")
          PY

      - name: Extract parasitics and report all-corner signoff timing
        timeout-minutes: 90
        run: |
          set -euo pipefail
          python workflow-src/scripts/ci/extracted_timing.py --route-root runs/placement-route/drt

      - name: Upload extracted timing diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gds-placement-extracted-timing-${{ github.run_id }}
          path: |
            runs/extracted-timing/**
            runs/placement-route/drt/**
            runs/placement-route/gates.json
            runs/placement-route/postantenna-sta/comparison.json
            runs/placement-route/postantenna-hold-followup/**/comparison.json
            runs/placement-route/hold-headroom/comparison.json
            src/config_merged.json
            src/config_extracted_timing.json
            src/config_timing_*.json
          if-no-files-found: warn
