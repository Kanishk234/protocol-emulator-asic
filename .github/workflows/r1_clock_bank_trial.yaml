name: R1 same source global clock bank placement trial
on:
  workflow_dispatch:
  push:
    branches: [efpga]
    paths: [.github/workflows/r1_clock_bank_trial.yaml]
permissions:
  contents: read
  actions: read
concurrency:
  group: warp-r1-clock-bank-trial
  cancel-in-progress: false
jobs:
  placement:
    if: github.ref == 'refs/heads/efpga'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: tools:test_internal:spikes/r1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        with:
          path: ~/.cache/warp/ocs-2026-09-27
          key: oss-cad-suite-nextpnr-2026-09-27
      - name: Authenticate same SPI source and all-clocked timing control
        timeout-minutes: 15
        run: |
          bash scripts/setup_venv.sh
          source .venv/bin/activate
          python -m pytest -q tools/profiling/tests/test_r1_placement_trial.py
          bash scripts/fetch_nextpnr.sh
          python - <<'PY'
          import json,os
          from pathlib import Path
          from assembly_fetch import api,admit_run,artifact
          from clock_bank_trial import prepare
          row=json.loads(Path('spikes/r1/routed_timing_sources.json').read_text())['sources']['capsule']
          repo=os.environ['GITHUB_REPOSITORY']
          producer=api(f'repos/{repo}/actions/runs/{row["run"]["id"]}')
          admit_run(producer,row['run'])
          target=Path('build/r1_placement_sources').resolve();target.mkdir(parents=True,exist_ok=False)
          capsule=artifact(repo,row['artifact'],target)/row['member']
          sources={
            'trial':{'run':{'id':44798802734,'head_sha':'693e3b6bee9d082109c616431648646693c0a4be','head_branch':'efpga','run_attempt':1,'conclusion':'success','path':'.github/workflows/r1_spi_timer_compile.yaml'},'artifact':{'id':14660895812,'name':'r1-spi-timer-compile-44798802734','digest':'sha256:bb767eb1a77a6eaa5e438ffbf2f519a58c772d21908ea00cbe16e6a8d59f0b44','size_in_bytes':274999,'source_run':44798802734},'member':'r1_placement_trial'},
            'current':{'run':{'id':44802619585,'head_sha':'9f3f7b4f8e3f43ae01e77f228b5e104cd1b4afb6','head_branch':'efpga','run_attempt':1,'conclusion':'success','path':'.github/workflows/r1_spi_timer_rail.yaml'},'artifact':{'id':14661194562,'name':'r1-spi-timer-rail-native-timing-44802619585','digest':'sha256:5b219d3fd47ca23835fd342d78bdafe6ba5c08a9aa354709847636261f6bf54e','size_in_bytes':10019750,'source_run':44802619585},'member':'.'}}
          roots={}
          for name,item in sources.items():
              actual=api(f'repos/{repo}/actions/runs/{item["run"]["id"]}');admit_run(actual,item['run'])
              roots[name]=artifact(repo,item['artifact'],target)/item['member']
              (target/(name+'.producer.json')).write_text(json.dumps(actual,indent=2)+'\n')
          prepare(capsule,**roots,out=Path('build/r1_placement_trial'))
          Path('build/r1_placement_trial/producer.json').write_text(json.dumps(producer,indent=2)+'\n')
          PY
      - name: Reproduce clock A image then constrain only the clock buffer to bank D
        timeout-minutes: 25
        run: |
          source .venv/bin/activate
          python spikes/r1/clock_bank_trial.py run --out build/r1_placement_trial
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r1-clock-bank-trial-${{ github.run_id }}
          path: |
            build/r1_placement_trial/
            build/r1_placement_sources/*.metadata.json
            build/r1_placement_sources/*.producer.json
          include-hidden-files: true
          retention-days: 90
