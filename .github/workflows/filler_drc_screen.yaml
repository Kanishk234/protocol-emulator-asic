name: isolated filler Magic screen
on:
  push:
    branches: [efpga]
    paths:
      - 'test_internal/filler_drc_screen.tcl'
      - 'test_internal/filler_array_screen.py'
      - '.github/workflows/filler_drc_screen.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: warp-filler-screen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PDK_ROOT: ${{ github.workspace }}/build/cloud_pdk
    steps:
      - uses: actions/checkout@v6
      - name: Pinned untouched PDK
        run: |
          python3 -m venv .venv
          bash spikes/cloud/fetch_pdk.sh
      - name: Isolated library cells with full Magic rules
        timeout-minutes: 10
        run: |
          source .venv/bin/activate
          mkdir -p build/filler_drc_screen
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e WARP_FILLER_GDS="$PDK_ROOT/ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/gds/sg13cmos5l_stdcell.gds" \
            -e WARP_FILLER_OUT="$GITHUB_WORKSPACE/build/filler_drc_screen" \
            ghcr.io/librelane/librelane@sha256:d109140b8f17fc54f4fca998beb8124f4949404ec52e339eebd2250854a18b5a \
            klayout -b -r test_internal/filler_array_screen.py > build/filler_drc_screen/fixtures.log 2>&1
          for maskhints in true false; do
          mkdir -p "build/filler_drc_screen/$maskhints"
          cp build/filler_drc_screen/filler_arrays.gds "build/filler_drc_screen/$maskhints/"
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e WARP_FILLER_GDS="$PDK_ROOT/ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/gds/sg13cmos5l_stdcell.gds" \
            -e WARP_FILLER_OUT="$GITHUB_WORKSPACE/build/filler_drc_screen/$maskhints" \
            -e WARP_FILLER_MASKHINTS="$maskhints" \
            ghcr.io/librelane/librelane@sha256:d109140b8f17fc54f4fca998beb8124f4949404ec52e339eebd2250854a18b5a \
            magic -dnull -noconsole \
            -rcfile "$PDK_ROOT/ihp-sg13cmos5l/libs.tech/magic/ihp-sg13cmos5l.magicrc" \
            test_internal/filler_drc_screen.tcl > "build/filler_drc_screen/$maskhints/magic.log" 2>&1
          for cell in fill_1 fill_2 fill_4 fill_8 decap_4 decap_8 inv_1; do
            test -s "build/filler_drc_screen/$maskhints/sg13cmos5l_${cell}.rpt"
          done
          for width in 1 2 4 8; do
          for fixture in horizontal rows_mirrored rows_ground; do
            test -s "build/filler_drc_screen/$maskhints/warp_fill${width}_${fixture}.rpt"
          done
          done
          test -s "build/filler_drc_screen/$maskhints/warp_fill1_rows_same.rpt"
          test -s "build/filler_drc_screen/$maskhints/warp_fill2_rows_same.rpt"
          done
          sha256sum "$PDK_ROOT/ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell/gds/sg13cmos5l_stdcell.gds" \
            "$PDK_ROOT/ihp-sg13cmos5l/libs.tech/magic/ihp-sg13cmos5l-drc.tech" \
            "$PDK_ROOT/ihp-sg13cmos5l/libs.tech/magic/ihp-sg13cmos5l-cifout.tech" \
            > build/filler_drc_screen/input_hashes.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolated-filler-drc-${{ github.run_id }}
          path: build/filler_drc_screen/
          retention-days: 3
