name: gds-postgrt-timing-experiment

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Full GDS run containing the saved GlobalRouting checkpoint
        required: true
        default: "37037880327"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: gds-postgrt-timing-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  postgrt-timing:
    name: R4 slow-corner post-GRT repair screen
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PDK_ROOT: /home/runner/pdk
      CANDIDATE_SHA: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}

    steps:
      - name: Check out the exact R4 candidate at the artifact's original path
        uses: actions/checkout@v6
        with:
          ref: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
          fetch-depth: 0
          submodules: recursive

      - name: Check out workflow helpers
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-src

      - name: Check out Tiny Tapeout tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ihp-sg13cmos5l
          path: tt

      - name: Check out the pinned IHP installer
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: ihp-cmos5l
          path: .tt-gds-action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tt/requirements.txt

      - name: Install Tiny Tapeout prerequisites
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librsvg2-bin pngquant ghdl-llvm
          version: tinytapeout_gds_action

      - name: Install flow dependencies
        run: pip install -r tt/requirements.txt

      - name: Install IHP PDK
        run: ./.tt-gds-action/install_sg13cmos5l.sh

      - name: Install pinned LibreLane
        run: pip install librelane==3.1.0.dev3

      - name: Download the full GDS checkpoint artifact
        uses: actions/download-artifact@v7
        with:
          name: GDS_logs-${{ inputs.source_run_id }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Validate the global-route checkpoint
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_root = Path("/home/runner/work/protocol-emulator-asic/protocol-emulator-asic")
          assert Path.cwd().resolve() == expected_root, (Path.cwd(), expected_root)
          cfg = json.loads(Path("src/config_merged.json").read_text())
          resolved = json.loads(Path("runs/wokwi/resolved.json").read_text())
          assert float(cfg["CLOCK_PERIOD"]) == 20.0
          assert int(cfg["PL_TARGET_DENSITY_PCT"]) == 56
          assert resolved["RUN_POST_GRT_RESIZER_TIMING"] is False

          defs = Path("src/trw_defs.vh").read_text().splitlines()
          expected_defs = {
              "TRW_LANES": "2",
              "TRW_UNITS": "4",
              "TRW_PC_UNITS_PULSE": "4'b0001",
              "TRW_PC_UNITS_CARRIER": "4'b0001",
              "TRW_PC_UNITS_BITSYNC": "4'b0001",
          }
          for name, value in expected_defs.items():
              assert f"`define {name} {value}" in defs, name

          checkpoint = Path("runs/wokwi/39-openroad-globalrouting/state_out.json")
          stage_config = Path("runs/wokwi/39-openroad-globalrouting/config.json")
          state = json.loads(checkpoint.read_text())
          route_cfg = json.loads(stage_config.read_text())
          assert float(route_cfg["GRT_ADJUSTMENT"]) == 0.16
          for key in ("odb", "def", "sdc", "pnl"):
              path = Path(state[key])
              assert path.is_file(), f"missing checkpoint {key}: {path}"
          print(f"Candidate: {Path.cwd()} @ {os.environ['CANDIDATE_SHA']}")
          print("Shape: 2 lanes, 4 pin units, U0 full; 20 ns; density 56%")
          print("Checkpoint: stage 39 GlobalRouting; GRT_ADJUSTMENT=0.16")
          print("Screen: slow-corner setup repair followed by mid-PnR STA at fast, slow, and typical corners")
          PY

      - name: Configure disposable timing-screen corners
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("src/config_merged.json")
          config = json.loads(path.read_text())
          config["GRT_ADJUSTMENT"] = 0.16
          config["RSZ_CORNERS"] = ["nom_slow_1p08V_125C"]
          config["PNR_CORNERS"] = [
              "nom_fast_1p32V_m40C",
              "nom_slow_1p08V_125C",
              "nom_typ_1p20V_25C",
          ]
          config["RUN_POST_GRT_RESIZER_TIMING"] = True
          path.write_text(json.dumps(config, indent=2) + "\n")

          assert config["RSZ_CORNERS"] == ["nom_slow_1p08V_125C"]
          assert config["PNR_CORNERS"] == [
              "nom_fast_1p32V_m40C",
              "nom_slow_1p08V_125C",
              "nom_typ_1p20V_25C",
          ]
          print("Configured the disposable merged config with native JSON corner lists")
          PY

      - name: Run slow-corner post-GRT repair and mid-PnR STA
        timeout-minutes: 90
        run: |
          set -euo pipefail
          mkdir -p runs/postgrt-timing
          python -m librelane \
            --pdk-root "$PDK_ROOT" \
            --docker-no-tty \
            --dockerized \
            --pdk ihp-sg13cmos5l \
            --manual-pdk \
            --run-tag postgrt-timing \
            --force-run-dir runs/postgrt-timing \
            --hide-progress-bar \
            --with-initial-state runs/wokwi/39-openroad-globalrouting/state_out.json \
            --from OpenROAD.ResizerTimingPostGRT \
            --to OpenROAD.STAMidPNR \
            src/config_merged.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("runs/postgrt-timing")
          resolved = json.loads((root / "resolved.json").read_text())
          assert float(resolved["GRT_ADJUSTMENT"]) == 0.16, resolved["GRT_ADJUSTMENT"]
          assert resolved["RSZ_CORNERS"] == ["nom_slow_1p08V_125C"], resolved["RSZ_CORNERS"]
          expected_sta_corners = [
              "nom_fast_1p32V_m40C",
              "nom_slow_1p08V_125C",
              "nom_typ_1p20V_25C",
          ]
          assert resolved["PNR_CORNERS"] == expected_sta_corners, resolved["PNR_CORNERS"]
          assert resolved["RUN_POST_GRT_RESIZER_TIMING"] is True
          log = root / "flow.log"
          if not log.is_file():
              matches = list(root.rglob("flow.log"))
              assert matches, "LibreLane flow.log was not produced"
              log = matches[0]
          text = log.read_text(errors="replace")
          assert "OpenROAD.ResizerTimingPostGRT" in text, "post-GRT resizer did not run"
          assert "Gating variable for step 'OpenROAD.ResizerTimingPostGRT' set to 'False'" not in text
          states = [
              path for path in root.rglob("state_out.json")
              if "resizertimingpostgrt" in str(path).lower()
          ]
          assert states, "post-GRT resizer state_out.json was not produced"
          step_cfg = json.loads(states[-1].with_name("config.json").read_text())
          assert float(step_cfg["GRT_ADJUSTMENT"]) == 0.16
          assert step_cfg["RSZ_CORNERS"] == ["nom_slow_1p08V_125C"]
          sta_metrics = {}
          for metrics_path in root.rglob("or_metrics_out.json"):
              if "stamidpnr" not in str(metrics_path).lower():
                  continue
              metrics = json.loads(metrics_path.read_text())
              sta_metrics.update(metrics)
          for corner in expected_sta_corners:
              for kind in ("setup", "hold"):
                  key = f"timing__{kind}__ws__corner:{corner}"
                  assert key in sta_metrics, f"missing fresh all-corner STA metric {key}"
                  print(f"Post-repair {corner} {kind} worst slack: {sta_metrics[key]} ns")
          print(f"Post-GRT resizer checkpoint: {states[-1]}")
          print("Resolved flow: GRT_ADJUSTMENT=0.16; slow-corner resizer; fresh post-repair mid-PnR STA at fast, slow, and typical corners")
          PY

      - name: Upload timing-resizer artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gds-postgrt-timing-${{ github.run_id }}
          path: |
            runs/postgrt-timing/**
            runs/wokwi/39-openroad-globalrouting/state_out.json
            runs/wokwi/39-openroad-globalrouting/config.json
            src/config_merged.json
          if-no-files-found: warn
