# Read-only reports on exact failed cache-only checkpoint; no admission to routing.
name: gds-cache-only-functional-setup-audit
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: gds-cache-only-functional-setup-audit
  cancel-in-progress: false
jobs:
  audit:
    name: Read-only setup at flop and output endpoints
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_RUN: '43957277296'
      SOURCE_ARTIFACT: official-dev4-cache-no-owner-43957277296
      PDK_ROOT: /home/runner/pdk
    steps:
    - name: Check out route tools
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Restore the exact source screen checkpoint
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\ngh api \"repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN\" > cache-only-source-run.json\n\
        gh run download \"$SOURCE_RUN\" --repo \"$GITHUB_REPOSITORY\" --name \"$SOURCE_ARTIFACT\" --dir\
        \ frozen-screen\npython - <<'PY'\nimport json, shutil\nfrom pathlib import Path\nrun = json.loads(Path('cache-only-source-run.json').read_text())\n\
        assert run['id'] == 43957277296\nassert run['head_sha'] == 'f00bf4903ebab1118d89d053de9e483f97a8c92a'\n\
        assert run['head_branch'] == 'main' and run['conclusion'] == 'failure'\nassert run['path'] ==\
        \ '.github/workflows/gds-official-dev4-cache-no-owner-screen.yaml'\nfrozen = Path('frozen-screen')\n\
        for name in ('runs', 'src', 'macro'):\n    target = Path(name)\n    if target.exists(): shutil.rmtree(target)\n\
        for name in ('runs', 'src', 'macro'):\n    source = frozen / name\n    if source.exists(): shutil.copytree(source,\
        \ Path(name))\nshutil.copy2(frozen / 'info.yaml', 'info.yaml')\nfor name in ('compatibility-input.json',\
        \ 'compatibility-generated.json',\n             'compatibility-engine.json', 'compatibility-image.json',\n\
        \             'compatibility-openroad.txt'):\n    if (frozen / name).exists(): shutil.copy2(frozen\
        \ / name, name)\nPY\n"
    - name: Install pinned support tools
      uses: actions/checkout@v6
      with:
        repository: TinyTapeout/tt-support-tools
        ref: 9d13ff3e3e6202090740110438c6a10c1d62ca0f
        path: tt
    - name: Set up audit environment
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: tt/requirements.txt
    - name: Install stock tool dependencies
      run: 'pip install -r tt/requirements.txt

        pip install librelane==3.1.0.dev4

        '
    - name: Verify stock physical engine identity
      run: 'set -euo pipefail

        docker pull ghcr.io/librelane/librelane:3.1.0.dev4

        docker image inspect ghcr.io/librelane/librelane:3.1.0.dev4 > compatibility-image-extract.json

        docker run --rm ghcr.io/librelane/librelane:3.1.0.dev4 openroad -version > compatibility-openroad-extract.txt

        python - <<''PY''

        import json

        from pathlib import Path

        image = json.loads(Path(''compatibility-image-extract.json'').read_text())[0]

        assert ''ghcr.io/librelane/librelane@sha256:af2405f5d48d8fe14d406ecce913811177a95e365e3b625859677307cace2469''
        in image[''RepoDigests'']

        assert Path(''compatibility-openroad-extract.txt'').read_text().strip() == ''dcf36133a369abc8f3c5e5738cd4d82e4903c0e0''

        PY

        '
    - name: Measure actual functional setup reserve without repair
      timeout-minutes: 45
      run: python scripts/ci/cache_only_functional_audit.py
    - name: Upload read-only timing results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cache-only-functional-setup-${{ github.run_id }}
        path: 'runs/cache-only-functional-audit/**


          runs/cache-only-functional-pdk/**


          cache-only-source-run.json'
        if-no-files-found: warn
run-name: Read-only cache-only functional setup reserve
