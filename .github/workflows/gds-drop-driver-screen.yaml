name: gds-drop-driver-screen

on:
  workflow_dispatch:
    inputs:
      repair_antennas:
        description: One bounded antenna repair followed by fresh checks
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: gds-drop-driver-37806209914
  cancel-in-progress: false

jobs:
  harden:
    name: One audited A21OI driver resize and fresh routing without DRT
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PDK_ROOT: /home/runner/pdk
      CANDIDATE_SHA: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
      GRT_ADJUSTMENT: "0.16"
      VARIANT: timing-placement
      SOURCE_VARIANT: bs-event-late
      SOURCE_RUN_ID: "37533969613"
      ECO_PROFILE: drop-driver
      REPAIR_ECO_ANTENNAS: ${{ inputs.repair_antennas && '1' || '0' }}

    steps:
      - name: Check out the measured R4 candidate
        uses: actions/checkout@v6
        with:
          ref: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
          fetch-depth: 0
          submodules: recursive

      - name: Check out experiment helpers
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-src

      - name: Verify unchanged hardware for placement comparison change
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git diff --name-only)"
          sha256sum src/config.json src/trw_pin_io.v

      - name: Check out Tiny Tapeout tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ihp-sg13cmos5l
          path: tt

      - name: Check out the pinned IHP installer
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: ihp-cmos5l
          path: .tt-gds-action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tt/requirements.txt

      - name: Install Tiny Tapeout prerequisites
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librsvg2-bin pngquant ghdl-llvm
          version: tinytapeout_gds_action

      - name: Install flow dependencies
        run: pip install -r tt/requirements.txt

      - name: Install IHP PDK
        run: ./.tt-gds-action/install_sg13cmos5l.sh

      - name: Install pinned LibreLane
        run: pip install librelane==3.1.0.dev3

      - name: Prepare trusted source fingerprints before artifact download
        run: |
          python workflow-src/scripts/ci/route_source.py prepare \
            --variant "$SOURCE_VARIANT" --run-id "$SOURCE_RUN_ID" \
            --identity /tmp/placement-source-identity.json

      - name: Download the qualified nine-leaf hold checkpoint
        uses: actions/download-artifact@v7
        with:
          name: gds-drop-leaf-hold-37806209914
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37806209914

      - name: Validate exact source artifact provenance and fingerprints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/37806209914" > /tmp/event-nor2-route-run.json
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$PWD" = /home/runner/work/protocol-emulator-asic/protocol-emulator-asic

      - name: Build pinned region-reservation image
        run: docker build --tag tripwire-drop-driver:local --file workflow-src/scripts/ci/Dockerfile.openroad-drop-driver workflow-src/scripts/ci

      - name: Smoke check the installed OpenROAD wrapper
        run: docker run --rm --entrypoint /usr/local/bin/tripwire-openroad-event-nor2 tripwire-drop-driver:local -version

      - name: Measure one-cell resize with fresh routing and antenna/timing gates
        timeout-minutes: 70
        run: python workflow-src/scripts/ci/event_nor2_screen.py

      - name: Upload matched screen evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gds-drop-driver-${{ github.run_id }}
          path: |
            runs/rtl-grt-screen/**
            runs/event-nor2/**
            runs/drop-event/**
            runs/drop-hold/**
            runs/drop-driver/**
            runs/placement-route/antenna/**
            runs/placement-route/hold-headroom/**
            runs/placement-route/postantenna-sta/**
            runs/placement-route/gates.json
            runs/placement-route/source_identity.json
            src/**
            macro/**
            info.yaml
          if-no-files-found: warn
