# Separate measurement workflow; official gds.yaml and stock flow are unchanged.
name: gds-stock-official-baseline-screen
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: gds-stock-official-baseline-screen
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PDK_ROOT: /home/runner/pdk
    steps:
    - name: Check out project
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Prepare the full design with strict stock project inputs
      run: |-
        set -euo pipefail
        git apply --check spikes/phase2_stock_flow/verified_design_only.patch
        git apply spikes/phase2_stock_flow/verified_design_only.patch
        cp spikes/phase2_stock_flow/strict_project_config.json src/config.json
        spikes/r3_sram/fetch_macro.sh macro/RM_IHPSG13_1P_512x16_c2_bm_bist
        python - <<'PYCODE'
        import hashlib, json, subprocess
        from pathlib import Path
        manifest = json.loads(Path('spikes/phase2_stock_flow/design_manifest.json').read_text())
        for name, sha in manifest['files'].items():
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == sha, name
        assert hashlib.sha256(Path('.github/workflows/gds.yaml').read_bytes()).hexdigest() == manifest['official_workflow_sha256']
        macros = json.loads(Path('scripts/ci/fixtures/wire600_selective/promoted_source.json').read_text())['macro_files']
        for name, sha in macros.items():
            path = Path('macro/RM_IHPSG13_1P_512x16_c2_bm_bist') / name
            assert hashlib.sha256(path.read_bytes()).hexdigest() == sha, name
        config = json.loads(Path('src/config.json').read_text())
        assert 'meta' not in config
        assert config['CLOCK_PERIOD'] == 20
        assert config['PL_TARGET_DENSITY_PCT'] == 56
        assert config['PL_RESIZER_SETUP_SLACK_MARGIN'] == 0
        assert config['CTS_APPLY_NDR'] == 'none'
        assert config['CTS_SINK_CLUSTERING_SIZE'] == 8
        assert config['RUN_POST_GRT_DESIGN_REPAIR'] is True
        assert config['GRT_DESIGN_REPAIR_MAX_WIRE_LENGTH'] == 300
        assert config['GRT_ADJUSTMENT'] == 0.16
        assert config['RUN_POST_GRT_RESIZER_TIMING'] is False
        assert config['PL_RESIZER_HOLD_SLACK_MARGIN'] == 0.275
        assert config['GRT_OVERFLOW_ITERS'] == 100
        assert 'GRT_ANTENNA_REPAIR_JUMPER_ONLY' not in config
        policy = json.loads(Path('spikes/phase2_stock_flow/config_banks_evidence.json').read_text())
        physical = json.loads(Path('spikes/phase2_stock_flow/wire300_hold175_evidence.json').read_text())
        assert policy['project_config_sha256'] == physical['baseline_project_config_sha256']
        hold_control = json.loads(Path('spikes/phase2_stock_flow/wire300_hold250_evidence.json').read_text())
        assert physical['candidate_project_config_sha256'] == hold_control['baseline_project_config_sha256']
        reserve = json.loads(Path('spikes/phase2_stock_flow/wire300_hold275_iter100_evidence.json').read_text())
        assert hold_control['candidate_project_config_sha256'] == reserve['baseline_project_config_sha256']
        assert hashlib.sha256(Path('src/config.json').read_bytes()).hexdigest() == reserve['candidate_project_config_sha256']
        assert config['SYNTH_STRATEGY'] == 'DELAY 0'
        assert config['GRT_RESIZER_SETUP_SLACK_MARGIN'] == 0
        assert config['GRT_RESIZER_HOLD_SLACK_MARGIN'] == 0.125
        assert not any(k.startswith('TRIPWIRE_') for k in config)
        assert 'PNR_SDC_FILE' not in config and 'SIGNOFF_SDC_FILE' not in config
        assert 'ERROR_ON_MAGIC_DRC' not in config and 'ERROR_ON_ILLEGAL_OVERLAPS' not in config
        evidence = json.loads(Path('spikes/phase2_stock_flow/late_drop_select_evidence.json').read_text())
        patch = Path('spikes/phase2_stock_flow/late_drop_select.patch')
        assert hashlib.sha256(patch.read_bytes()).hexdigest() == evidence['patch_sha256']
        assert hashlib.sha256(Path('src/trw_chan_port.v').read_bytes()).hexdigest() == evidence['baseline_sha256']
        def source_hashes():
            return {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('src').rglob('*') if p.is_file()}
        before = source_hashes()
        subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
        subprocess.run(['git', 'apply', str(patch)], check=True)
        assert source_hashes() == {**before, 'src/trw_chan_port.v': evidence['candidate_sha256']}
        print('Verified late-select channel variant:', evidence['candidate_sha256'])
        evidence = json.loads(Path('spikes/phase2_stock_flow/forwarded_drop_evidence.json').read_text())
        patch = Path('spikes/phase2_stock_flow/forwarded_drop.patch')
        assert hashlib.sha256(patch.read_bytes()).hexdigest() == evidence['patch_sha256']
        assert hashlib.sha256(Path('src/trw_chan_port.v').read_bytes()).hexdigest() == evidence['baseline_sha256']
        before = source_hashes()
        subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
        subprocess.run(['git', 'apply', str(patch)], check=True)
        assert source_hashes() == {**before, 'src/trw_chan_port.v': evidence['candidate_sha256']}
        print('Verified forwarded-count channel variant:', evidence['candidate_sha256'])
        evidence = json.loads(Path('spikes/phase2_stock_flow/mode_predicate_evidence.json').read_text())
        patch = Path('spikes/phase2_stock_flow/mode_predicate.patch')
        assert hashlib.sha256(patch.read_bytes()).hexdigest() == evidence['patch_sha256']
        for name, sha in evidence['baseline_files'].items():
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == sha, name
        before = source_hashes()
        subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
        subprocess.run(['git', 'apply', str(patch)], check=True)
        assert source_hashes() == {**before, **evidence['candidate_files']}
        print('Verified configuration mode-predicate variant:', evidence['candidate_files'])
        patch = Path('spikes/phase2_stock_flow/config_banks.patch')
        assert hashlib.sha256(patch.read_bytes()).hexdigest() == policy['patch_sha256']
        for name, sha in policy['baseline_files'].items():
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == sha, name
        before = source_hashes()
        subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
        subprocess.run(['git', 'apply', str(patch)], check=True)
        assert source_hashes() == {**before, **policy['candidate_files']}
        print('Verified parity-banked configuration variant:', policy['candidate_files'])
        PYCODE
    - name: Check out Tiny Tapeout tools
      uses: actions/checkout@v6
      with:
        repository: TinyTapeout/tt-support-tools
        ref: ihp-sg13cmos5l
        path: tt
    - name: Check out the pinned IHP installer
      uses: actions/checkout@v6
      with:
        repository: TinyTapeout/tt-gds-action
        ref: ihp-cmos5l
        path: .tt-gds-action
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: tt/requirements.txt
    - name: Install Tiny Tapeout prerequisites
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
      with:
        packages: librsvg2-bin pngquant ghdl-llvm
        version: tinytapeout_gds_action
    - name: Install flow dependencies
      run: pip install -r tt/requirements.txt
    - name: Install IHP PDK
      run: ./.tt-gds-action/install_sg13cmos5l.sh
    - name: Install pinned LibreLane
      run: pip install librelane==3.1.0.dev3
    - name: Generate project configuration with unchanged TT tools
      run: python tt/tt_tool.py --create-user-config --ihp
    - name: Run stock Classic through the final pre-routing STA
      timeout-minutes: 190
      run: |-
        set -euo pipefail
        unset LIBRELANE_IMAGE_OVERRIDE TRIPWIRE_NATIVE_RUNTIME _LLN_OVERRIDE_OPENROAD PYTHONPATH
        mkdir -p runs
        mkdir runs/stock-official-baseline
        python -m librelane --docker-no-tty --dockerized --pdk-root "$PDK_ROOT" --pdk ihp-sg13cmos5l --manual-pdk --run-tag stock-official-baseline --force-run-dir runs/stock-official-baseline --hide-progress-bar --to OpenROAD.STAMidPNR-3 src/config_merged.json
        # This is measurement only. No detailed routing or qualification claim.
        python - <<'PYCODE'
        from pathlib import Path
        root = Path('runs/stock-official-baseline')
        assert not list(root.glob('*-openroad-detailedrouting')), 'Unexpected detailed routing'
        assert len(list(root.glob('*-openroad-stamidpnr-3/state_out.json'))) == 1, 'Missing final stock pre-routing STA'
        PYCODE
    - name: Read-only all-corner STA on the final stock checkpoint
      timeout-minutes: 30
      run: |-
        set -euo pipefail
        unset LIBRELANE_IMAGE_OVERRIDE TRIPWIRE_NATIVE_RUNTIME _LLN_OVERRIDE_OPENROAD PYTHONPATH
        python - <<'PYCODE'
        import hashlib, json, math, os, sys
        from pathlib import Path
        sys.path.insert(0, 'scripts/ci')
        from postgrt_timing import CORNERS, screen
        from native_stock_route import run_step
        root = Path('runs/stock-official-baseline')
        states = list(root.glob('*-openroad-stamidpnr-3/state_out.json'))
        assert len(states) == 1
        source = states[0]
        state = json.loads(source.read_text())
        paths = [source] + [Path(state[k]) for k in ('odb', 'def', 'nl', 'pnl', 'sdc')]
        assert all(p.is_file() for p in paths)
        def hashes():
            return {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}
        before = hashes()
        output = Path('runs/stock-corner-audit')
        # Supplying the same checkpoint twice makes this a repeatability/read-only audit.
        # No resizer, repair, placement or routing step is invoked.
        screen(Path('src/config_merged.json'), source, output, os.environ['PDK_ROOT'], repaired=source)
        # Check antenna on the same final database; do not inherit pre-timing results.
        run_step(json.loads(Path('src/config_merged.json').read_text()), source,
                 output / 'fresh-antenna', ['OpenROAD.CheckAntennas'])
        antenna_files = list((output / 'fresh-antenna').glob('*-openroad-checkantennas/or_metrics_out.json'))
        assert len(antenna_files) == 1
        antenna_metrics = json.loads(antenna_files[0].read_text())
        antenna = {key: antenna_metrics[key] for key in ('antenna__violating__nets', 'antenna__violating__pins')}
        assert all(isinstance(v, int) and v >= 0 for v in antenna.values())
        assert hashes() == before, 'Read-only audit modified source physical views'
        result = json.loads((output / 'comparison.json').read_text())
        rows = {}
        for corner in CORNERS:
            metrics = result['corners'][corner]['before']
            repeated = result['corners'][corner]['after']
            keys = [f'timing__{kind}__ws__corner:{corner}' for kind in ('setup', 'hold')]
            keys += [f'design__max_{kind}_violation__count__corner:{corner}' for kind in ('slew', 'cap', 'fanout')]
            for key in keys:
                assert key in metrics and key in repeated, key
                assert math.isfinite(metrics[key]) and abs(metrics[key] - repeated[key]) <= 1e-9, key
            rows[corner] = {key: metrics[key] for key in keys}
        (output / 'read_only_audit.json').write_text(json.dumps(dict(
            source_state=str(source), unchanged_physical_view_hashes=before,
            fresh_corner_metrics=rows, fresh_antenna_metrics=antenna, physical_repairs_performed=False,
            qualification_performed=False, detailed_routing_performed=False), indent=2) + '\n')
        print(json.dumps(rows, indent=2))
        PYCODE
    - name: Upload complete stock baseline measurements
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: stock-official-baseline-${{ github.run_id }}
        path: |-
          runs/stock-official-baseline/**
          runs/stock-corner-audit/**
          src/**
          info.yaml
          macro/**
          spikes/phase2_stock_flow/late_drop_select.patch
          spikes/phase2_stock_flow/late_drop_select_evidence.json
          spikes/phase2_stock_flow/forwarded_drop.patch
          spikes/phase2_stock_flow/forwarded_drop_evidence.json
            spikes/phase2_stock_flow/mode_predicate.patch
            spikes/phase2_stock_flow/mode_predicate_evidence.json
            spikes/phase2_stock_flow/config_banks.patch
            spikes/phase2_stock_flow/config_banks_evidence.json
            spikes/phase2_stock_flow/wire300_hold175_evidence.json
            spikes/phase2_stock_flow/wire300_hold250_evidence.json
            spikes/phase2_stock_flow/wire300_hold275_iter100_evidence.json
        if-no-files-found: warn
