name: gds-lane-slew-screen

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gds-lane-slew-screen-3393eea
  cancel-in-progress: false

jobs:
  harden:
    name: Isolated slew comparison (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        variant: [none, lane]
    env:
      PDK_ROOT: /home/runner/pdk
      CANDIDATE_SHA: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
      GRT_ADJUSTMENT: "0.16"
      VARIANT: ${{ matrix.variant }}

    steps:
      - name: Check out the measured R4 candidate
        uses: actions/checkout@v6
        with:
          ref: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
          fetch-depth: 0
          submodules: recursive

      - name: Check out experiment helpers
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-src

      - name: Verify unchanged hardware for placement comparison change
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git diff --name-only)"
          sha256sum src/config.json src/trw_pin_io.v

      - name: Check out Tiny Tapeout tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ihp-sg13cmos5l
          path: tt

      - name: Check out the pinned IHP installer
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: ihp-cmos5l
          path: .tt-gds-action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tt/requirements.txt

      - name: Install Tiny Tapeout prerequisites
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librsvg2-bin pngquant ghdl-llvm
          version: tinytapeout_gds_action

      - name: Install flow dependencies
        run: pip install -r tt/requirements.txt

      - name: Install IHP PDK
        run: ./.tt-gds-action/install_sg13cmos5l.sh

      - name: Install pinned LibreLane
        run: pip install librelane==3.1.0.dev3

      - name: Download the audited all-corner placement screen
        uses: actions/download-artifact@v7
        with:
          name: gds-placement-multicorner-timing-placement-37408506116
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37408506116

      - name: Validate artifact provenance and unchanged hardware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/37408506116" > /tmp/placement-source-run.json
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git diff --name-only -- src info.yaml macro)"
          python - <<'PYCODE'
          import json
          from pathlib import Path
          run = json.loads(Path('/tmp/placement-source-run.json').read_text())
          assert run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/gds-placement-multicorner-screen.yaml'
          assert run['head_sha'] == 'f4bc126' or run['head_sha'].startswith('f4bc126')
          assert Path.cwd() == Path('/home/runner/work/protocol-emulator-asic/protocol-emulator-asic')
          PYCODE

      - name: Build pinned region-reservation image
        run: docker build --tag tripwire-hotspot:local --build-arg SPLIT_TARGET=${{ matrix.variant }} --file workflow-src/scripts/ci/Dockerfile.openroad-slew workflow-src/scripts/ci

      - name: Split one audited net and screen all-corner timing
        timeout-minutes: 80
        run: python workflow-src/scripts/ci/slew_screen.py

      - name: Upload matched screen evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gds-lane-slew-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            runs/rtl-grt-screen/**
            runs/slew-screen/**
            src/**
            info.yaml
          if-no-files-found: warn
