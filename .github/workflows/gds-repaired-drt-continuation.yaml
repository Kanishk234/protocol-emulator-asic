name: gds-repaired-drt-continuation

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Full GDS run containing the original stage-39 checkpoint
        required: true
        default: "37037880327"
        type: string
      repair_run_id:
        description: Successful signoff-aware zero-margin timing repair run
        required: true
        default: "37185455158"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: gds-repaired-drt-${{ inputs.repair_run_id }}
  cancel-in-progress: false

jobs:
  detailed-route:
    name: R4 repaired timing and detailed-route continuation
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PDK_ROOT: /home/runner/pdk
      CANDIDATE_SHA: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      OPENROAD_THREADS: "4"
      GRT_ADJUSTMENT: "0.16"

    steps:
      - name: Check out the exact R4 candidate at the artifact's original path
        uses: actions/checkout@v6
        with:
          ref: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
          fetch-depth: 0
          submodules: recursive

      - name: Check out workflow helpers
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-src

      - name: Check out Tiny Tapeout tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ihp-sg13cmos5l
          path: tt

      - name: Check out the pinned IHP installer
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: ihp-cmos5l
          path: .tt-gds-action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tt/requirements.txt

      - name: Install Tiny Tapeout prerequisites
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librsvg2-bin pngquant ghdl-llvm
          version: tinytapeout_gds_action

      - name: Install flow dependencies
        run: pip install -r tt/requirements.txt

      - name: Install IHP PDK
        run: ./.tt-gds-action/install_sg13cmos5l.sh

      - name: Install pinned LibreLane
        run: pip install librelane==3.1.0.dev3

      - name: Download the full GDS checkpoint artifact
        uses: actions/download-artifact@v7
        with:
          name: GDS_logs-${{ inputs.source_run_id }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Download the audited repaired checkpoint
        uses: actions/download-artifact@v7
        with:
          name: gds-postgrt-timing-${{ inputs.repair_run_id }}
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.repair_run_id }}

      - name: Validate candidate and repaired artifact provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPAIR_RUN_ID: ${{ inputs.repair_run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REPAIR_RUN_ID" > /tmp/repair-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          run = json.loads(Path("/tmp/repair-run.json").read_text())
          assert run["conclusion"] == "success"
          assert run["path"] == ".github/workflows/gds-postgrt-timing-experiment.yaml"
          assert Path.cwd().resolve() == Path("/home/runner/work/protocol-emulator-asic/protocol-emulator-asic")
          expected = {"TRW_LANES": "2", "TRW_UNITS": "4", "TRW_PC_UNITS_BITSYNC": "4'b0001"}
          defs = Path("src/trw_defs.vh").read_text().splitlines()
          for key, value in expected.items():
              assert f"`define {key} {value}" in defs
          source = Path("runs/wokwi/39-openroad-globalrouting/state_out.json")
          compare = json.loads(Path("runs/postgrt-timing/comparison.json").read_text())
          assert Path(compare["before_state"]).resolve() == source.resolve()
          print("Pinned R4 hardware; successful zero-margin repair validated further by helper")
          PY

      - name: Repair antenna, recheck corners, and route the repaired state
        timeout-minutes: 330
        run: |
          set -euo pipefail
          python workflow-src/scripts/ci/repaired_route.py

      - name: Upload repaired continuation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gds-repaired-drt-${{ github.run_id }}
          path: |
            runs/repaired-route/**
            runs/postgrt-timing/comparison.json
            runs/postgrt-timing/repair/**
            runs/wokwi/43-openroad-stamidpnr-3/state_out.json
            runs/wokwi/44-openroad-detailedrouting/state_in.json
            src/config_merged.json
            src/config_repaired_*.json
            src/config_timing_*.json
          if-no-files-found: warn
