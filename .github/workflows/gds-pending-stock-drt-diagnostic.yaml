# Manual opt-in diagnostic only. Initial antenna exception is source-bound; final gates unchanged.
name: gds-pending-stock-drt-diagnostic
'on':
  workflow_dispatch:
    inputs:
      approved_diagnostic:
        description: One approved diagnostic on source43390348317; source screen stays unqualified
        required: true
        type: boolean
        default: false
  push:
    branches:
    - main
    paths:
    - .github/workflows/gds-pending-stock-drt-diagnostic.yaml
permissions:
  contents: read
  actions: read
concurrency:
  group: gds-pending-stock-drt-diagnostic-43390348317
  cancel-in-progress: false
jobs:
  route:
    name: One stock detailed-routing diagnostic; no source qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_RUN: '43390348317'
      SOURCE_ARTIFACT: official-dev4-pending-polarity-43390348317
      PDK_ROOT: /home/runner/pdk
      DIAGNOSTIC_DRT_APPROVAL: '43390348317'
    steps:
    - name: Check out route tools
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Verify and download the approved diagnostic source screen
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\ngh api \"repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN\" > official-dev4-source-run.json\n\
        gh run download \"$SOURCE_RUN\" --repo \"$GITHUB_REPOSITORY\" --name \"$SOURCE_ARTIFACT\" --dir frozen-screen\n\
        python - <<'PY'\nimport json, shutil\nfrom pathlib import Path\nrun = json.loads(Path('official-dev4-source-run.json').read_text())\n\
        assert run['id'] == 43390348317\nassert run['head_sha'] == '258186504e4b9f73d2711067e456494def705d2b'\n\
        assert run['head_branch'] == 'main' and run['conclusion'] == 'failure'\nassert run['path'] == '.github/workflows/gds-official-dev4-pending-polarity-screen.yaml'\n\
        frozen = Path('frozen-screen')\nfor name in ('runs', 'src', 'macro'):\n    target = Path(name)\n    if target.exists():\
        \ shutil.rmtree(target)\nfor name in ('runs', 'src', 'macro'):\n    source = frozen / name\n    if source.exists():\
        \ shutil.copytree(source, Path(name))\nshutil.copy2(frozen / 'info.yaml', 'info.yaml')\nfor name in ('compatibility-input.json',\
        \ 'compatibility-generated.json',\n             'compatibility-engine.json', 'compatibility-image.json',\n\
        \             'compatibility-openroad.txt'):\n    if (frozen / name).exists(): shutil.copy2(frozen / name,\
        \ name)\nPY\n"
    - name: Set up stock dev4 tools
      uses: actions/checkout@v6
      with:
        repository: TinyTapeout/tt-support-tools
        ref: 9d13ff3e3e6202090740110438c6a10c1d62ca0f
        path: tt
    - name: Install Python dependencies and LibreLane
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: tt/requirements.txt
    - name: Install stock tool dependencies
      run: 'pip install -r tt/requirements.txt

        pip install librelane==3.1.0.dev4

        '
    - name: Verify stock physical engine identity
      run: 'set -euo pipefail

        docker pull ghcr.io/librelane/librelane:3.1.0.dev4

        docker image inspect ghcr.io/librelane/librelane:3.1.0.dev4 > compatibility-image-route.json

        docker run --rm ghcr.io/librelane/librelane:3.1.0.dev4 openroad -version > compatibility-openroad-route.txt

        python - <<''PY''

        import json

        from pathlib import Path

        image = json.loads(Path(''compatibility-image-route.json'').read_text())[0]

        assert ''ghcr.io/librelane/librelane@sha256:af2405f5d48d8fe14d406ecce913811177a95e365e3b625859677307cace2469''
        in image[''RepoDigests'']

        assert Path(''compatibility-openroad-route.txt'').read_text().strip() == ''dcf36133a369abc8f3c5e5738cd4d82e4903c0e0''

        PY

        '
    - name: Recheck timing/electrical gates and the approved antenna-only exception
      timeout-minutes: 30
      run: python scripts/ci/pending_stock_drt_diagnostic.py prepare
    - name: Run stock detailed routing only
      timeout-minutes: 320
      run: python scripts/ci/pending_stock_drt_diagnostic.py route
    - name: Upload route checkpoint for separate extraction job
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pending-stock-diagnostic-drtroute-${{ github.run_id }}
        path: 'runs/pending-diagnostic-route/**

          runs/pending-diagnostic-pre-route-gates.json

          runs/pending-diagnostic-pre-route-timing/**

          official-dev4-source-run.json

          compatibility-image-route.json

          compatibility-openroad-route.txt

          '
        if-no-files-found: warn
    if: github.event_name == 'workflow_dispatch' && inputs.approved_diagnostic
  extraction:
    name: Strict extracted diagnostic gates; no Phase2 signoff
    needs: route
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_RUN: '43390348317'
      SOURCE_ARTIFACT: official-dev4-pending-polarity-43390348317
      PDK_ROOT: /home/runner/pdk
      DIAGNOSTIC_DRT_APPROVAL: '43390348317'
    steps:
    - name: Check out route tools
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Restore the exact source screen checkpoint
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\ngh api \"repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN\" > official-dev4-source-run.json\n\
        gh run download \"$SOURCE_RUN\" --repo \"$GITHUB_REPOSITORY\" --name \"$SOURCE_ARTIFACT\" --dir frozen-screen\n\
        python - <<'PY'\nimport json, shutil\nfrom pathlib import Path\nrun = json.loads(Path('official-dev4-source-run.json').read_text())\n\
        assert run['id'] == 43390348317\nassert run['head_sha'] == '258186504e4b9f73d2711067e456494def705d2b'\n\
        assert run['head_branch'] == 'main' and run['conclusion'] == 'failure'\nassert run['path'] == '.github/workflows/gds-official-dev4-pending-polarity-screen.yaml'\n\
        frozen = Path('frozen-screen')\nfor name in ('runs', 'src', 'macro'):\n    target = Path(name)\n    if target.exists():\
        \ shutil.rmtree(target)\nfor name in ('runs', 'src', 'macro'):\n    source = frozen / name\n    if source.exists():\
        \ shutil.copytree(source, Path(name))\nshutil.copy2(frozen / 'info.yaml', 'info.yaml')\nfor name in ('compatibility-input.json',\
        \ 'compatibility-generated.json',\n             'compatibility-engine.json', 'compatibility-image.json',\n\
        \             'compatibility-openroad.txt'):\n    if (frozen / name).exists(): shutil.copy2(frozen / name,\
        \ name)\nPY\n"
    - name: Download the completed DRT artifact
      uses: actions/download-artifact@v7
      with:
        name: pending-stock-diagnostic-drtroute-${{ github.run_id }}
        path: route-artifact
    - name: Restore only the routed outputs
      run: 'set -euo pipefail

        cp -a route-artifact/runs/pending-diagnostic-route runs/

        cp -a route-artifact/runs/pending-diagnostic-pre-route-gates.json runs/

        '
    - name: Install exact dev4 tools for extraction
      uses: actions/checkout@v6
      with:
        repository: TinyTapeout/tt-support-tools
        ref: 9d13ff3e3e6202090740110438c6a10c1d62ca0f
        path: tt
    - name: Set up extraction environment
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: tt/requirements.txt
    - name: Install stock tool dependencies
      run: 'pip install -r tt/requirements.txt

        pip install librelane==3.1.0.dev4

        '
    - name: Verify stock physical engine identity
      run: 'set -euo pipefail

        docker pull ghcr.io/librelane/librelane:3.1.0.dev4

        docker image inspect ghcr.io/librelane/librelane:3.1.0.dev4 > compatibility-image-extract.json

        docker run --rm ghcr.io/librelane/librelane:3.1.0.dev4 openroad -version > compatibility-openroad-extract.txt

        python - <<''PY''

        import json

        from pathlib import Path

        image = json.loads(Path(''compatibility-image-extract.json'').read_text())[0]

        assert ''ghcr.io/librelane/librelane@sha256:af2405f5d48d8fe14d406ecce913811177a95e365e3b625859677307cace2469''
        in image[''RepoDigests'']

        assert Path(''compatibility-openroad-extract.txt'').read_text().strip() == ''dcf36133a369abc8f3c5e5738cd4d82e4903c0e0''

        PY

        '
    - name: Run fresh extracted STA and signoff gates
      timeout-minutes: 90
      run: python scripts/ci/pending_stock_drt_diagnostic.py extract
    - name: Upload extracted results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pending-stock-diagnostic-extracted-${{ github.run_id }}
        path: 'runs/pending-diagnostic-extract-pdk/**

          runs/pending-diagnostic-extracted-gates.json

          runs/extracted-timing/**

          compatibility-image-extract.json

          compatibility-openroad-extract.txt

          '
        if-no-files-found: warn
run-name: Approved stock DRT diagnostic on pending-event checkpoint
