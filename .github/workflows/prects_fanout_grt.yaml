name: compact rebuilt placement paired routing
on:
  workflow_dispatch:
  push:
    branches: [efpga]
    paths:
      - 'test_internal/cloud_prects_fanout_grt.py'
      - '.github/workflows/prects_fanout_grt.yaml'
permissions:
  contents: read
  actions: read
concurrency:
  group: warp-prects-fanout-grt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PDK_ROOT: ${{ github.workspace }}/build/cloud_pdk
      LIBRELANE_IMAGE_OVERRIDE: ghcr.io/librelane/librelane@sha256:d109140b8f17fc54f4fca998beb8124f4949404ec52e339eebd2250854a18b5a
    steps:
      - uses: actions/checkout@v6
      - name: Fetch exact measured baseline and padded producer
        timeout-minutes: 12
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install librelane==3.1.0.dev3
          bash spikes/cloud/fetch_pdk.sh
          gh release download compact-checkpoint-20261006-iter8 -R "$GITHUB_REPOSITORY" --pattern fanout-preflight-source.tar.gz --dir build
          timeout 120s gh run download 38167697696 -R "$GITHUB_REPOSITORY" --name compact-reset-combined-38167697696 --dir build/prects_fanout_grt_input/baseline
          timeout 120s gh run download 38320631258 -R "$GITHUB_REPOSITORY" --name compact-prects-fanout-38320631258 --dir build/prects_fanout_grt_input/padded
          timeout 120s gh run download 38101639866 -R "$GITHUB_REPOSITORY" --name compact-fanout-local-grt-38101639866 --dir build/prects_fanout_grt_input/previous
      - name: Provision pinned EDA image before native timers
        timeout-minutes: 5
        run: docker pull "$LIBRELANE_IMAGE_OVERRIDE"
      - name: Paired unchanged policy and native hotspot collection
        timeout-minutes: 34
        run: |
          source .venv/bin/activate
          python test_internal/cloud_prects_fanout_grt.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compact-prects-fanout-grt-${{ github.run_id }}
          path: build/prects_fanout_grt/
          retention-days: 3
