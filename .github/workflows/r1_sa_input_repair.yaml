name: R1 proved unused-input native repair
on:
  workflow_dispatch:
  push:
    branches: [efpga]
    paths: [.github/workflows/r1_sa_input_repair.yaml]
permissions:
  contents: read
  actions: read
concurrency:
  group: warp-r1-sa-input-repair
  cancel-in-progress: false
jobs:
  native:
    if: github.ref == 'refs/heads/efpga'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PDK_ROOT: ${{ github.workspace }}/build/sa_pdk
      PYTHONPATH: tools:test_internal:spikes/r1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Authenticate original native exports and new SA image
        timeout-minutes: 18
        run: |
          bash scripts/setup_venv.sh
          source .venv/bin/activate
          python - <<'PY'
          import json,os
          from pathlib import Path
          from assembly_fetch import api,admit_run,artifact
          from sa_input_repair import prepare
          sources=json.loads(Path('spikes/r1/routed_timing_sources.json').read_text())['sources']
          sources={name:sources[name] for name in ('capsule','native')}
          sources['functional']={
            'run':{'id':44673352765,'head_sha':'def28bcd47386e31659238fb93263df46cb771e3','head_branch':'efpga','run_attempt':1,'conclusion':'failure','path':'.github/workflows/r1_sa_functional.yaml'},
            'artifact':{'id':14601335480,'name':'r1-sa-native-44673352765','digest':'sha256:5e707e39f53e41946637d38bb9823cf1f5333903a0ed95d46bb9428ef0c0837e','size_in_bytes':8667881,'source_run':44673352765},'member':'sa_functional'}
          repo=os.environ['GITHUB_REPOSITORY'];target=Path('build/sa_sources').resolve();target.mkdir(parents=True,exist_ok=False)
          roots={}
          for name,row in sources.items():
              producer=api(f'repos/{repo}/actions/runs/{row["run"]["id"]}')
              admit_run(producer,row['run'])
              roots[name]=str(artifact(repo,row['artifact'],target)/row['member'])
              (target/(name+'.producer.json')).write_text(json.dumps(producer,indent=2)+'\n')
          (target/'locations.json').write_text(json.dumps(roots,indent=2)+'\n')
          prepare(**roots,out=Path('build/sa_input_repair'))
          PY
          bash spikes/cloud/fetch_pdk.sh
          mkdir -p build/sa_iverilog
          curl -sfL https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb -o build/sa_iverilog.deb
          dpkg-deb -x build/sa_iverilog.deb build/sa_iverilog
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          roots=json.loads(Path('build/sa_sources/locations.json').read_text())
          expected=json.loads((Path(roots['capsule'])/'functional/quiescent/configured-smoke.json').read_text())['tool_binary_sha256']
          for name,digest in expected.items():
              assert hashlib.sha256((Path('build/sa_iverilog/usr/bin')/name).read_bytes()).hexdigest()==digest
          PY
      - name: Preserve failing image and test seven proved selector combinations
        timeout-minutes: 12
        run: |
          source .venv/bin/activate
          timeout --kill-after=10s 600s python spikes/r1/sa_input_repair.py run --out build/sa_input_repair \
            --pdk "$PDK_ROOT/ihp-sg13cmos5l" --icarus build/sa_iverilog > build/sa_input_repair/native.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r1-sa-input-repair-${{ github.run_id }}
          path: |
            build/sa_input_repair/
            build/sa_sources/*.producer.json
            build/sa_sources/*.metadata.json
          include-hidden-files: true
          retention-days: 90
