name: gds-congestion-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gds-congestion-diagnostic
  cancel-in-progress: false

jobs:
  global-route:
    name: R4 bin-level congestion report
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PDK_ROOT: /home/runner/pdk
      CANDIDATE_SHA: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
      TRIPWIRE_GRT_REPORT: ${{ github.workspace }}/candidate/runs/congestion-diag/39-openroad-globalrouting/congestion.rpt
      LIBRELANE_IMAGE_OVERRIDE: tripwire-librelane-grt:${{ github.run_id }}

    steps:
      - name: Check out workflow helpers
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-src

      - name: Check out the measured R4 candidate
        uses: actions/checkout@v6
        with:
          ref: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
          path: candidate
          fetch-depth: 0
          submodules: recursive

      - name: Check out Tiny Tapeout tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ihp-sg13cmos5l
          path: candidate/tt

      - name: Check out the pinned IHP installer
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: ihp-cmos5l
          path: candidate/.tt-gds-action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: candidate/tt/requirements.txt

      - name: Install Tiny Tapeout prerequisites
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librsvg2-bin pngquant ghdl-llvm
          version: tinytapeout_gds_action

      - name: Install flow dependencies
        working-directory: candidate
        run: pip install -r tt/requirements.txt

      - name: Install IHP PDK
        working-directory: candidate
        run: ./.tt-gds-action/install_sg13cmos5l.sh

      - name: Install pinned LibreLane
        run: pip install librelane==3.1.0.dev3

      - name: Validate candidate and prepare config
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path("src/config.json").read_text())
          assert float(cfg["CLOCK_PERIOD"]) == 20.0
          assert int(cfg["PL_TARGET_DENSITY_PCT"]) == 56

          defs = Path("src/trw_defs.vh").read_text().splitlines()
          expected = {
              "TRW_LANES": "2",
              "TRW_UNITS": "4",
              "TRW_PC_UNITS_PULSE": "4'b0001",
              "TRW_PC_UNITS_CARRIER": "4'b0001",
              "TRW_PC_UNITS_BITSYNC": "4'b0001",
          }
          for name, value in expected.items():
              assert f"`define {name} {value}" in defs, name
          print("Pinned candidate: 3393eea9a58c5cad9077cc360a8515d0e5ec8284")
          print("Candidate shape: 2 lanes, 4 pin units, U0 full; 20 ns; density 56%")
          PY
          python tt/tt_tool.py --create-user-config --ihp

      - name: Build diagnostic LibreLane image
        run: |
          set -euo pipefail
          docker build \
            --build-arg "TRIPWIRE_GRT_REPORT=$TRIPWIRE_GRT_REPORT" \
            --tag "$LIBRELANE_IMAGE_OVERRIDE" \
            --file workflow-src/scripts/ci/Dockerfile.openroad-congestion \
            workflow-src/scripts/ci

      - name: Run only through GlobalRouting and save its congestion report
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p runs/congestion-diag
          python -m librelane \
            --pdk-root "$PDK_ROOT" \
            --docker-no-tty \
            --dockerized \
            --pdk ihp-sg13cmos5l \
            --manual-pdk \
            --run-tag congestion-diag \
            --force-run-dir runs/congestion-diag \
            --hide-progress-bar \
            --to OpenROAD.GlobalRouting \
            src/config_merged.json
          test -s "$TRIPWIRE_GRT_REPORT"
          ls -lh "$TRIPWIRE_GRT_REPORT"

      - name: Upload GRT diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gds-congestion-${{ github.run_id }}
          path: |
            candidate/runs/congestion-diag/**
            candidate/src/config_merged.json
            candidate/src/user_config.json
          if-no-files-found: warn
