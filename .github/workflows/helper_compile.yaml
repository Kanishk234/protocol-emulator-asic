name: baseline primitive helper compiler screen
on:
  push:
    branches: [efpga]
    paths:
      - 'tools/compile/helpers/**'
      - 'test_internal/test_helper_loaded.py'
      - '.github/workflows/helper_compile.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: warp-helper-compile-${{ github.ref }}
  cancel-in-progress: false
env:
  OSS_CAD_SUITE_TAG: '2026-06-29'
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Python prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk iverilog
      - name: Cache pinned Yosys suite
        id: ocs
        uses: actions/cache@v5
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-${{ env.OSS_CAD_SUITE_TAG }}
      - name: Fetch pinned Yosys suite
        if: steps.ocs.outputs.cache-hit != 'true'
        run: |
          D=${OSS_CAD_SUITE_TAG//-/}
          curl -sfL -o /tmp/warp-seed-ocs.tgz "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$OSS_CAD_SUITE_TAG/oss-cad-suite-linux-x64-$D.tgz"
          tar -xzf /tmp/warp-seed-ocs.tgz -C ~
      - name: Cache pinned nextpnr suite
        uses: actions/cache@v5
        with:
          path: ~/.cache/warp/ocs-2026-09-27
          key: oss-cad-suite-nextpnr-2026-09-27
      - name: Install pinned project tools and tile library
        run: |
          scripts/setup_venv.sh
          source .venv/bin/activate
          bash scripts/fetch_nextpnr.sh
          bash scripts/fetch_tiles.sh
      - name: Compile primitive-aware helper example on frozen G1
        timeout-minutes: 15
        run: |
          source .venv/bin/activate
          export PATH="$HOME/oss-cad-suite/bin:$PATH"
          export WARP_TILES="$GITHUB_WORKSPACE/build/third_party/fabulous-tiles"
          PYTHONPATH=tools python -m compile.compile --arch arch/warp_g1 --strict-ports --pins tools/compile/helpers/helper_demo.yaml -o build/helpers-demo tools/compile/helpers/helper_demo.v tools/compile/helpers/wp_delay.v tools/compile/helpers/wp_shift_transaction.v
      - name: Generate explicitly conditional operating report
        run: |
          source .venv/bin/activate
          printf '%s\n' '{"clock_hz":8000000,"sck_hz":1000000,"arrival_bytes_s":1000,"direction":"read","blackout_us":0,"overhead_us":0,"burst_bytes":1,"queue_bytes":2}' > build/helpers-demo/budget.json
          PYTHONPATH=tools python -m host.certificate build/helpers-demo/report.json arch/warp_g1/arch.yaml build/helpers-demo/budget.json > build/helpers-demo/planning.json
      - name: Load same-job helper image through real SPI and test chip ports
        timeout-minutes: 8
        run: |
          source .venv/bin/activate
          export WARP_TILES="$GITHUB_WORKSPACE/build/third_party/fabulous-tiles"
          export WARP_HELPER_BITFILE="$GITHUB_WORKSPACE/build/helpers-demo/helper_demo.wbit"
          export PYTHONPATH="$GITHUB_WORKSPACE/tools:$GITHUB_WORKSPACE/test_internal:$GITHUB_WORKSPACE/test"
          rm -f test/results.xml
          set -o pipefail
          make -C test WARP_FABRIC=rtl COCOTB_TEST_MODULES=test_helper_loaded 2>&1 | tee build/helpers-demo/loaded.log
          cp test/results.xml build/helpers-demo/loaded_results.xml
          python -c 'import xml.etree.ElementTree as E; r=E.parse("test/results.xml").getroot(); c=r.findall(".//testcase"); assert len(c)==1 and not r.findall(".//failure") and not r.findall(".//error") and not r.findall(".//skipped"), "Expected one actual passing loaded helper case"'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baseline-helper-compile-${{ github.run_id }}
          path: build/helpers-demo/
          retention-days: 3
