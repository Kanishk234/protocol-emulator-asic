name: R1 frozen context detailed routes
on:
  workflow_dispatch:
  push:
    branches: [efpga]
    paths: [.github/workflows/r1_detailed_contexts.yaml]
permissions:
  contents: read
  actions: read
concurrency:
  group: warp-r1-detailed-contexts
  cancel-in-progress: false
jobs:
  route:
    if: github.ref == 'refs/heads/efpga'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        context: [primitive4, lut0, lut1, lut2, lut3, lut4, lut5, northwest, southwest, west_io, east_io, north0, north1, north2, north3, north4, north5, northeast, south0, south1, south2, south3, south4, south5, southeast]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check routing guards
        run: |
          bash scripts/setup_venv.sh
          source .venv/bin/activate
          python -m pytest -q tools/profiling/tests/test_r1_detailed_leaf.py tools/profiling/tests/test_r1_detailed_context.py
      - name: Authenticate exact frozen source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source .venv/bin/activate
          PYTHONPATH=tools python - <<'PY'
          import hashlib, json, os, subprocess, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'spikes/r1')
          from unused_lut_probe import SOURCE_RUN, ARTIFACT_ID, ARCHIVE_SHA, context
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{SOURCE_RUN}']))
          artifact = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{ARTIFACT_ID}']))
          context(run, artifact)
          archive = Path(os.environ['RUNNER_TEMP']) / 'original-timing.zip'
          with archive.open('wb') as output:
              subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{ARTIFACT_ID}/zip'], stdout=output, check=True)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == ARCHIVE_SHA
          root = Path('build/r1_timing'); root.mkdir(parents=True, exist_ok=False)
          with zipfile.ZipFile(archive) as bundle:
              names = bundle.namelist()
              assert len(names) == len(set(names))
              assert all(not Path(n).is_absolute() and '..' not in Path(n).parts for n in names)
              bundle.extractall(root)
          Path('build/unused-lut-source.json').write_text(json.dumps(dict(run=run, artifact=artifact), indent=2)+'\n')
          PY
          PYTHONPATH=tools python spikes/r1/detailed_context.py prepare --capsule build/r1_timing --case "${{ matrix.context }}" --out build/context_route
      - name: Detailed route frozen placement and guides
        timeout-minutes: 25
        run: |
          set +e
          timeout 1200s docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            ghcr.io/librelane/librelane@sha256:d109140b8f17fc54f4fca998beb8124f4949404ec52e339eebd2250854a18b5a \
            openroad -exit build/context_route/route.tcl > build/context_route/route.log 2>&1
          route_status=$?
          set -e
          printf '%s\n' "$route_status" > build/context_route/exit-code.txt
          exit "$route_status"
      - name: Require completed routing and unchanged inventories
        if: always()
        run: |
          source .venv/bin/activate
          PYTHONPATH=tools python spikes/r1/detailed_context.py audit --out build/context_route
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r1-detailed-context-${{ github.run_id }}-${{ matrix.context }}
          path: |
            build/context_route/
            build/unused-lut-source.json
          retention-days: 90
          if-no-files-found: error
