# Mask-input connectivity probe only; not full-design qualification.
name: guarded-word-preservation
run-name: guarded preservation (${{ inputs.primitive || 'paired' }})
'on':
  workflow_dispatch:
    inputs:
      primitive:
        description: Small primitive to measure; neither case qualifies the full design
        type: choice
        options: [paired, mask]
        default: paired
        required: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        protected:
        - 'false'
        - 'true'
    env:
      PDK_ROOT: /home/runner/pdk
      PROBE_PROTECTED: ${{ matrix.protected }}
      PROBE_KIND: ${{ inputs.primitive || 'paired' }}
    steps:
    - name: Check out project
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Prepare isolated guarded-word probe in ephemeral checkout
      run: |-
        set -euo pipefail
        python - <<'PYCODE'
        import hashlib, json, os, shutil, sys
        from pathlib import Path
        sys.path.insert(0, 'scripts/ci')
        from guarded_word_probe import PROTECTION_RX, MASK_PROTECTION_RX
        kind=os.environ['PROBE_KIND']
        assert kind in ('paired','mask')
        folder='guarded_word' if kind=='paired' else 'inline_guard'
        module='trw_guarded_reduce.v' if kind=='paired' else 'trw_guarded_mask.v'
        root=Path('spikes/phase2_stock_flow')/folder
        evidence=json.loads((root/'preflight.json').read_text())
        for source, target in [('probe.v','tt_um_tripwire.v'),(module,module)]:
            shutil.copy2(root/source, Path('src')/target)
            key=str(root/source)
            assert hashlib.sha256(Path('src',target).read_bytes()).hexdigest()==evidence['source_sha256'][key]
        p=Path('src/config.json'); d=json.loads(p.read_text())
        rx=PROTECTION_RX if kind=='paired' else MASK_PROTECTION_RX
        d.update(CLOCK_PERIOD=20, PL_TARGET_DENSITY_PCT=30, LINTER_INCLUDE_PDK_MODELS=True,
         RUN_POST_GRT_DESIGN_REPAIR=True, RUN_POST_GRT_RESIZER_TIMING=True,
         SYNTH_BUFFER_CELL='sg13cmos5l_buf_2/A/X', GRT_DESIGN_REPAIR_MAX_WIRE_LENGTH=20,
         RSZ_DONT_TOUCH_RX=rx if os.environ['PROBE_PROTECTED']=='true' else '$^')
        if kind=='mask': d['EXTRA_EXCLUDED_CELLS']=['sg13cmos5l_buf_1']
        p.write_text(json.dumps(d,indent=2)+'\n')
        PYCODE
    - name: Check out Tiny Tapeout tools
      uses: actions/checkout@v6
      with:
        repository: TinyTapeout/tt-support-tools
        ref: d66cf179e7bc4d296362ab7e2e3b344dc3c4f665
        path: tt
    - name: Check out the pinned IHP installer
      uses: actions/checkout@v6
      with:
        repository: TinyTapeout/tt-gds-action
        ref: 3412659307918422f3f0727917cf9b499aaca588
        path: .tt-gds-action
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: tt/requirements.txt
    - name: Install Tiny Tapeout prerequisites
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
      with:
        packages: librsvg2-bin pngquant ghdl-llvm
        version: tinytapeout_gds_action
    - name: Install flow dependencies
      run: pip install -r tt/requirements.txt
    - name: Install IHP PDK
      run: ./.tt-gds-action/install_sg13cmos5l.sh
    - name: Install pinned LibreLane
      run: pip install librelane==3.1.0.dev3
    - name: Verify the reference stock engine image
      run: |-
        set -euo pipefail
        docker pull ghcr.io/librelane/librelane:3.1.0.dev3
        python - <<'PYCODE'
        import json, subprocess
        from pathlib import Path
        source = json.loads(Path('spikes/phase2_stock_flow/shared_cluster100_postant_checkpoint.json').read_text())
        engine = source['toolchain']
        image = engine['stock_image']
        digests = json.loads(subprocess.check_output(['docker', 'image', 'inspect', image,
                            '--format', '{{json .RepoDigests}}'], text=True))
        assert image.rsplit(':', 1)[0] + '@' + engine['stock_digest'] in digests, 'Reference engine drift'
        Path('spikes/phase2_stock_flow/toolchain_preflight.json').write_text(json.dumps(engine, indent=2) + '\n')
        print('Verified reference unmodified stock engine digest')
        PYCODE
    - name: Generate stock TT project configuration
      run: |-
        python - <<'PYCODE'
        from pathlib import Path
        import os
        import yaml
        module='trw_guarded_reduce.v' if os.environ['PROBE_KIND']=='paired' else 'trw_guarded_mask.v'
        p=Path('info.yaml'); d=yaml.safe_load(p.read_text())
        assert d['project']['source_files'] == ['tt_um_tripwire.v']
        d['project']['source_files'].append(module)
        p.write_text(yaml.safe_dump(d,sort_keys=False))
        p=Path('test/Makefile'); text=p.read_text()
        assert text.count('PROJECT_SOURCES = tt_um_tripwire.v')==1
        p.write_text(text.replace('PROJECT_SOURCES = tt_um_tripwire.v',
                                 'PROJECT_SOURCES = tt_um_tripwire.v '+module))
        PYCODE
        python tt/tt_tool.py --create-user-config --ihp
    - name: Measure stock physical optimization and connectivity
      timeout-minutes: 30
      run: |-
        set -euo pipefail
        unset LIBRELANE_IMAGE_OVERRIDE TRIPWIRE_NATIVE_RUNTIME _LLN_OVERRIDE_OPENROAD PYTHONPATH
        mkdir -p runs
        mkdir runs/protected-probe
        python -m librelane --docker-no-tty --dockerized --pdk-root "$PDK_ROOT" --pdk ihp-sg13cmos5l --manual-pdk --run-tag protected-probe --force-run-dir runs/protected-probe --hide-progress-bar --to OpenROAD.STAMidPNR-3 src/config_merged.json
        python scripts/ci/guarded_word_probe.py runs/protected-probe --protected "$PROBE_PROTECTED" --kind "$PROBE_KIND"
        python - <<'PYCODE'
        import json,sys
        from pathlib import Path
        sys.path.insert(0,'scripts/ci')
        from native_stock_route import run_step
        state=list(Path('runs/protected-probe').glob('*-openroad-stamidpnr-3/state_out.json'))
        assert len(state)==1
        run_step(json.loads(Path('src/config_merged.json').read_text()),state[0],Path('runs/probe-antenna'),['OpenROAD.CheckAntennas'])
        PYCODE
    - name: Upload probe evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: guarded-${{ inputs.primitive || 'paired' }}-${{ matrix.protected }}-${{ github.run_id }}
        path: |-
          runs/**
          src/config*.json
          src/tt_um_tripwire.v
          src/trw_guarded_reduce.v
          src/trw_guarded_mask.v
          info.yaml
          test/Makefile
          spikes/phase2_stock_flow/guarded_word/preflight.json
          spikes/phase2_stock_flow/inline_guard/preflight.json
        if-no-files-found: warn
