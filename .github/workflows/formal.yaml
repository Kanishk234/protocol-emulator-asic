name: formal
on: [push, workflow_dispatch]

jobs:
  channels:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OSS_CAD_SUITE_TAG: '2026-06-29'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Cache OSS CAD Suite
        id: ocs
        uses: actions/cache@v5
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-${{ env.OSS_CAD_SUITE_TAG }}
      - name: Install OSS CAD Suite
        if: steps.ocs.outputs.cache-hit != 'true'
        run: |
          D=${OSS_CAD_SUITE_TAG//-/}
          curl -sfL -o /tmp/ocs.tgz "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$OSS_CAD_SUITE_TAG/oss-cad-suite-linux-x64-$D.tgz"
          tar -xzf /tmp/ocs.tgz -C ~
      - name: Prepare project venv
        run: scripts/setup_venv.sh
      - name: Native channel, RX and lean-unit formal checks
        run: |
          source .venv/bin/activate
          export PATH="$PATH:$HOME/oss-cad-suite/bin"
          python scripts/formal_channels.py
          python scripts/formal_pin_rx.py
          python scripts/formal_pin_unit.py
      - name: Fabric isolation, lane decode and scheduling, SRAM rotation, and TX cursor
        run: |
          source .venv/bin/activate
          export PATH="$PATH:$HOME/oss-cad-suite/bin"
          python scripts/formal_decode.py
          python scripts/formal_host_slots.py
          python scripts/formal_scheduler.py
          python scripts/formal_sram_rotation.py
          python scripts/formal_tx_arithmetic.py
          python scripts/formal_tx_cursor.py
          mkdir -p build
          cd formal
          sby -f --prefix ../build/formal-fabric-isolation fabric_isolation.sby
      - name: Pad ownership and open-drain proofs
        run: |
          export PATH="$PATH:$HOME/oss-cad-suite/bin"
          mkdir -p build
          cd formal
          sby -f --prefix ../build/formal-pad-ownership pad_ownership.sby
          sby -f --prefix ../build/formal-pad-open-drain pad_open_drain.sby
      - name: Scratch status-merge candidate proofs (not hardware adoption)
        run: |
          source .venv/bin/activate
          export PATH="$PATH:$HOME/oss-cad-suite/bin"
          python scripts/formal_status_queue.py
          python scripts/formal_status_candidate_integration.py
      - name: Upload proof logs and counterexamples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: formal-channels
          path: |
            build/formal_channels/
            build/formal_pin_rx/
            build/formal_pin_unit/
            build/formal_decode/
            build/formal_host_slots/
            build/formal_scheduler/
            build/trw-rotation/
            build/formal_tx_arithmetic/
            build/formal_tx_cursor/
            build/formal-fabric-isolation_*/
            build/formal-pad-ownership_*/
            build/formal-pad-open-drain_*/
            build/formal_status_queue/
            build/formal_status_candidate_integration/
