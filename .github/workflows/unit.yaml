name: unit
# WARP's own workflow: Python tool tests (pytest over tools/) and the RTL tests of every
# design-set protocol user design (protocols/*/test, cocotb + Icarus) against the
# independent reference models in tools/refmodels/, with sigrok as a second decoder.
on: [push, workflow_dispatch]

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          # 3.12: fabulous-fasm 0.2.0 requires it (as FABulous does; local venv is 3.12)
          python-version: '3.12'

      - name: Install Python packages
        # fabulous-fasm / fabulous-bit-gen: the versions FABulous-FPGA 2.2.0 pins (tools/compile tests)
        run: pip install -r test/requirements.txt hypothesis==6.168.1 pyyaml==6.0.3 pytest-xdist==3.8.0 fabulous-fasm==0.2.0 fabulous-bit-gen==0.3.1

      - name: pytest (tools)
        run: python -m pytest -q -n auto

  protocols:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Icarus and sigrok-cli
        run: sudo apt-get update && sudo apt-get install -y iverilog sigrok-cli

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -r test/requirements.txt

      - name: UART RTL tests (plain logic and hard primitives)
        run: |
          cd protocols/uart/test
          for args in "DIV=16" "DIV=13" "DIV=16 RUNTIME_DIV=1" "DIV=16 PRIMS=1" "DIV=13 PRIMS=1" "DIV=5 PRIMS=1"; do
            rm -f results.xml
            make $args
            ! grep -q failure results.xml
          done

      - name: SPI controller RTL tests (four modes, two speeds; plain logic and hard primitives)
        run: |
          cd protocols/spi_ctrl/test
          for args in "MODE=0" "MODE=1" "MODE=2" "MODE=3" "MODE=1 HALF=5" "MODE=2 HALF=7"                       "MODE=0 PRIMS=1" "MODE=1 PRIMS=1" "MODE=2 PRIMS=1" "MODE=3 PRIMS=1" "MODE=3 HALF=7 PRIMS=1"; do
            rm -f results.xml
            make $args
            ! grep -q failure results.xml
          done

      - name: I2C controller RTL tests (three speeds; plain logic and hard primitives)
        run: |
          cd protocols/i2c_ctrl/test
          for args in "Q=4" "Q=2" "Q=7" "Q=4 PRIMS=1" "Q=2 PRIMS=1" "Q=7 PRIMS=1"; do
            rm -f results.xml
            make $args
            ! grep -q failure results.xml
          done

      - name: WS2812 RTL tests (held-out H1; plain logic and hard primitives)
        run: |
          cd protocols/ws2812/test
          for args in "PRIMS=0" "PRIMS=1"; do
            rm -f results.xml
            make $args
            ! grep -q failure results.xml
          done

      - name: 1-Wire controller RTL tests (held-out H2; plain logic and hard primitives)
        run: |
          cd protocols/onewire/test
          for args in "PRIMS=0" "PRIMS=1"; do
            rm -f results.xml
            make $args
            ! grep -q failure results.xml
          done

      - name: SWD host engine RTL tests (held-out H3, with tools/board/swd.py; plain logic and hard primitives)
        run: |
          cd protocols/swd/test
          for args in "PRIMS=0" "PRIMS=1"; do
            rm -f results.xml
            make $args
            ! grep -q failure results.xml
          done

      - name: CAN 2.0A RTL tests (held-out H4; plain logic and hard primitives)
        run: |
          cd protocols/can/test
          for args in "PRIMS=0" "PRIMS=1"; do
            rm -f results.xml
            make $args
            ! grep -q failure results.xml
          done

      - name: I2C target RTL tests (three bus speeds; plain logic and hard primitives)
        run: |
          cd protocols/i2c_target/test
          for args in "Q=4" "Q=6" "Q=11" "Q=4 PRIMS=1" "Q=6 PRIMS=1" "Q=11 PRIMS=1"; do
            rm -f results.xml
            make $args
            ! grep -q failure results.xml
          done
