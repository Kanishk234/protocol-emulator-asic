name: gds-drt-continuation

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GRT diagnostic run whose saved checkpoint will be continued
        required: true
        default: "36949467252"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: gds-drt-continuation-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  detailed-route:
    name: R4 16% detailed-route continuation
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PDK_ROOT: /home/runner/pdk
      CANDIDATE_SHA: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      GRT_ADJUSTMENT: "0.16"
      TRIPWIRE_GRT_REPORT: ${{ github.workspace }}/candidate/runs/detailed-route-16/congestion.rpt
      LIBRELANE_IMAGE_OVERRIDE: tripwire-librelane-drt:${{ github.run_id }}

    steps:
      - name: Check out workflow helpers
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-src

      - name: Check out the measured R4 candidate
        uses: actions/checkout@v6
        with:
          ref: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
          path: candidate
          fetch-depth: 0
          submodules: recursive

      - name: Check out Tiny Tapeout tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ihp-sg13cmos5l
          path: candidate/tt

      - name: Check out the pinned IHP installer
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: ihp-cmos5l
          path: candidate/.tt-gds-action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: candidate/tt/requirements.txt

      - name: Install Tiny Tapeout prerequisites
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librsvg2-bin pngquant ghdl-llvm
          version: tinytapeout_gds_action

      - name: Install flow dependencies
        working-directory: candidate
        run: pip install -r tt/requirements.txt

      - name: Install IHP PDK
        working-directory: candidate
        run: ./.tt-gds-action/install_sg13cmos5l.sh

      - name: Install pinned LibreLane
        run: pip install librelane==3.1.0.dev3

      - name: Download the GRT checkpoint artifact
        uses: actions/download-artifact@v7
        with:
          name: gds-congestion-${{ inputs.source_run_id }}
          path: candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Validate checkpoint and candidate
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -s runs/congestion-diag/39-openroad-globalrouting/state_out.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path("src/config.json").read_text())
          assert float(cfg["CLOCK_PERIOD"]) == 20.0
          assert int(cfg["PL_TARGET_DENSITY_PCT"]) == 56

          defs = Path("src/trw_defs.vh").read_text().splitlines()
          expected = {
              "TRW_LANES": "2",
              "TRW_UNITS": "4",
              "TRW_PC_UNITS_PULSE": "4'b0001",
              "TRW_PC_UNITS_CARRIER": "4'b0001",
              "TRW_PC_UNITS_BITSYNC": "4'b0001",
          }
          for name, value in expected.items():
              assert f"`define {name} {value}" in defs, name

          step = Path("runs/congestion-diag/39-openroad-globalrouting")
          step_cfg = json.loads((step / "config.json").read_text())
          assert float(step_cfg["GRT_ADJUSTMENT"]) == 0.16
          state = json.loads((step / "state_out.json").read_text())
          for key in ("odb", "def", "sdc", "pnl"):
              assert Path(state[key]).is_file(), f"missing checkpoint {key}: {state[key]}"
          print("Pinned candidate: 3393eea9a58c5cad9077cc360a8515d0e5ec8284")
          print("Candidate shape: 2 lanes, 4 pin units, U0 full; 20 ns; density 56%")
          print("Checkpoint: GRT_ADJUSTMENT=0.16; ODB/DEF/SDC/netlist present")
          PY

      - name: Build pinned LibreLane image
        run: |
          set -euo pipefail
          docker build \
            --build-arg "TRIPWIRE_GRT_REPORT=$TRIPWIRE_GRT_REPORT" \
            --tag "$LIBRELANE_IMAGE_OVERRIDE" \
            --file workflow-src/scripts/ci/Dockerfile.openroad-congestion \
            workflow-src/scripts/ci

      - name: Continue from the saved GRT state through detailed routing
        working-directory: candidate
        timeout-minutes: 330
        run: |
          set -euo pipefail
          mkdir -p runs/detailed-route-16
          python -m librelane \
            --pdk-root "$PDK_ROOT" \
            --docker-no-tty \
            --dockerized \
            --pdk ihp-sg13cmos5l \
            --manual-pdk \
            --run-tag detailed-route-16 \
            --force-run-dir runs/detailed-route-16 \
            --hide-progress-bar \
            --with-initial-state runs/congestion-diag/39-openroad-globalrouting/state_out.json \
            --from OpenROAD.DetailedRouting \
            --to OpenROAD.DetailedRouting \
            --override-config "GRT_ADJUSTMENT=$GRT_ADJUSTMENT" \
            src/config_merged.json

      - name: Upload detailed-route continuation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gds-drt-continuation-${{ github.run_id }}
          path: |
            candidate/runs/detailed-route-16/**
            candidate/runs/congestion-diag/39-openroad-globalrouting/**
            candidate/src/config_merged.json
          if-no-files-found: warn
