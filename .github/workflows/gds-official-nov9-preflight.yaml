# Compatibility only: untouched stock engine, no timing qualification or detailed routing.
name: gds-official-nov9-preflight
run-name: Updated official toolchain compatibility (6x4 and 8x4)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: gds-official-nov9-preflight
  cancel-in-progress: false
jobs:
  compatibility:
    name: Stock dev4 compatibility (${{ matrix.tiles }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        tiles:
        - 6x4
        - 8x4
    env:
      PDK_ROOT: /home/runner/pdk
      STOCK_PROFILE: rtl_shared_minbuf2_host_idle_ff
      PORTABLE_VARIANT: clock75
    steps:
    - name: Check out project
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Prepare the full design with strict stock project inputs
      run: "set -euo pipefail\ngit apply --check spikes/phase2_stock_flow/verified_design_only.patch\ngit apply\
        \ spikes/phase2_stock_flow/verified_design_only.patch\ncp spikes/phase2_stock_flow/strict_project_config.json\
        \ src/config.json\nspikes/r3_sram/fetch_macro.sh macro/RM_IHPSG13_1P_512x16_c2_bm_bist\npython - <<'PYCODE'\n\
        import hashlib, json, subprocess\nfrom pathlib import Path\nmanifest = json.loads(Path('spikes/phase2_stock_flow/design_manifest.json').read_text())\n\
        for name, sha in manifest['files'].items():\n    assert hashlib.sha256(Path(name).read_bytes()).hexdigest()\
        \ == sha, name\nassert hashlib.sha256(Path('.github/workflows/gds.yaml').read_bytes()).hexdigest() == manifest['official_workflow_sha256']\n\
        macros = json.loads(Path('scripts/ci/fixtures/wire600_selective/promoted_source.json').read_text())['macro_files']\n\
        for name, sha in macros.items():\n    path = Path('macro/RM_IHPSG13_1P_512x16_c2_bm_bist') / name\n    assert\
        \ hashlib.sha256(path.read_bytes()).hexdigest() == sha, name\nconfig = json.loads(Path('src/config.json').read_text())\n\
        assert 'meta' not in config\nassert config['CLOCK_PERIOD'] == 20\nassert config['PL_TARGET_DENSITY_PCT']\
        \ == 56\nassert config['PL_RESIZER_SETUP_SLACK_MARGIN'] == 0\nassert config['CTS_APPLY_NDR'] == 'none'\n\
        assert config['CTS_SINK_CLUSTERING_SIZE'] == 8\nassert config['RUN_POST_GRT_DESIGN_REPAIR'] is True\nassert\
        \ config['GRT_DESIGN_REPAIR_MAX_WIRE_LENGTH'] == 300\nassert config['GRT_ADJUSTMENT'] == 0.16\nassert config['RUN_POST_GRT_RESIZER_TIMING']\
        \ is False\nassert config['PL_RESIZER_HOLD_SLACK_MARGIN'] == 0.275\nassert config['GRT_OVERFLOW_ITERS']\
        \ == 100\nassert 'GRT_ANTENNA_REPAIR_JUMPER_ONLY' not in config\npolicy = json.loads(Path('spikes/phase2_stock_flow/config_banks_evidence.json').read_text())\n\
        physical = json.loads(Path('spikes/phase2_stock_flow/wire300_hold175_evidence.json').read_text())\nassert\
        \ policy['project_config_sha256'] == physical['baseline_project_config_sha256']\nhold_control = json.loads(Path('spikes/phase2_stock_flow/wire300_hold250_evidence.json').read_text())\n\
        assert physical['candidate_project_config_sha256'] == hold_control['baseline_project_config_sha256']\nreserve\
        \ = json.loads(Path('spikes/phase2_stock_flow/wire300_hold275_iter100_evidence.json').read_text())\nassert\
        \ hold_control['candidate_project_config_sha256'] == reserve['baseline_project_config_sha256']\nassert hashlib.sha256(Path('src/config.json').read_bytes()).hexdigest()\
        \ == reserve['candidate_project_config_sha256']\nassert config['SYNTH_STRATEGY'] == 'DELAY 0'\nassert config['GRT_RESIZER_SETUP_SLACK_MARGIN']\
        \ == 0\nassert config['GRT_RESIZER_HOLD_SLACK_MARGIN'] == 0.125\nassert not any(k.startswith('TRIPWIRE_')\
        \ for k in config)\nassert 'PNR_SDC_FILE' not in config and 'SIGNOFF_SDC_FILE' not in config\nassert 'ERROR_ON_MAGIC_DRC'\
        \ not in config and 'ERROR_ON_ILLEGAL_OVERLAPS' not in config\nevidence = json.loads(Path('spikes/phase2_stock_flow/late_drop_select_evidence.json').read_text())\n\
        patch = Path('spikes/phase2_stock_flow/late_drop_select.patch')\nassert hashlib.sha256(patch.read_bytes()).hexdigest()\
        \ == evidence['patch_sha256']\nassert hashlib.sha256(Path('src/trw_chan_port.v').read_bytes()).hexdigest()\
        \ == evidence['baseline_sha256']\ndef source_hashes():\n    return {str(p): hashlib.sha256(p.read_bytes()).hexdigest()\
        \ for p in Path('src').rglob('*') if p.is_file()}\nbefore = source_hashes()\nsubprocess.run(['git', 'apply',\
        \ '--check', str(patch)], check=True)\nsubprocess.run(['git', 'apply', str(patch)], check=True)\nassert\
        \ source_hashes() == {**before, 'src/trw_chan_port.v': evidence['candidate_sha256']}\nprint('Verified late-select\
        \ channel variant:', evidence['candidate_sha256'])\nevidence = json.loads(Path('spikes/phase2_stock_flow/forwarded_drop_evidence.json').read_text())\n\
        patch = Path('spikes/phase2_stock_flow/forwarded_drop.patch')\nassert hashlib.sha256(patch.read_bytes()).hexdigest()\
        \ == evidence['patch_sha256']\nassert hashlib.sha256(Path('src/trw_chan_port.v').read_bytes()).hexdigest()\
        \ == evidence['baseline_sha256']\nbefore = source_hashes()\nsubprocess.run(['git', 'apply', '--check', str(patch)],\
        \ check=True)\nsubprocess.run(['git', 'apply', str(patch)], check=True)\nassert source_hashes() == {**before,\
        \ 'src/trw_chan_port.v': evidence['candidate_sha256']}\nprint('Verified forwarded-count channel variant:',\
        \ evidence['candidate_sha256'])\nevidence = json.loads(Path('spikes/phase2_stock_flow/mode_predicate_evidence.json').read_text())\n\
        patch = Path('spikes/phase2_stock_flow/mode_predicate.patch')\nassert hashlib.sha256(patch.read_bytes()).hexdigest()\
        \ == evidence['patch_sha256']\nfor name, sha in evidence['baseline_files'].items():\n    assert hashlib.sha256(Path(name).read_bytes()).hexdigest()\
        \ == sha, name\nbefore = source_hashes()\nsubprocess.run(['git', 'apply', '--check', str(patch)], check=True)\n\
        subprocess.run(['git', 'apply', str(patch)], check=True)\nassert source_hashes() == {**before, **evidence['candidate_files']}\n\
        print('Verified configuration mode-predicate variant:', evidence['candidate_files'])\npatch = Path('spikes/phase2_stock_flow/config_banks.patch')\n\
        assert hashlib.sha256(patch.read_bytes()).hexdigest() == policy['patch_sha256']\nfor name, sha in policy['baseline_files'].items():\n\
        \    assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == sha, name\nbefore = source_hashes()\n\
        subprocess.run(['git', 'apply', '--check', str(patch)], check=True)\nsubprocess.run(['git', 'apply', str(patch)],\
        \ check=True)\nassert source_hashes() == {**before, **policy['candidate_files']}\nprint('Verified parity-banked\
        \ configuration variant:', policy['candidate_files'])\nimport os\nprofiles = json.loads(Path('spikes/phase2_stock_flow/stock_control_profiles.json').read_text())\n\
        profile = os.environ['STOCK_PROFILE']\nassert profile in profiles['profiles'], 'Unknown physical control\
        \ profile'\nassert hashlib.sha256(Path('src/config.json').read_bytes()).hexdigest() == profiles['baseline_project_config_sha256']\n\
        selected = profiles['profiles'][profile]\nconfig.update(selected['changes'])\nblob = json.dumps(config,\
        \ indent=2) + '\\n'\nassert hashlib.sha256(blob.encode()).hexdigest() == selected['config_sha256']\nPath('src/config.json').write_text(blob)\n\
        if selected.get('rtl_patch'):\n    variant = selected['rtl_patch']\n    assert variant in ('late_arbitration',\
        \ 'shared_priority')\n    evidence = json.loads(Path(f'spikes/phase2_stock_flow/{variant}_evidence.json').read_text())\n\
        \    patch = Path(f'spikes/phase2_stock_flow/{variant}.patch')\n    assert hashlib.sha256(patch.read_bytes()).hexdigest()\
        \ == evidence['patch_sha256']\n    assert hashlib.sha256(Path('src/trw_lane.v').read_bytes()).hexdigest()\
        \ == evidence['baseline_sha256']\n    before = source_hashes()\n    subprocess.run(['git', 'apply', '--check',\
        \ str(patch)], check=True)\n    subprocess.run(['git', 'apply', str(patch)], check=True)\n    assert source_hashes()\
        \ == {**before, 'src/trw_lane.v': evidence['candidate_sha256']}\n    print('Verified equivalent priority\
        \ preselection:', variant, evidence['candidate_sha256'])\nif selected.get('config_word_select'):\n    evidence\
        \ = json.loads(Path('spikes/phase2_stock_flow/config_word_select_evidence.json').read_text())\n    patch\
        \ = Path('spikes/phase2_stock_flow/config_word_select.patch')\n    assert hashlib.sha256(patch.read_bytes()).hexdigest()\
        \ == evidence['patch_sha256']\n    for name, sha in evidence['baseline_files'].items():\n        assert\
        \ hashlib.sha256(Path(name).read_bytes()).hexdigest() == sha, name\n    assert hashlib.sha256(Path('src/trw_defs.vh').read_bytes()).hexdigest()\
        \ == evidence['defines_sha256']\n    before = source_hashes()\n    subprocess.run(['git', 'apply', '--check',\
        \ str(patch)], check=True)\n    subprocess.run(['git', 'apply', str(patch)], check=True)\n    assert source_hashes()\
        \ == {**before, **evidence['candidate_files']}\n    print('Verified configuration-word predecode source\
        \ delta')\nif selected.get('host_word_select'):\n    evidence = json.loads(Path('spikes/phase2_stock_flow/host_word_select_evidence.json').read_text())\n\
        \    patch = Path('spikes/phase2_stock_flow/host_word_select.patch')\n    assert hashlib.sha256(patch.read_bytes()).hexdigest()\
        \ == evidence['patch_sha256']\n    assert hashlib.sha256(Path('src/trw_host.v').read_bytes()).hexdigest()\
        \ == evidence['baseline_sha256']\n    before = source_hashes()\n    subprocess.run(['git', 'apply', '--check',\
        \ str(patch)], check=True)\n    subprocess.run(['git', 'apply', str(patch)], check=True)\n    assert source_hashes()\
        \ == {**before, 'src/trw_host.v': evidence['candidate_sha256']}\n    print('Verified equivalent host word-before-lane\
        \ selection:', evidence['candidate_sha256'])\nif selected.get('inline_guard'):\n    evidence = json.loads(Path('spikes/phase2_stock_flow/inline_guard/integration_evidence.json').read_text())\n\
        \    assert evidence['native_preservation_prerequisite']['conclusion'] == 'success'\n    patch = Path('spikes/phase2_stock_flow/inline_guard/integration.patch')\n\
        \    assert hashlib.sha256(patch.read_bytes()).hexdigest() == evidence['patch_sha256']\n    for name, sha\
        \ in evidence['before'].items():\n        assert hashlib.sha256(Path(name).read_bytes()).hexdigest() ==\
        \ sha, name\n    before = source_hashes()\n    assert evidence['added_source'] not in before\n    subprocess.run(['git',\
        \ 'apply', '--check', str(patch)], check=True)\n    subprocess.run(['git', 'apply', str(patch)], check=True)\n\
        \    module = Path('spikes/phase2_stock_flow/inline_guard/trw_guarded_mask.v')\n    assert hashlib.sha256(module.read_bytes()).hexdigest()\
        \ == evidence['added_source_sha256']\n    Path(evidence['added_source']).write_bytes(module.read_bytes())\n\
        \    for name, sha in evidence['after'].items():\n        assert hashlib.sha256(Path(name).read_bytes()).hexdigest()\
        \ == sha, name\n    assert source_hashes() == {**before,\n        'src/trw_lane.v': evidence['after']['src/trw_lane.v'],\n\
        \        evidence['added_source']: evidence['added_source_sha256']}\n    print('Verified inline guarded-mask\
        \ source integration')\nif selected.get('c_select'):\n    import sys\n    sys.path.insert(0, 'scripts/ci')\n\
        \    from apply_c_select import apply\n    receipt = apply(Path('.'), Path('spikes/phase2_stock_flow/pin_input_decode'))\n\
        \    Path('spikes/phase2_stock_flow/pin_input_decode/applied_source.json').write_text(json.dumps(receipt,\
        \ indent=2) + '\\n')\n    print('Verified one-file C-selector source optimization')\nif selected.get('idle_ff'):\n\
        \    import sys\n    sys.path.insert(0, 'scripts/ci')\n    from apply_idle_ff import apply\n    receipt\
        \ = apply(Path('.'), Path('spikes/phase2_stock_flow/idle_ff'))\n    Path('spikes/phase2_stock_flow/idle_ff/applied_source.json').write_text(json.dumps(receipt,\
        \ indent=2) + '\\n')\n    print('Verified phase-equivalent critical configuration storage change')\nif selected.get('host_port_align'):\n\
        \    import sys\n    sys.path.insert(0, 'scripts/ci')\n    from apply_host_port_align import apply\n   \
        \ receipt = apply(Path('.'), Path('spikes/phase2_stock_flow/host_port_align'))\n    Path('spikes/phase2_stock_flow/host_port_align/applied_source.json').write_text(json.dumps(receipt,\
        \ indent=2) + '\\n')\n    print('Verified equivalent aligned host port-status word source change')\nPath('spikes/phase2_stock_flow/selected_profile.json').write_text(json.dumps(dict(\n\
        \    profile=profile, changes=selected['changes'], config_sha256=selected['config_sha256'],\n    baseline_physical_run=profiles['baseline_physical_run'],\
        \ baseline_audit_run=profiles['baseline_audit_run'],\n    comparison_reference_run=selected.get('comparison_reference_run',\
        \ profiles.get('comparison_reference_run')),\n    comparison_reference_config_sha256=selected.get('comparison_reference_config_sha256',\
        \ profiles.get('comparison_reference_config_sha256')),\n    additional_changes_from_reference=selected.get('additional_changes_from_reference'),\n\
        \    hardware_unchanged=selected.get('hardware_unchanged', True),\n    rtl_patch=selected.get('rtl_patch'),\
        \ config_word_select=selected.get('config_word_select', False),\n    host_word_select=selected.get('host_word_select',\
        \ False),\n    inline_guard=selected.get('inline_guard', False),\n    c_select=selected.get('c_select',\
        \ False), idle_ff=selected.get('idle_ff', False),\n    host_port_align=selected.get('host_port_align', False)),\
        \ indent=2) + '\\n')\nprint('Selected isolated physical control:', profile, selected['changes'])\nimport\
        \ sys\nsys.path.insert(0, 'scripts/ci')\nfrom host_idle_portable_trials import prepare\ntrial = prepare(Path('.'),\
        \ os.environ['PORTABLE_VARIANT'])\nprint('Prepared clean stock project-input trial:', trial['profile'],\
        \ trial['additional_changes_from_reference'])\nPYCODE"
    - name: Select only the comparison tile size
      run: python scripts/ci/official_nov9_preflight.py prepare "${{ matrix.tiles }}"
    - name: Check out official support tools snapshot
      uses: actions/checkout@v6
      with:
        repository: TinyTapeout/tt-support-tools
        ref: 9d13ff3e3e6202090740110438c6a10c1d62ca0f
        path: tt
    - name: Set up official Python version
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: tt/requirements.txt
    - name: Install official prerequisites
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
      with:
        packages: librsvg2-bin pngquant ghdl-llvm
        version: tinytapeout_gds_action
    - name: Install official tools and LibreLane
      run: 'pip install -r tt/requirements.txt

        pip install librelane==3.1.0.dev4'
    - name: Generate and bind native project inputs
      run: 'set -euo pipefail

        python tt/tt_tool.py --create-user-config --pdk ihp-sg13cmos5l

        python scripts/ci/official_nov9_preflight.py generated "${{ matrix.tiles }}"

        python - <<''PYCODE''

        import json, subprocess, importlib.metadata

        from pathlib import Path

        import librelane, yaml

        from librelane.common import get_ciel_pdk_hash

        from scripts.ci.official_nov9_preflight import TOOLS, PDK

        assert subprocess.check_output([''git'',''-C'',''tt'',''rev-parse'',''HEAD''], text=True).strip() == TOOLS

        assert importlib.metadata.version(''librelane'') == ''3.1.0.dev4''

        assert get_ciel_pdk_hash(''ihp-sg13cmos5l'') == PDK

        receipt = {''librelane'': importlib.metadata.version(''librelane''), ''ciel'': importlib.metadata.version(''ciel''),
        ''pdk_revision'': PDK, ''tools_sha'': TOOLS}

        Path(''compatibility-engine.json'').write_text(json.dumps(receipt, indent=2)+''\n'')

        PYCODE'
    - name: Capture stock engine identity
      run: 'set -euo pipefail

        docker pull ghcr.io/librelane/librelane:3.1.0.dev4

        docker image inspect ghcr.io/librelane/librelane:3.1.0.dev4 > compatibility-image.json

        docker run --rm ghcr.io/librelane/librelane:3.1.0.dev4 openroad -version > compatibility-openroad.txt'
    - name: Run stock Classic only through SRAM placement and PDN
      timeout-minutes: 60
      run: 'set -euo pipefail

        unset LIBRELANE_IMAGE_OVERRIDE TRIPWIRE_NATIVE_RUNTIME _LLN_OVERRIDE_OPENROAD PYTHONPATH

        mkdir -p runs/official-nov9-preflight

        python -m librelane --docker-no-tty --dockerized --pdk-root "$PDK_ROOT" --pdk ihp-sg13cmos5l --run-tag official-nov9-preflight
        --force-run-dir runs/official-nov9-preflight --hide-progress-bar --to OpenROAD.GeneratePDN src/config_merged.json

        python scripts/ci/official_nov9_preflight.py native "${{ matrix.tiles }}"'
    - name: Upload compatibility evidence even on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: official-nov9-preflight-${{ matrix.tiles }}-${{ github.run_id }}
        path: 'compatibility-*.json

          compatibility-*.txt

          runs/official-nov9-preflight/

          src/config*.json

          src/user_config.json

          info.yaml

          spikes/phase2_stock_flow/selected_profile.json'
        retention-days: 14
        if-no-files-found: error
