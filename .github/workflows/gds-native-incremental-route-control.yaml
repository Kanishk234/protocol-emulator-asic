name: gds-native-incremental-route-control

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gds-native-incremental-route-control-3393eea
  cancel-in-progress: false

jobs:
  harden:
    name: Native incremental routing checkpoint control (${{ matrix.strategy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        strategy: ['AREA 1']
    env:
      PDK_ROOT: /home/runner/pdk
      CANDIDATE_SHA: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
      GRT_ADJUSTMENT: "0.16"
      ALL_CORNER_REPAIR: "1"
      NATIVE_HOLD_TARGET: "0.10"
      NATIVE_CLOCK_CLUSTER_SIZE: "8"
      VARIANT: bs-resync-cfg-tx-cached-lane-mask
      NATIVE_MAPPING_STRATEGY: ${{ matrix.strategy }}

    steps:
      - name: Check out the measured R4 candidate
        uses: actions/checkout@v6
        with:
          ref: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
          fetch-depth: 0
          submodules: recursive

      - name: Check out experiment helpers
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-src

      - name: Apply exactly one independent timing trial
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python workflow-src/scripts/ci/timing_trial.py
          sha256sum src/config.json src/trw_chan_port.v src/trw_pin_bs.v src/trw_pin_rx.v src/trw_pin_io.v

      - name: Check out Tiny Tapeout tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ihp-sg13cmos5l
          path: tt

      - name: Check out the pinned IHP installer
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: ihp-cmos5l
          path: .tt-gds-action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tt/requirements.txt

      - name: Install Tiny Tapeout prerequisites
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librsvg2-bin pngquant ghdl-llvm
          version: tinytapeout_gds_action

      - name: Install flow dependencies
        run: pip install -r tt/requirements.txt

      - name: Install IHP PDK
        run: ./.tt-gds-action/install_sg13cmos5l.sh

      - name: Install pinned LibreLane
        run: pip install librelane==3.1.0.dev3

      - name: Validate candidate and prepare generated config
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 - <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path

          grt_adjustment = os.environ["GRT_ADJUSTMENT"]
          assert grt_adjustment in {"0.12", "0.16"}, grt_adjustment

          cfg = json.loads(Path("src/config.json").read_text())
          assert float(cfg["CLOCK_PERIOD"]) == 20.0
          assert int(cfg["PL_TARGET_DENSITY_PCT"]) == 56

          assert hashlib.sha256(Path("src/trw_pin_bs.v").read_bytes()).hexdigest() == "c77f87ce20a8b2f7eec2b58b4db72476ccf4eb5fc89dde4d60b9461f486a346d", "RTL differs from locally verified configuration staging source"

          assert hashlib.sha256(Path("src/trw_pin_cfg.v").read_bytes()).hexdigest() == "d17c05bfe5ca002eb5ca09885727bee039766f815817c27a9b56da6041b7adc7", "Configuration staging differs from locally verified source"

          assert hashlib.sha256(Path("src/trw_pin_tx.v").read_bytes()).hexdigest() == "29bdf26b9cf3d1939d8b8efe7833ac7d6ca1042c71e33c7065462f10e3c7951f", "TX source differs from verified trial"
          assert hashlib.sha256(Path("src/trw_chan_port.v").read_bytes()).hexdigest() == "1ffd8c8004d86ec93c7da8e2967650861e6f5d67b8e44e83bc977649298508ba"
          assert hashlib.sha256(Path("src/trw_lane.v").read_bytes()).hexdigest() == "5a2905a6c59ac4eb6efb621e95d5bd18d1b9f2dc1ad599f5c7690573760ffd06"

          defs = Path("src/trw_defs.vh").read_text().splitlines()
          expected = {
              "TRW_LANES": "2",
              "TRW_UNITS": "4",
              "TRW_PC_UNITS_PULSE": "4'b0001",
              "TRW_PC_UNITS_CARRIER": "4'b0001",
              "TRW_PC_UNITS_BITSYNC": "4'b0001",
          }
          for name, value in expected.items():
              assert f"`define {name} {value}" in defs, name
          print(f"Pinned candidate: {os.environ['CANDIDATE_SHA']}")
          print("Candidate shape: 2 lanes, 4 pin units, U0 full; 20 ns; density 56%")
          print(f"Matched RTL variant: {os.environ['VARIANT']}; clock/density/resource shape unchanged")
          PY
          python tt/tt_tool.py --create-user-config --ihp

      - name: Verify the pinned declarative insertion and stop point
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'workflow-src/scripts/ci')
          from librelane.flows.classic import Classic
          from native_post_antenna_screen import SUBSTITUTIONS
          ids = [step.id for step in Classic.Substitute(SUBSTITUTIONS).Steps]
          final = ids.index('OpenROAD.RepairAntennas-1')
          assert final == ids.index('OpenROAD.ResizerTimingPostGRT') + 1
          assert final < ids.index('OpenROAD.DetailedRouting')
          print('Verified native Classic insertion:', ids[final-1:final+2])
          PY

      - name: Download exact failed screen evidence
        uses: actions/download-artifact@v7
        with:
          name: gds-native-lane-mask-setup-reserve-area1-39498376778
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 39498376778

      - name: Read failed source provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/39498376778" > /tmp/native-source-run.json

      - name: Measure incremental routing through native repair and placement
        timeout-minutes: 95
        run: python workflow-src/scripts/ci/native_incremental_route_control.py

      - name: Upload early control measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-incremental-route-control-gates-${{ github.run_id }}
          path: |
            runs/native-incremental-route-control/gates.json
            runs/native-incremental-route-control/timing/comparison.json
            runs/native-incremental-route-control/timing/after-*/*/capture_setup.rpt
            runs/native-incremental-route-control/timing/after-*/*/route_coverage.rpt
          if-no-files-found: warn

      - name: Upload complete checkpoint control evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-incremental-route-control-evidence-${{ github.run_id }}
          path: runs/native-incremental-route-control/**
          if-no-files-found: warn
