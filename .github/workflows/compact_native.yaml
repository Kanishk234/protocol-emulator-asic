name: compact native diagnostic
# Independent of the long routing workflow; failed tests stay failed.
on:
  push:
    branches: [efpga]
    paths:
      - 'test_internal/compact_gate_probe.py'
      - 'test_internal/cloud_native_probe.py'
      - 'test_internal/native_shadow.py'
      - 'spikes/compact_edges/simulate.py'
      - 'spikes/compact_edges/test_shell.py'
      - '.github/workflows/compact_native.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warp-compact-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native_fabric:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PDK_ROOT: ${{ github.workspace }}/build/cloud_pdk
    steps:
      - uses: actions/checkout@v6
      - name: Project simulation venv
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog yosys python3-venv
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install -r test/requirements.txt pyyaml==6.0.3
      - name: Verify and materialize checkpoint
        run: bash spikes/cloud/fetch_checkpoint.sh
      - name: Fetch exact PDK models and Icarus13
        run: |
          bash spikes/cloud/fetch_pdk.sh
          mkdir -p "$HOME/.cache/warp/iverilog-13"
          curl -sfL -o build/iverilog13.deb https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          dpkg-deb -x build/iverilog13.deb "$HOME/.cache/warp/iverilog-13"
      - name: Real SPI load on RTL control then native mapped fabric
        timeout-minutes: 20
        run: |
          source .venv/bin/activate
          python test_internal/cloud_native_probe.py
      - name: Collect evidence
        if: always()
        run: |
          source .venv/bin/activate
          python spikes/cloud/collect.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compact-native-probe-${{ github.run_id }}
          path: |
            build/cloud_results/
            build/cloud_setup/actual_fabric_cone.json.gz
          retention-days: 1
