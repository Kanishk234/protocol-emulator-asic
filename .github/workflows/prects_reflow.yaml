name: compact before CTS placement comparison
on:
  workflow_dispatch:
  push:
    branches: [efpga]
    paths:
      - 'test_internal/cloud_prects_reflow.py'
      - '.github/workflows/prects_reflow.yaml'
permissions:
  contents: read
  actions: read
concurrency:
  group: warp-prects-reflow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PDK_ROOT: ${{ github.workspace }}/build/cloud_pdk
      LIBRELANE_IMAGE_OVERRIDE: ghcr.io/librelane/librelane@sha256:d109140b8f17fc54f4fca998beb8124f4949404ec52e339eebd2250854a18b5a
    steps:
      - uses: actions/checkout@v6
      - name: Fetch authenticated producer and original source payload
        timeout-minutes: 12
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install librelane==3.1.0.dev3
          bash spikes/cloud/fetch_pdk.sh
          gh release download compact-checkpoint-20261006-iter8 -R "$GITHUB_REPOSITORY" --pattern fanout-preflight-source.tar.gz --dir build
      - name: Provision pinned cloud tools
        timeout-minutes: 5
        run: docker pull "$LIBRELANE_IMAGE_OVERRIDE"
      - name: Compare original placement and reflow before rebuilt CTS and timing repair
        timeout-minutes: 42
        run: |
          source .venv/bin/activate
          python test_internal/cloud_prects_reflow.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compact-prects-reflow-${{ github.run_id }}
          path: build/prects_reflow/
          retention-days: 3
