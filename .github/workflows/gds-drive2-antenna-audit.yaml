name: gds-drive2-antenna-audit
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: gds-drive2-antenna-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
    - name: Check out tools
      uses: actions/checkout@v6
    - name: Bind exact native-drive run
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api repos/${{ github.repository }}/actions/runs/43178099947 > drive2-source-run.json
    - name: Download exact native-drive checkpoints
      uses: actions/download-artifact@v7
      with:
        name: official-dev4-drive2-43178099947
        run-id: 43178099947
        github-token: ${{ github.token }}
        path: frozen-screen
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Pull exact stock physical engine
      run: docker pull ghcr.io/librelane/librelane@sha256:af2405f5d48d8fe14d406ecce913811177a95e365e3b625859677307cace2469
    - name: Compare unchanged antenna geometry
      run: python scripts/ci/drive2_antenna_audit.py
    - name: Upload target-net evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: drive2-antenna-audit-${{ github.run_id }}
        path: 'runs/drive2-antenna-audit/**

          drive2-source-run.json'
        if-no-files-found: warn
