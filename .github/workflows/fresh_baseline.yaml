name: fresh candidate G1 baseline
on:
  workflow_dispatch:
  push:
    branches: [efpga]
    paths:
      - 'test_internal/cloud_fresh_baseline.py'
      - 'protocols/uart_spi/**'
      - '.github/workflows/fresh_baseline.yaml'
permissions:
  contents: read
concurrency:
  group: warp-fresh-baseline-${{ github.ref }}
  cancel-in-progress: false
env:
  OSS_CAD_SUITE_TAG: '2026-06-29'
jobs:
  compare:
    if: github.ref == 'refs/heads/efpga'
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Python prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Cache pinned synthesis suite
        id: ocs
        uses: actions/cache@v5
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-${{ env.OSS_CAD_SUITE_TAG }}
      - name: Fetch pinned synthesis suite
        if: steps.ocs.outputs.cache-hit != 'true'
        run: |
          D=${OSS_CAD_SUITE_TAG//-/}
          curl -sfL -o /tmp/warp-arch-ocs.tgz "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$OSS_CAD_SUITE_TAG/oss-cad-suite-linux-x64-$D.tgz"
          tar -xzf /tmp/warp-arch-ocs.tgz -C ~
      - name: Cache pinned primitive-aware nextpnr
        uses: actions/cache@v5
        with:
          path: ~/.cache/warp/ocs-2026-09-27
          key: oss-cad-suite-nextpnr-2026-09-27
      - name: Project venv and pinned compiler tools
        run: |
          scripts/setup_venv.sh
          bash scripts/fetch_nextpnr.sh
      - name: Eleven explicit G1 baseline cases
        timeout-minutes: 115
        run: |
          source .venv/bin/activate
          export PATH="$PWD/.venv/bin:$HOME/oss-cad-suite/bin:$PATH"
          python test_internal/cloud_fresh_baseline.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fresh-baseline-${{ github.run_id }}
          path: build/fresh_baseline/
          retention-days: 30
          if-no-files-found: error

  concurrency-rtl:
    if: github.ref == 'refs/heads/efpga'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install simulator and project environment
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          python -m venv .venv
          .venv/bin/python -m pip install -r test/requirements.txt pyyaml==6.0.3
      - name: Baseline evidence checker tests
        run: |
          source .venv/bin/activate
          python -m pytest -q test_internal/test_fresh_baseline.py
      - name: Concurrent traffic across modes and primitive selections
        run: |
          source .venv/bin/activate
          bash scripts/check_uart_spi.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fresh-concurrency-rtl-${{ github.run_id }}
          path: build/uart_spi_checks/
          if-no-files-found: error
          retention-days: 30
