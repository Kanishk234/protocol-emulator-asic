name: l3-cache-final-routed-gl
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: l3-cache-final-routed-gl
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard:
        - serial
        - pulse
        - debug
        - frames
    env:
      SOURCE_RUN: '44017640255'
      SOURCE_ARTIFACT: official-dev4-cache-final-antenna-44017640255
      PDK_ROOT: /home/runner/pdk
    steps:
    - name: Check out route tools
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Verify and download the exact qualified screen
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\ngh api \"repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN\" > official-dev4-source-run.json\n\
        gh run download \"$SOURCE_RUN\" --repo \"$GITHUB_REPOSITORY\" --name \"$SOURCE_ARTIFACT\" --dir frozen-screen\n\
        python - <<'PY'\nimport json, shutil\nfrom pathlib import Path\nrun = json.loads(Path('official-dev4-source-run.json').read_text())\n\
        assert run['id'] == 44017640255\nassert run['head_sha'] == 'e04f800d2ab1701cd97ff801e464830054b2b145'\n\
        assert run['head_branch'] == 'main' and run['conclusion'] == 'success'\nassert run['path'] == '.github/workflows/gds-official-dev4-cache-final-antenna-screen.yaml'\n\
        frozen = Path('frozen-screen')\nfor name in ('runs', 'src', 'macro'):\n    target = Path(name)\n    if target.exists():\
        \ shutil.rmtree(target)\nfor name in ('runs', 'src', 'macro'):\n    source = frozen / name\n    if source.exists():\
        \ shutil.copytree(source, Path(name))\nshutil.copy2(frozen / 'info.yaml', 'info.yaml')\nfor name in ('compatibility-input.json',\
        \ 'compatibility-generated.json',\n             'compatibility-engine.json', 'compatibility-image.json',\n\
        \             'compatibility-openroad.txt'):\n    if (frozen / name).exists(): shutil.copy2(frozen / name,\
        \ name)\nPY\n"
    - name: Download route and extraction evidence
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        gh api "repos/$GITHUB_REPOSITORY/actions/runs/44031468510" > route-source-run.json

        gh run download 44031468510 --repo "$GITHUB_REPOSITORY" --name cache-final-drtroute-44031468510 --dir route-artifact

        gh run download 44031468510 --repo "$GITHUB_REPOSITORY" --name cache-final-extracted-44031468510 --dir extracted-artifact

        '
    - name: Set up stock dev4 tools
      uses: actions/checkout@v6
      with:
        repository: TinyTapeout/tt-support-tools
        ref: 9d13ff3e3e6202090740110438c6a10c1d62ca0f
        path: tt
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install replay and stock tool dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y sigrok-cli

        pip install -r requirements-dev.txt -r tt/requirements.txt

        pip install librelane==3.1.0.dev4

        '
    - name: Verify stock physical engine identity
      run: 'set -euo pipefail

        docker pull ghcr.io/librelane/librelane:3.1.0.dev4

        docker image inspect ghcr.io/librelane/librelane:3.1.0.dev4 > compatibility-image-route.json

        docker run --rm ghcr.io/librelane/librelane:3.1.0.dev4 openroad -version > compatibility-openroad-route.txt

        python - <<''PY''

        import json

        from pathlib import Path

        image = json.loads(Path(''compatibility-image-route.json'').read_text())[0]

        assert ''ghcr.io/librelane/librelane@sha256:af2405f5d48d8fe14d406ecce913811177a95e365e3b625859677307cace2469''
        in image[''RepoDigests'']

        assert Path(''compatibility-openroad-route.txt'').read_text().strip() == ''dcf36133a369abc8f3c5e5738cd4d82e4903c0e0''

        PY

        '
    - name: Independently validate artifacts and generate matching software tables
      run: python scripts/ci/cache_final_protocols.py admit
    - name: Acquire exact stock PDK models
      timeout-minutes: 30
      run: 'set -euo pipefail

        unset LIBRELANE_IMAGE_OVERRIDE TRIPWIRE_NATIVE_RUNTIME _LLN_OVERRIDE_OPENROAD PYTHONPATH

        python scripts/ci/cache_final_protocols.py models'
    - name: Install Tiny Tapeout Icarus 13
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/iverilog-13"

        curl -sfL -o "$RUNNER_TEMP/iverilog13.deb" https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb

        dpkg-deb -x "$RUNNER_TEMP/iverilog13.deb" "$RUNNER_TEMP/iverilog-13"

        "$RUNNER_TEMP/iverilog-13/usr/bin/iverilog" -B "$RUNNER_TEMP/iverilog-13/usr/lib/ivl" -V

        '
    - name: Replay selected protocol cases
      id: simulate
      timeout-minutes: 300
      env:
        SHARD: ${{ matrix.shard }}
      run: 'set -euo pipefail

        export PATH="$RUNNER_TEMP/iverilog-13/usr/bin:$PATH"

        export IVERILOG_VPI_MODULE_PATH="$RUNNER_TEMP/iverilog-13/usr/lib/ivl"

        export COMPILE_ARGS="-B $RUNNER_TEMP/iverilog-13/usr/lib/ivl"

        unset TESTCASE COCOTB_TESTCASE COCOTB_TEST_FILTER COCOTB_RESOLVE_X TRIPWIRE_SKIP_SIGROK

        sigrok-cli --version

        export COCOTB_TEST_FILTER="$(python scripts/ci/cache_final_protocols.py filter --shard "$SHARD")"

        export TRIPWIRE_SPEC_FILE="$GITHUB_WORKSPACE/replay/tools/tripwire_spec.py"

        VERILOG_SOURCES="$(python -c ''import json; print(" ".join(json.load(open("replay_compile.json"))["verilog_sources"]))'')"

        make -C replay/test_internal/chip SIM=icarus GATES=yes SIM_BUILD="$GITHUB_WORKSPACE/replay/test_internal/chip/sim_build/$SHARD"
        TOPLEVEL=tb_chip TOPLEVEL_LANG=verilog COCOTB_TEST_MODULES=test_l3 COCOTB_RESULTS_FILE="$GITHUB_WORKSPACE/results_$SHARD.xml"
        VERILOG_SOURCES="$VERILOG_SOURCES" 2>&1 | tee "replay_$SHARD.log"

        '
    - name: Verify actual selected executions
      if: always() && steps.simulate.outcome != 'skipped'
      run: python scripts/ci/cache_final_protocols.py receipt --shard ${{ matrix.shard }}
    - name: Upload shard evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cache-final-l3-${{ github.run_id }}-${{ matrix.shard }}
        path: 'results_*.xml

          receipt_*.json

          native-gl-identity.json

          replay_compile.json

          replay_*.log'
        if-no-files-found: warn
  aggregate:
    needs: replay
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: pip install PyYAML==6.0.3
    - uses: actions/download-artifact@v7
      with:
        pattern: cache-final-l3-${{ github.run_id }}-*
        path: shard-results
    - name: Require all 22 protocol executions
      run: python scripts/ci/cache_final_protocols.py aggregate
    - uses: actions/upload-artifact@v7
      with:
        name: cache-final-l3-full-suite-${{ github.run_id }}
        path: full-suite-results/*
