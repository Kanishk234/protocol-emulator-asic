name: R1 fixed placement E loop repair and timing
on:
  workflow_dispatch:
  push:
    branches: [efpga]
    paths: [.github/workflows/r1_clock_fixed_e_loop.yaml]
permissions:
  contents: read
  actions: read
concurrency:
  group: warp-r1-clock-fixed-e-loop
  cancel-in-progress: false
jobs:
  native:
    if: github.ref == 'refs/heads/efpga'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PDK_ROOT: ${{ github.workspace }}/build/sa_pdk
      PYTHONPATH: tools:test_internal:spikes/r1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Authenticate exact clock-bank control and candidate
        timeout-minutes: 18
        run: |
          bash scripts/setup_venv.sh
          source .venv/bin/activate
          python - <<'PY'
          import json,os
          from pathlib import Path
          from assembly_fetch import api,admit_run,artifact
          from clock_fixed_e_loop_repair import prepare
          sources=json.loads(Path('spikes/r1/routed_timing_sources.json').read_text())['sources']
          sources['trial']={
            'run':{'id':44831585287,'head_sha':'d9d7991ed2c27945bf7d56a583a2fc4921f3967d','head_branch':'efpga','run_attempt':1,'conclusion':'success','path':'.github/workflows/r1_clock_bank_fixed.yaml'},
            'artifact':{'id':14677710079,'name':'r1-clock-bank-fixed-44831585287','digest':'sha256:a5c5a97a3f7b37724cb63a28e46701eae47522834bb5d7db0c2862b3455f138b','size_in_bytes':281938,'source_run':44831585287},'member':'r1_placement_trial'}
          sources['current']={
            'run':{'id':44832060001,'head_sha':'23583b18ae1d20bfa36be7a26c7a12fc25e08b49','head_branch':'efpga','run_attempt':1,'conclusion':'failure','path':'.github/workflows/r1_clock_fixed_native.yaml'},
            'artifact':{'id':14677752391,'name':'r1-clock-fixed-native-timing-44832060001','digest':'sha256:3ea1ec2f0b767073505d5e7352f1a5118b0337971773c756423a11443c47aec0','size_in_bytes':5884885,'source_run':44832060001},'member':'.'}
          sources['loaded']={
            'run':{'id':44853914939,'head_sha':'b752e9c7a219d703cf8845e24bd8421a02f9a397','head_branch':'efpga','run_attempt':1,'conclusion':'failure','path':'.github/workflows/r1_clock_fixed_repair.yaml'},
            'artifact':{'id':14687150870,'name':'r1-clock-fixed-repair-native-timing-44853914939','digest':'sha256:664f0be06974577e6adf6f065596ba5a0b4facd2bdb54d00e7b72c3e1db6db07','size_in_bytes':13035449,'source_run':44853914939},'member':'.'}
          sources['later']={
            'run':{'id':44854958011,'head_sha':'37bb1187640f2c11d42d1bee43d2960155e8d586','head_branch':'efpga','run_attempt':1,'conclusion':'failure','path':'.github/workflows/r1_clock_fixed_loop.yaml'},
            'artifact':{'id':14687810370,'name':'r1-clock-fixed-loop-native-timing-44854958011','digest':'sha256:9c3e669c806665e86574caedb554266f4978789c25a663ed98dddbd6a351f42f','size_in_bytes':13044151,'source_run':44854958011},'member':'.'}
          sources['latest']={
            'run':{'id':44855809222,'head_sha':'a4f2cac801fff3cd799a1b33e9bd042527e1070c','head_branch':'efpga','run_attempt':1,'conclusion':'failure','path':'.github/workflows/r1_clock_fixed_g_loop.yaml'},
            'artifact':{'id':14687936242,'name':'r1-clock-fixed-g-loop-native-timing-44855809222','digest':'sha256:a45add4d67ec397710e24039d5218a27ea3f2f0d2287566ff80565a5e43df15d','size_in_bytes':13053461,'source_run':44855809222},'member':'.'}
          repo=os.environ['GITHUB_REPOSITORY'];target=Path('build/sa_sources').resolve();target.mkdir(parents=True,exist_ok=False)
          roots={}
          for name,row in sources.items():
              producer=api(f'repos/{repo}/actions/runs/{row["run"]["id"]}')
              admit_run(producer,row['run'])
              roots[name]=str(artifact(repo,row['artifact'],target)/row['member'])
              (target/(name+'.producer.json')).write_text(json.dumps(producer,indent=2)+'\n')
          (target/'locations.json').write_text(json.dumps(roots,indent=2)+'\n')
          prepare(**{k:roots[k] for k in ('capsule','native','trial','current','loaded','later','latest')},out=Path('build/sa_functional'))
          PY
          bash spikes/cloud/fetch_pdk.sh
          mkdir -p build/sa_iverilog
          curl -sfL https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb -o build/sa_iverilog.deb
          dpkg-deb -x build/sa_iverilog.deb build/sa_iverilog
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          roots=json.loads(Path('build/sa_sources/locations.json').read_text())
          expected=json.loads((Path(roots['capsule'])/'functional/quiescent/configured-smoke.json').read_text())['tool_binary_sha256']
          for name,digest in expected.items():
              assert hashlib.sha256((Path('build/sa_iverilog/usr/bin')/name).read_bytes()).hexdigest()==digest
          PY
      - name: Load original control and separately repaired A and D through native and management interfaces
        timeout-minutes: 12
        run: |
          source .venv/bin/activate
          timeout --kill-after=10s 600s python spikes/r1/sa_functional.py run --out build/sa_functional \
            --pdk "$PDK_ROOT/ihp-sg13cmos5l" --icarus build/sa_iverilog > build/sa_functional/native.log 2>&1
      - name: Prepare timing only after actual native reload succeeds
        timeout-minutes: 5
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import json,os
          from pathlib import Path
          from sa_timing import prepare
          roots=json.loads(Path('build/sa_sources/locations.json').read_text())
          prepare(**{k:roots[k] for k in ('rc','proof','native','capsule')},
              pdk=Path(os.environ['PDK_ROOT']),functional=Path('build/sa_functional'),out=Path('build/r1_loop_timing'))
          PY
      - name: Measure connected RC with original clock and full active coverage
        timeout-minutes: 20
        run: |
          set -euo pipefail
          image=ghcr.io/librelane/librelane@sha256:d109140b8f17fc54f4fca998beb8124f4949404ec52e339eebd2250854a18b5a
          docker pull "$image"
          docker image inspect "$image" > build/r1_loop_timing/image.json
          timeout 1080s docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e PYTHONPATH -e GITHUB_RUN_ID -e GITHUB_SHA "$image" \
            python3 spikes/r1/sa_timing.py run --out build/r1_loop_timing > build/r1_loop_timing/timing.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r1-clock-fixed-e-loop-native-timing-${{ github.run_id }}
          path: |
            build/sa_functional/
            build/r1_loop_timing/
            build/sa_sources/*.producer.json
            build/sa_sources/*.metadata.json
          include-hidden-files: true
          retention-days: 90
