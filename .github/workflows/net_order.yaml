name: compact net ordering diagnostic
on:
  workflow_dispatch:
  push:
    branches: [efpga]
    paths:
      - 'test_internal/cloud_net_order.py'
      - '.github/workflows/net_order.yaml'
      - 'patches/grt_net_order.tcl'
permissions:
  contents: read
  actions: read
concurrency:
  group: warp-net-order-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 41]
    env:
      WARP_NET_ORDER_SEED: ${{ matrix.seed }}
      GH_TOKEN: ${{ github.token }}
      PDK_ROOT: ${{ github.workspace }}/build/cloud_pdk
      LIBRELANE_IMAGE_OVERRIDE: ghcr.io/librelane/librelane@sha256:d109140b8f17fc54f4fca998beb8124f4949404ec52e339eebd2250854a18b5a
    steps:
      - uses: actions/checkout@v6
      - name: Fetch exact measured baseline and padded producer
        timeout-minutes: 12
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install librelane==3.1.0.dev3
          bash spikes/cloud/fetch_pdk.sh
          timeout 120s gh run download 38101405271 -R "$GITHUB_REPOSITORY" --name compact-cfg-fanout-local-38101405271 --dir build/net_order_input/baseline
          timeout 120s gh run download 38167697696 -R "$GITHUB_REPOSITORY" --name compact-reset-combined-38167697696 --dir build/net_order_input/padded
          timeout 120s gh run download 38101639866 -R "$GITHUB_REPOSITORY" --name compact-fanout-local-grt-38101639866 --dir build/net_order_input/previous
      - name: Provision pinned EDA image before native timers
        timeout-minutes: 5
        run: docker pull "$LIBRELANE_IMAGE_OVERRIDE"
      - name: Paired unchanged placement and zero-capacity-perturbation net-order comparison
        timeout-minutes: 34
        run: |
          source .venv/bin/activate
          python test_internal/cloud_net_order.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compact-net-order-${{ github.run_id }}-seed${{ matrix.seed }}
          path: build/net_order_seed_${{ matrix.seed }}/
          retention-days: 3
