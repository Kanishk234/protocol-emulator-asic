name: compact experiments
# WARP's separate experiment workflow; template jobs are untouched.
on:
  push:
    branches: [efpga]
    paths:
      - 'spikes/cloud/**'
      - '.github/workflows/experiments.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warp-compact-experiments-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      PDK_ROOT: ${{ github.workspace }}/build/cloud_pdk
    steps:
      - uses: actions/checkout@v6
      - name: Project venv with the competition flow
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install librelane==3.1.0.dev3
      - name: Verify and materialize the saved 15-marker checkpoint
        run: bash spikes/cloud/fetch_checkpoint.sh
      - name: Fetch the exact CMOS5L PDK
        run: bash spikes/cloud/fetch_pdk.sh
      - name: Resume routing; run geometry and shell timing if native checks pass
        timeout-minutes: 300
        run: |
          source .venv/bin/activate
          python spikes/cloud/resume_route.py
      - name: Collect bounded evidence, including last complete route snapshot
        if: always()
        run: |
          source .venv/bin/activate
          python spikes/cloud/collect.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compact-route-${{ github.run_id }}
          path: build/cloud_results/
          retention-days: 1

  native_fabric:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PDK_ROOT: ${{ github.workspace }}/build/cloud_pdk
    steps:
      - uses: actions/checkout@v6
      - name: Project simulation venv
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog yosys python3-venv
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install -r test/requirements.txt pyyaml==6.0.3
      - name: Verify and materialize checkpoint
        run: bash spikes/cloud/fetch_checkpoint.sh
      - name: Fetch exact PDK models and Icarus13
        run: |
          bash spikes/cloud/fetch_pdk.sh
          mkdir -p "$HOME/.cache/warp/iverilog-13"
          curl -sfL -o build/iverilog13.deb https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          dpkg-deb -x build/iverilog13.deb "$HOME/.cache/warp/iverilog-13"
      - name: Real SPI load on RTL control then native mapped fabric
        timeout-minutes: 20
        run: |
          source .venv/bin/activate
          python spikes/cloud/native_fabric.py
      - name: Collect evidence
        if: always()
        run: |
          source .venv/bin/activate
          python spikes/cloud/collect.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compact-native-${{ github.run_id }}
          path: build/cloud_results/
          retention-days: 1

  g1_demos:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install simulation dependencies
        run: sudo apt-get update && sudo apt-get install -y iverilog python3-venv python3-tk
      - name: Fetch pinned compiler tools
        run: |
          curl -sfL -o /tmp/ocs.tgz https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-06-29/oss-cad-suite-linux-x64-20260629.tgz
          tar -xzf /tmp/ocs.tgz -C "$HOME"
          bash scripts/fetch_nextpnr.sh
      - name: Project venv
        run: bash scripts/setup_venv.sh
      - name: Fresh compile, audit and SPI-loaded monitor/fault/capture tests
        run: |
          source .venv/bin/activate
          export PATH="$PATH:$HOME/oss-cad-suite/bin"
          python spikes/cloud/g1_demos.py
      - name: Upload concise demo evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g1-demos-${{ github.run_id }}
          path: |
            build/cloud_g1_demos/*.log
            build/cloud_g1_demos/*results.xml
            build/cloud_g1_demos/*/report.json
            build/cloud_g1_demos/*/failure.json
          retention-days: 1
