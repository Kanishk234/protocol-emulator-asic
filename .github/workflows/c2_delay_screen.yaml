name: C2 intrinsic identity delay screen
on:
  workflow_dispatch:
  push:
    branches: [efpga]
    paths:
      - 'test_internal/cloud_c2_delay_screen.py'
      - '.github/workflows/c2_delay_screen.yaml'
permissions:
  contents: read
  actions: read
concurrency:
  group: warp-c2-delay-screen-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PDK_ROOT: ${{ github.workspace }}/build/cloud_pdk
    steps:
      - uses: actions/checkout@v6
      - name: Exact original physical, loaded and timing evidence
        timeout-minutes: 12
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install -r test/requirements.txt pyyaml==6.0.3
          bash spikes/cloud/fetch_checkpoint.sh
          bash spikes/cloud/fetch_pdk.sh
          timeout 120s gh run download 37814078650 -R "$GITHUB_REPOSITORY" --name matched-c2-harden-37814078650 --dir build/c2_delay_input/physical
          timeout 120s gh run download 37958116481 -R "$GITHUB_REPOSITORY" --name native-final-tile-37958116481 --dir build/c2_delay_input/native
          timeout 120s gh run download 38112173902 -R "$GITHUB_REPOSITORY" --name conditional-configured-c2-sta-38112173902 --dir build/c2_delay_input/reference
      - name: Provision pinned native image
        timeout-minutes: 5
        run: docker pull ghcr.io/librelane/librelane@sha256:d109140b8f17fc54f4fca998beb8124f4949404ec52e339eebd2250854a18b5a
      - name: Twelve intrinsic cases; no parasitics in either variant
        timeout-minutes: 27
        run: |
          source .venv/bin/activate
          WARP_WORDS=$(python -c 'import json; from pathlib import Path; m=json.load(open("build/cloud_input/materialized.json")); print(Path(m["native_work"]).parent/"compiled_structural/uart_words.hex")')
          python test_internal/cloud_c2_delay_screen.py --native-evidence build/c2_delay_input/native --physical-evidence build/c2_delay_input/physical --words "$WARP_WORDS" --out build/c2_delay_screen --pdk-root "$PDK_ROOT" --timing-reference build/c2_delay_input/reference/result.json --execute-cloud
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: c2-intrinsic-delay-${{ github.run_id }}
          path: build/c2_delay_screen/
          retention-days: 3
