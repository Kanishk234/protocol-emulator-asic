# TRIPWIRE encodings: the single source (CLAUDE.md "One source for encodings").
#
# Everything that has a bit position or a code lives here. tools/gen/gen.py generates:
#   - tools/tripwire_spec.py      Python tables (tripsim now, tripc later)
#   - src/trw_defs.vh             Verilog `define constants (RTL, phase 2)
#   - tables in docs/design/ISA.md and ARCHITECTURE.md (between GENERATED markers)
# Never edit generated files; edit this file and run `python tools/gen/gen.py`.
# CI (lint workflow) regenerates and fails on any difference.
#
# Status: FROZEN at the end of phase 1 (DECISIONS D-037). Contents match D-007 ... D-036.
# Every change from now on needs its own DECISIONS entry.

version: 1.0
status: frozen

token:
  data_bits: 16
  tag_bits: 2
  tags:
    - {code: 0, name: DATA,  desc: "payload bytes/words"}
    - {code: 1, name: CTRL,  desc: "commands to pin units and helpers: data[15:12] = op, data[11:0] = argument"}
    - {code: 2, name: EVENT, desc: "things that happened; from pin units data[15] = new pin level, data[14:0] = time"}
    - {code: 3, name: ERR,   desc: "error reports (framing error, overrun, NACK, arbitration lost)"}

# Shared operation table (ISA.md §3): the same 4-bit OP in reflex slots and routine ALU words.
ops:
  - {code: 0,  name: MOV,   d: "A",                               r: "d == 0", use: "Forwarding tokens, loading registers"}
  - {code: 1,  name: ADD,   d: "A + B",                           r: "d == 0", use: "Counters, pointers"}
  - {code: 2,  name: SUB,   d: "A − B",                           r: "d == 0", use: "Count-down with zero test in one action"}
  - {code: 3,  name: AND,   d: "A & B",                           r: "d == 0", use: "Masking; bit test"}
  - {code: 4,  name: OR,    d: "A \\| B",                         r: "d == 0", use: "Setting bits; placing constants (`zero \\| K`)"}
  - {code: 5,  name: XOR,   d: "A ^ B",                           r: "d == 0", use: "Equality test; arbitration readback"}
  - {code: 6,  name: SHL,   d: "A << B[3:0]",                     r: "d == 0", use: ""}
  - {code: 7,  name: SHR,   d: "A >> B[3:0]",                     r: "d == 0", use: ""}
  - {code: 8,  name: SHOR,  d: "(A << F[3:0]) \\| r[F[5:4]]",     r: "d == 0", use: "Frame building (start/stop/ACK bits) in one action"}
  - {code: 9,  name: EXT,   d: "(A >> F[3:0]) & mask(F[7:4] + 1)", r: "d == 0", use: "Pull a field out of a frame"}
  - {code: 10, name: CMPM,  d: "A (pass-through)",                r: "(A & M) == V; M, V = K[F[1:0]], K[F[3:2]] if F[4] else r[F[1:0]], r[F[3:2]]", use: "Address match, multi-bit checks"}
  - {code: 11, name: LTU,   d: "A (pass-through)",                r: "A < B (unsigned)", use: "Bounds: buffer ends, EEPROM wrap"}
  - {code: 12, name: PAR,   d: "A (pass-through)",                r: "XOR-reduce(A)", use: "Parity check while forwarding"}
  - {code: 13, name: MKCTL, d: "{F[7:4], A[11:0]}, tag CTRL",      r: "d == 0", use: "Pin command with a register argument"}
  - {code: 14, name: CALL,  d: "—",                               r: "—",      use: "Start routine F[4:0] (reflex only); implicit RB == 0"}
  - {code: 15, name: MOVB,  d: "B",                               r: "d == 0", use: "React to an input with a constant (D-009)"}

# Reflex slot (ISA.md §4.1). Host view: 4 × 16-bit words, w0 = bits [15:0] ...
slot:
  bits: 53
  host_words: 4
  fields:
    - {name: V,    lsb: 0,  width: 1, group: condition, desc: "slot valid"}
    - {name: U,    lsb: 1,  width: 1, group: condition, desc: "urgent: pre-empts a waiting routine step"}
    - {name: SE,   lsb: 2,  width: 1, group: condition, desc: "STATE-match enable"}
    - {name: SV,   lsb: 3,  width: 4, group: condition, desc: "required STATE"}
    - {name: FM,   lsb: 7,  width: 4, group: condition, desc: "flag mask over f3..f0 (f3 = RB)"}
    - {name: FV,   lsb: 11, width: 4, group: condition, desc: "required flag values"}
    - {name: TE,   lsb: 15, width: 1, group: condition, desc: "tag match on the A input's head"}
    - {name: TAG,  lsb: 16, width: 2, group: condition, desc: "required tag"}
    - {name: HE,   lsb: 18, width: 1, group: condition, desc: "head-bit match enable"}
    - {name: HV,   lsb: 19, width: 1, group: condition, desc: "required head bit"}
    - {name: OP,   lsb: 20, width: 4, group: action,    desc: "operation (ops table)"}
    - {name: DST,  lsb: 24, width: 3, group: action,    desc: "destination (enum DST); CALL ignores it (tripc emits none)"}
    - {name: ASRC, lsb: 27, width: 3, group: action,    desc: "A source (enum ASRC)"}
    - {name: DQ,   lsb: 30, width: 1, group: action,    desc: "dequeue the A input (only if ASRC is I0/I1)"}
    - {name: BSEL, lsb: 31, width: 2, group: action,    desc: "B source (enum BSEL): reg = r[IMM[1:0]], imm = IMM, k = K[IMM[1:0]]"}
    - {name: IMM,  lsb: 33, width: 8, group: action,    desc: "8-bit immediate; also the field operand F"}
    - {name: NSE,  lsb: 41, width: 1, group: action,    desc: "next-STATE enable (static update)"}
    - {name: NS,   lsb: 42, width: 4, group: action,    desc: "next STATE"}
    - {name: DFE,  lsb: 46, width: 1, group: action,    desc: "write the flag result R"}
    - {name: DF,   lsb: 47, width: 2, group: action,    desc: "which flag: 0-2 = f0-f2, 3 = none"}
    - {name: OT,   lsb: 49, width: 2, group: action,    desc: "output tag (DST O0/O1; ignored for MKCTL and when KT)"}
    - {name: KT,   lsb: 51, width: 1, group: action,    desc: "keep the A input head's tag on the output; only when ASRC is I0/I1 (otherwise ignored, OT applies)"}
    - {name: HS,   lsb: 52, width: 1, group: condition, desc: "head-bit select for HE/HV: 0 = data[15], 1 = data[0]"}
  enums:
    DST:  {r0: 0, r1: 1, r2: 2, r3: 3, O0: 4, O1: 5, none: 6}
    ASRC: {r0: 0, r1: 1, r2: 2, r3: 3, I0: 4, I1: 5, zero: 6, time: 7}
    BSEL: {reg: 0, imm: 1, k: 2}

# Routine words (ISA.md §5.1): 16 bits. Bit 15 selects ALU (0) or CTRL (1).
routine:
  bits: 16
  alu:
    select: 0
    fields: {op: [14, 11], rd: [10, 9], ra: [8, 7], bs: [6, 6], b: [5, 0]}
  ctrl:
    select: 1
    sub: [14, 12]
    formats:
      - {name: LDI,  code: 0, fields: {rd: [11, 10], imm: [9, 0]},             desc: "rd := zext(imm10)"}
      - {name: LDIH, code: 1, fields: {rd: [11, 10], imm: [9, 0]},             desc: "rd := {imm[5:0], rd[9:0]}"}
      - {name: BR,   code: 2, fields: {cond: [11, 9], "off": [8, 0]},            desc: "branch if cond (enum BR_COND); off signed, from the next word", signed: ["off"]}
      - {name: DJNZ, code: 3, fields: {rd: [11, 10], "off": [9, 0]},             desc: "rd := rd - 1; branch if rd != 0; off signed; RZ unchanged", signed: ["off"]}
      - {name: LD,   code: 4, fields: {rd: [11, 10], ra: [9, 8], "off": [7, 0]}, desc: "rd := SRAM[r[ra] + off]"}
      - {name: ST,   code: 5, fields: {rd: [11, 10], ra: [9, 8], "off": [7, 0]}, desc: "SRAM[r[ra] + off] := rd"}
      - {name: OUT,  code: 6, fields: {port: [11, 11], tag: [10, 9], ra: [8, 7]}, desc: "enqueue r[ra] with tag on O0/O1; waits while full"}
      - {name: SYS,  code: 7, fields: {fn: [11, 8], arg: [7, 0]},            desc: "system op (enum SYS)"}
  enums:
    BR_COND: {always: 0, rz: 1, nrz: 2}
    SYS: {NOP: 0, RET: 1, SETST: 2, SETF: 3, CLRF: 4, TSTF: 5, CPYF: 6, GETT: 7, GETK: 8}
  sys_desc:
    NOP: "no operation"
    RET: "return: RB := 0"
    SETST: "STATE := arg[3:0]"
    SETF: "f[arg[1:0]] := 1 (arg 3 = RB: no effect)"
    CLRF: "f[arg[1:0]] := 0 (arg 3 = RB: no effect)"
    TSTF: "RZ := f[arg[1:0]]"
    CPYF: "f[arg[1:0]] := RZ (arg 3 = RB: no effect)"
    GETT: "r[arg[1:0]] := time"
    GETK: "r[arg[1:0]] := K[arg[3:2]]"

# CTRL tokens to pin-unit TX halves (ARCHITECTURE.md §7.3): data[15:12] = code, data[11:0] = arg.
pin_commands:
  - {code: 1, name: LEVEL, arg: "[11] v, [10:0] delay (ticks)", desc: "drive v at cursor + delay (LATE if already past and delay > 0)"}
  - {code: 2, name: OE,    arg: "[11] oe, [10:0] delay",        desc: "change output enable at cursor + delay"}
  - {code: 3, name: CLK,   arg: "[7:0] n",                      desc: "CLKGEN: n periods, each IDLE half then ACTIVE half; STRETCH waits for the line"}
  - {code: 4, name: GAP,   arg: "[11:0] ticks",                 desc: "advance the cursor (idle spacing)"}
  - {code: 5, name: SYNC,  arg: "none",                         desc: "cursor := earliest (re-anchor to the present); BITSYNC: the next bit starts a frame at bus idle, and re-arms TX after a readback abort"}
  - {code: 6, name: SETN,  arg: "[5] rx, [4:0] n",              desc: "rx = 0: TX NBITS for the following DATA tokens; rx = 1: RX word length, and RX framing restarts (1..16)"}
  - {code: 7, name: WAIT,  arg: "[1] sample point, [0] edge (1 = rise)", desc: "take no tokens until pin B shows the edge (or, with [1] in BITSYNC, until the next sample point); cursor := that time"}
  - {code: 8, name: SAMPLE, arg: "[11:0] delay (ticks)",      desc: "at cursor + delay, sample pin A into the RX word framing; cursor := that time"}
  - {code: 9, name: FRAME, arg: "[11] next frame, [10:0] n",    desc: "BITSYNC RX: the frame (in progress, or the next one with [11]) has n destuffed bits; then stuffing stops, the CRC is checked and the last word is flushed. LATE if none is in progress or it is already at or past n. An RX command: never waits behind TX data"}
  - {code: 10, name: LINE, arg: "[11:8] SE0 bits - 1, [6] reset TX CRC, [4] SE0, [3] append CRC, [2] stuff, [1:0] readback", desc: "BITSYNC TX, in stream order: [4] ends the frame with SE0 (pin A and pin N low) for n bits, then idle for 1 bit, then releases; readback 0 off / 1 arbitration (stop quietly on a mismatch) / 2 expect an override (report; error if nobody drove the other level) / 3 strict (a mismatch is a bit error); stuffing on/off; reset the TX CRC; then optionally shift out the TX CRC XOR CRC_XOR"}
  - {code: 11, name: JAM, arg: "[11:8] n-1, [7:6] d, [5] level, [4] on error, [2] TX on, [1] TX off, [0] disarm (with [4])", desc: "BITSYNC: drive level for n bits, bypassing the TX queue. [4]=0: after d more sample points (a response: skipped in a frame this unit transmits); [4]=1: armed, fires from the next bit after the next detected error (stuff error, bit error, missing override). [1]/[2] (alone): TX off/on switch (off = listen-only): while off nothing is driven and a frame's SYNC is refused with EVENT 0xC001"}

# Pad numbering for pin-unit pin A/B/C selects and output ownership (ARCHITECTURE.md §10).
pads:
  groups:
    - {name: ui,  base: 0,  count: 8, dir: in}
    - {name: uo,  base: 8,  count: 8, dir: out}
    - {name: uio, base: 16, count: 8, dir: inout}
  # Host SPI CS_n, SCK, MOSI, MISO, then IRQ (D-029). On the TT demo board (RP2350) these are
  # GPIO21-23 = SPI0 CSn/SCK/TX and GPIO36 = SPI0 RX (RP2350 datasheet, Table 645).
  host: [ui4, ui5, ui6, uo3, uo6]

# Fabric legal sources (ARCHITECTURE.md §4.6, D-029). Each consumer port's `sel` indexes its
# list in this order. Patterns: `Lk` = the consumer's own lane k, `L(k+1)` / `L(k-1)` = the next /
# previous lane (mod lanes), `L*` = every lane, `U*` = every pin unit.
fabric:
  lanes: 3
  units: 6
  sel_bits: 4
  sources:
    Lk.I0: [U*.rx, HOST_IN, L(k-1).O1]
    Lk.I1: [U*.rx, HOST_IN, L(k+1).O0, L(k-1).O1]
    Un.tx: [L*.O0, L*.O1, HOST_IN]
    HOST_OUT: [L*.O0, L*.O1, U0.rx, U1.rx]

# DATA to a TX half with TX_LENTOK (D-013): data[15:12] = nbits - 1, payload data[11:0].
tx_lentok: {len: [15, 12], payload: [11, 0]}

# Pin-unit configuration registers (ARCHITECTURE.md §7.2, §9; D-036). Host-written while the
# lanes are halted. Unit u's block is PIN_CFG base + u * stride (16-bit host words); `bit` is the
# position inside the block (word = bit div 16, so a 24-bit field fills one word and the low byte
# of the next). Kinds: bool; uint; m1 (stores value - 1); pad (pad number, 31 = not attached);
# enum; q8 (a time in 1/256 clocks, 16.8 fixed point); sofs (the sample offset from the bit or
# start edge in 1/256 clocks, round(SAMPLEOFS * PERIOD * 256), so rounding is fixed by the host).
pin_config:
  base: 0x3000
  stride: 32
  owner_base: 0x30C0          # + (pad - 8) for uo0..uio7: [2:0] owning unit, 7 = none (host pads ignore writes)
  fields:
    # word 0: modes and flags
    - {name: txmode,     bit: 0,   width: 3,  kind: enum, values: {level: 0, shift: 1, clkgen: 2, pulse: 3, bitsync: 4}, desc: "TX mode"}
    - {name: rxmode,     bit: 3,   width: 2,  kind: enum, values: {"off": 0, shift_rx: 1, linked_rx: 2, bitsync: 3}, desc: "RX mode (bitsync with txmode bitsync)"}
    - {name: order,      bit: 5,   width: 1,  kind: enum, values: {lsb: 0, msb: 1}, desc: "bit order of shifted words"}
    - {name: od,         bit: 6,   width: 1,  kind: bool, desc: "open drain on pin A: 1 releases, 0 drives low"}
    - {name: idle,       bit: 7,   width: 1,  kind: uint, desc: "idle level of pin A (BITSYNC: the recessive level)"}
    - {name: autorearm,  bit: 8,   width: 1,  kind: bool, desc: "SHIFT_RX re-arms after each word"}
    - {name: rx_echo,    bit: 9,   width: 1,  kind: bool, desc: "keep RX words sampled while our own TX shifted (0: drop them)"}
    - {name: tx_lentok,  bit: 10,  width: 1,  kind: bool, desc: "DATA carries its length: data[15:12] = n - 1"}
    - {name: tx_preload, bit: 11,  width: 1,  kind: bool, desc: "linked TX: bit 0 at once when idle (SPI CPHA = 0)"}
    - {name: stretch,    bit: 12,  width: 1,  kind: bool, desc: "CLKGEN waits for the line to read IDLE"}
    - {name: nrzi,       bit: 13,  width: 1,  kind: bool, desc: "BITSYNC NRZI line coding"}
    - {name: oe_auto,    bit: 14,  width: 1,  kind: bool, desc: "BITSYNC: drive the pads only while sending"}
    # word 1: pins A, B and the linked edges
    - {name: pin_a,      bit: 16,  width: 5,  kind: pad,  desc: "drive and/or sample pad"}
    - {name: pin_b,      bit: 21,  width: 5,  kind: pad,  desc: "link / condition pad"}
    - {name: rx_edge,    bit: 26,  width: 1,  kind: enum, values: {rise: 0, fall: 1}, desc: "LINKED_RX samples on this edge of pin B"}
    - {name: tx_edge,    bit: 27,  width: 2,  kind: enum, values: {none: 0, rise: 1, fall: 2}, desc: "linked TX shifts on this edge of pin B (none = timed)"}
    # word 2: pin C (select) and pin S (sense)
    - {name: pin_c,      bit: 32,  width: 5,  kind: pad,  desc: "select / frame pad"}
    - {name: c_active,   bit: 37,  width: 1,  kind: uint, desc: "pin C level that selects the unit"}
    - {name: c_oe,       bit: 38,  width: 1,  kind: bool, desc: "drive pin A only while selected"}
    - {name: pin_s,      bit: 39,  width: 5,  kind: pad,  desc: "sense pad, read instead of pin A"}
    # word 3: pin N and the event generator
    - {name: pin_n,      bit: 48,  width: 5,  kind: pad,  desc: "complement output of pin A"}
    - {name: ev_pin,     bit: 53,  width: 1,  kind: enum, values: {a: 0, c: 1}, desc: "event source pin"}
    - {name: ev_edge,    bit: 54,  width: 2,  kind: enum, values: {none: 0, rise: 1, fall: 2, both: 3}, desc: "event on this edge"}
    - {name: ev_qual,    bit: 56,  width: 2,  kind: enum, values: {none: 0, 0: 2, 1: 3}, desc: "only while pin B is at this level (2 samples)"}
    - {name: ev_reset,   bit: 58,  width: 1,  kind: bool, desc: "an event restarts RX word framing"}
    # words 4-5: PERIOD and PRESC
    - {name: period,     bit: 64,  width: 24, kind: q8,   desc: "bit period, 16.8 clocks, 1.0 to < 65536"}
    - {name: presc,      bit: 88,  width: 8,  kind: m1,   desc: "clocks per tick, 1..256"}
    # words 6-7: sample offset and word lengths
    - {name: sampleofs,  bit: 96,  width: 24, kind: sofs, desc: "sample point after the bit start / start edge, 16.8 clocks"}
    - {name: nbits,      bit: 120, width: 4,  kind: m1,   desc: "TX shift length, 1..16"}
    - {name: rx_nbits,   bit: 128, width: 5,  kind: uint, desc: "RX word length, 1..16 (0 = NBITS)"}
    - {name: rx_nbits2,  bit: 133, width: 5,  kind: uint, desc: "two-phase framing second length, 0 = off"}
    # words 9-12: PULSE symbols
    - {name: sym0_t1,    bit: 144, width: 12, kind: uint, desc: "bit 0: first level, ticks"}
    - {name: sym0_first, bit: 156, width: 1,  kind: uint, desc: "bit 0: first level"}
    - {name: sym0_t2,    bit: 160, width: 12, kind: uint, desc: "bit 0: second level, ticks"}
    - {name: sym1_t1,    bit: 176, width: 12, kind: uint, desc: "bit 1: first level, ticks"}
    - {name: sym1_first, bit: 188, width: 1,  kind: uint, desc: "bit 1: first level"}
    - {name: sym1_t2,    bit: 192, width: 12, kind: uint, desc: "bit 1: second level, ticks"}
    # words 13-14: carrier
    - {name: carrier,    bit: 208, width: 24, kind: q8,   desc: "carrier period, 16.8 clocks (0 = off)"}
    # words 15-17: BITSYNC timing and line coding
    - {name: sjw,        bit: 240, width: 24, kind: q8,   desc: "max resync step, 16.8 clocks (0 = hard sync only)"}
    - {name: idle_bits,  bit: 264, width: 5,  kind: uint, desc: "recessive samples that make the bus idle, 1..31"}
    - {name: resync,     bit: 269, width: 1,  kind: enum, values: {dom: 0, both: 1}, desc: "resync on recessive-to-dominant edges only, or both"}
    - {name: delim,      bit: 270, width: 2,  kind: enum, values: {none: 0, flag: 1, se0: 2}, desc: "frame delimiter"}
    - {name: stuff_n,    bit: 272, width: 4,  kind: uint, desc: "stuff after n equal bits, 0 = off"}
    - {name: stuff_lvl,  bit: 276, width: 2,  kind: enum, values: {none: 0, 0: 2, 1: 3}, desc: "stuff only runs of this level"}
    - {name: crc_width,  bit: 278, width: 5,  kind: uint, desc: "CRC width, 0 = none, 1..16"}
    - {name: crc_skip,   bit: 283, width: 5,  kind: uint, desc: "RX CRC starts after this many frame bits"}
    # words 18-21: CRC
    - {name: crc_poly,   bit: 288, width: 16, kind: uint, desc: "CRC polynomial (MSB-first LFSR)"}
    - {name: crc_init,   bit: 304, width: 16, kind: uint, desc: "CRC register at frame start"}
    - {name: crc_res,    bit: 320, width: 16, kind: uint, desc: "expected RX CRC register after the frame"}
    - {name: crc_xor,    bit: 336, width: 16, kind: uint, desc: "XOR-ed into the TX CRC when appended"}
