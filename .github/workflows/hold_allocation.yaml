name: compact per-delay timing allocation diagnostic
on:
  workflow_dispatch:
  push:
    branches: [efpga]
    paths:
      - 'test_internal/cloud_hold_allocation.py'
      - 'patches/sta_hold_allocation.tcl'
      - '.github/workflows/hold_allocation.yaml'
permissions:
  contents: read
  actions: read
concurrency:
  group: warp-hold-allocation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PDK_ROOT: ${{ github.workspace }}/build/cloud_pdk
      LIBRELANE_IMAGE_OVERRIDE: ghcr.io/librelane/librelane@sha256:d109140b8f17fc54f4fca998beb8124f4949404ec52e339eebd2250854a18b5a
    steps:
      - uses: actions/checkout@v6
      - name: Fetch authenticated producer and original source payload
        timeout-minutes: 12
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install librelane==3.1.0.dev3
          bash spikes/cloud/fetch_pdk.sh
          gh release download compact-checkpoint-20261006-iter8 -R "$GITHUB_REPOSITORY" --pattern fanout-preflight-source.tar.gz --dir build
          timeout 120s gh run download 38167697696 -R "$GITHUB_REPOSITORY" --name compact-reset-combined-38167697696 --dir build/reset_combined
      - name: Provision pinned cloud tools
        timeout-minutes: 5
        run: docker pull "$LIBRELANE_IMAGE_OVERRIDE"
      - name: Query every actual delay cell with unchanged timing constraints
        timeout-minutes: 16
        run: |
          source .venv/bin/activate
          python test_internal/cloud_hold_allocation.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compact-hold-allocation-${{ github.run_id }}
          path: build/hold_allocation/
          retention-days: 3
