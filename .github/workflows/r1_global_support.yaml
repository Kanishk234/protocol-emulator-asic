name: R1 cross-tile binary feedback support
on:
  workflow_dispatch:
  push:
    branches: [efpga]
    paths: [.github/workflows/r1_global_support.yaml]
permissions:
  contents: read
  actions: read
concurrency:
  group: warp-r1-global-support
  cancel-in-progress: false
jobs:
  support:
    if: github.ref == 'refs/heads/efpga'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check native alias and feedback guards
        run: |
          bash scripts/setup_venv.sh
          source .venv/bin/activate
          python -m pytest -q tools/profiling/tests/test_r1_global_support.py tools/profiling/tests/test_r1_boolean_support.py tools/profiling/tests/test_r1_configuration_audit.py
      - name: Authenticate original native/configured source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source .venv/bin/activate
          PYTHONPATH=tools python - <<'PY'
          import hashlib, json, os, subprocess, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'spikes/r1')
          from unused_lut_probe import SOURCE_RUN, ARTIFACT_ID, ARCHIVE_SHA, context
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{SOURCE_RUN}']))
          artifact = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{ARTIFACT_ID}']))
          context(run, artifact)
          archive = Path(os.environ['RUNNER_TEMP']) / 'original-timing.zip'
          with archive.open('wb') as output:
              subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{ARTIFACT_ID}/zip'], stdout=output, check=True)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == ARCHIVE_SHA
          root = Path('build/r1_timing'); root.mkdir(parents=True, exist_ok=False)
          with zipfile.ZipFile(archive) as bundle:
              names = bundle.namelist()
              assert len(names) == len(set(names))
              assert all(not Path(n).is_absolute() and '..' not in Path(n).parts for n in names)
              bundle.extractall(root)
          Path('build/unused-lut-source.json').write_text(json.dumps(dict(run=run, artifact=artifact), indent=2)+'\n')
          PY
          PYTHONPATH=tools python spikes/r1/unused_lut_probe.py prepare --capsule build/r1_timing --out build/global_native
      - name: Expand actual tile connections and measure bounded binary support
        timeout-minutes: 25
        run: |
          set -euo pipefail
          image=ghcr.io/librelane/librelane@sha256:d109140b8f17fc54f4fca998beb8124f4949404ec52e339eebd2250854a18b5a
          docker pull "$image"
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -e PYTHONPATH=tools "$image" \
            sh -c 'set -eu; yosys -Q -T -s build/global_native/export.ys > build/global_native/export.log; python3 spikes/r1/global_support.py prepare --capsule build/r1_timing --native build/global_native/all-native.json --out build/global_support; for script in build/global_support/*.ys; do label=${script%.ys}; set +e; timeout 120s yosys -Q -T -s "$script" > "$label.log" 2>&1; code=$?; set -e; printf "%s\n" "$code" > "$label.exit"; done'
      - name: Require complete diagnostics and positive and negative controls
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -e PYTHONPATH=tools \
            ghcr.io/librelane/librelane@sha256:d109140b8f17fc54f4fca998beb8124f4949404ec52e339eebd2250854a18b5a \
            python3 spikes/r1/global_support.py audit --out build/global_support
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r1-global-support-${{ github.run_id }}
          path: |
            build/global_support/
            build/global_native/plan.json
            build/global_native/all-native.json
            build/global_native/export.log
            build/unused-lut-source.json
          retention-days: 90
          if-no-files-found: error
