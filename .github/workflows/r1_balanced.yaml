name: R1 balanced native interfaces and critical leaves
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: warp-r1-balanced-${{ github.ref }}
  cancel-in-progress: false
jobs:
  interfaces:
    if: github.ref == 'refs/heads/efpga'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PDK_ROOT: ${{ github.workspace }}/build/r1_balanced_pdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Authenticate frozen all-type source
        timeout-minutes: 15
        run: |
          scripts/setup_venv.sh
          mkdir -p build/r1_balanced
          gh api repos/$GITHUB_REPOSITORY/actions/runs/40013513454 > build/r1_balanced/producer.json
          source .venv/bin/activate
          python -c 'import json; d=json.load(open("build/r1_balanced/producer.json")); assert d["head_sha"]=="8d42ac1202864ac92c6488b75f34c0a63fcbaebf" and d["run_attempt"]==1 and d["conclusion"]=="success"'
          gh run download 40013513454 --name r1-interfaces-40013513454 --dir build/r1_balanced_source
          bash spikes/cloud/fetch_pdk.sh
      - name: Check mixed geometry and power guards
        run: |
          source .venv/bin/activate
          python -m pytest -q tools/profiling/tests/test_r1_layout_budget.py tools/profiling/tests/test_r1_interface_preflight.py tools/profiling/tests/test_r1_physical_route.py --junitxml=build/r1_balanced/checks.xml
          python -m tools.autonomy.check_xml build/r1_balanced/checks.xml --minimum-cases 18
      - name: Native thirteen geometries and all connected neighbor bits
        timeout-minutes: 18
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e PDK_ROOT -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            ghcr.io/librelane/librelane@sha256:d109140b8f17fc54f4fca998beb8124f4949404ec52e339eebd2250854a18b5a \
            python3 spikes/r1/interface_preflight.py inside --balanced --bundle build/r1_balanced_source/input --out build/r1_balanced/native > build/r1_balanced/native.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r1-balanced-interfaces-${{ github.run_id }}
          path: build/r1_balanced/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
  critical_leaf:
    needs: interfaces
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        case: [west_io, northwest, southwest, primitive1, primitive4]
    env:
      GH_TOKEN: ${{ github.token }}
      PDK_ROOT: ${{ github.workspace }}/build/r1_balanced_pdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Authenticate exact frozen maps and buffer adapter
        timeout-minutes: 15
        run: |
          scripts/setup_venv.sh
          mkdir -p build/r1_balanced_leaf
          gh api repos/$GITHUB_REPOSITORY/actions/runs/40013513454 > build/r1_balanced_leaf/producer.json
          source .venv/bin/activate
          python -c 'import json; d=json.load(open("build/r1_balanced_leaf/producer.json")); assert d["head_sha"]=="8d42ac1202864ac92c6488b75f34c0a63fcbaebf" and d["run_attempt"]==1 and d["conclusion"]=="success"'
          gh run download 40013513454 --name r1-interfaces-40013513454 --dir build/r1_balanced_source
          curl -sfL https://raw.githubusercontent.com/mole99/librelane_plugin_fabulous/dcc038217472822330b33f61fadbc06e0c3cc96d/librelane_plugin_fabulous/scripts/add_buffers.tcl -o build/r1_balanced_leaf/add_buffers.tcl
          echo 'bd134f7e02a401ade48c365f0c9ed2b6d950526ccc92c71a777d039ff0fd8e0e  build/r1_balanced_leaf/add_buffers.tcl' | sha256sum -c -
          mkdir -p build/r1_balanced_leaf/adapter/librelane_plugin_fabulous/scripts
          cp build/r1_balanced_leaf/add_buffers.tcl build/r1_balanced_leaf/adapter/librelane_plugin_fabulous/scripts/
          patch --batch --fuzz=0 -p1 -d build/r1_balanced_leaf/adapter < patches/r1_explicit_buffer_cell.patch
          cp build/r1_balanced_leaf/adapter/librelane_plugin_fabulous/scripts/add_buffers.tcl build/r1_balanced_leaf/add_buffers.tcl
          echo '7b9526fcc9676d6f266e457344c6b71921eebea7e2600c3df489de1475c1f2e6  build/r1_balanced_leaf/add_buffers.tcl' | sha256sum -c -
          bash spikes/cloud/fetch_pdk.sh
      - name: Native fixed balanced case
        timeout-minutes: 45
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e PDK_ROOT -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT \
            ghcr.io/librelane/librelane@sha256:d109140b8f17fc54f4fca998beb8124f4949404ec52e339eebd2250854a18b5a \
            python3 spikes/r1/physical_route.py --bundle build/r1_balanced_source/input --buffers build/r1_balanced_leaf/add_buffers.tcl --out build/r1_balanced_leaf/native --balanced-case ${{ matrix.case }} > build/r1_balanced_leaf/native.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r1-balanced-leaf-${{ github.run_id }}-${{ matrix.case }}
          path: build/r1_balanced_leaf/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
