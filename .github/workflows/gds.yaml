name: gds

on:
  push:
    # WARP: only changes that can affect the hardened design or the TT checks start a hardening.
    paths:
      - 'src/**'
      - 'arch/**'
      - 'macro/**'
      - 'test/**'
      - 'info.yaml'
      - 'docs/info.md'
      - '.github/workflows/gds.yaml'
  workflow_dispatch:

# WARP: one hardening per branch at a time; a newer push queues instead of cancelling a running one.
concurrency:
  group: gds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
