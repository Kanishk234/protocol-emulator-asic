name: gds-native-resync-cfg-staging-setup-reserve-screen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gds-native-resync-cfg-staging-setup-reserve-screen-3393eea
  cancel-in-progress: false

jobs:
  harden:
    name: Native resync and configuration staging RTL with measured setup reserve (${{ matrix.strategy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        strategy: ['AREA 1']
    env:
      PDK_ROOT: /home/runner/pdk
      CANDIDATE_SHA: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
      GRT_ADJUSTMENT: "0.16"
      ALL_CORNER_REPAIR: "1"
      NATIVE_HOLD_TARGET: "0.10"
      NATIVE_CLOCK_CLUSTER_SIZE: "8"
      VARIANT: bs-resync-event-cfg-staging
      NATIVE_MAPPING_STRATEGY: ${{ matrix.strategy }}

    steps:
      - name: Check out the measured R4 candidate
        uses: actions/checkout@v6
        with:
          ref: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
          fetch-depth: 0
          submodules: recursive

      - name: Check out experiment helpers
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: workflow-src

      - name: Apply exactly one independent timing trial
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python workflow-src/scripts/ci/timing_trial.py
          sha256sum src/config.json src/trw_chan_port.v src/trw_pin_bs.v src/trw_pin_rx.v src/trw_pin_io.v

      - name: Check out Tiny Tapeout tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ihp-sg13cmos5l
          path: tt

      - name: Check out the pinned IHP installer
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: ihp-cmos5l
          path: .tt-gds-action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tt/requirements.txt

      - name: Install Tiny Tapeout prerequisites
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librsvg2-bin pngquant ghdl-llvm
          version: tinytapeout_gds_action

      - name: Install flow dependencies
        run: pip install -r tt/requirements.txt

      - name: Install IHP PDK
        run: ./.tt-gds-action/install_sg13cmos5l.sh

      - name: Install pinned LibreLane
        run: pip install librelane==3.1.0.dev3

      - name: Validate candidate and prepare generated config
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 - <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path

          grt_adjustment = os.environ["GRT_ADJUSTMENT"]
          assert grt_adjustment in {"0.12", "0.16"}, grt_adjustment

          cfg = json.loads(Path("src/config.json").read_text())
          assert float(cfg["CLOCK_PERIOD"]) == 20.0
          assert int(cfg["PL_TARGET_DENSITY_PCT"]) == 56

          assert hashlib.sha256(Path("src/trw_pin_bs.v").read_bytes()).hexdigest() == "c77f87ce20a8b2f7eec2b58b4db72476ccf4eb5fc89dde4d60b9461f486a346d", "RTL differs from locally verified configuration staging source"

          assert hashlib.sha256(Path("src/trw_pin_cfg.v").read_bytes()).hexdigest() == "d17c05bfe5ca002eb5ca09885727bee039766f815817c27a9b56da6041b7adc7", "Configuration staging differs from locally verified source"

          defs = Path("src/trw_defs.vh").read_text().splitlines()
          expected = {
              "TRW_LANES": "2",
              "TRW_UNITS": "4",
              "TRW_PC_UNITS_PULSE": "4'b0001",
              "TRW_PC_UNITS_CARRIER": "4'b0001",
              "TRW_PC_UNITS_BITSYNC": "4'b0001",
          }
          for name, value in expected.items():
              assert f"`define {name} {value}" in defs, name
          print(f"Pinned candidate: {os.environ['CANDIDATE_SHA']}")
          print("Candidate shape: 2 lanes, 4 pin units, U0 full; 20 ns; density 56%")
          print(f"Matched RTL variant: {os.environ['VARIANT']}; clock/density/resource shape unchanged")
          PY
          python tt/tt_tool.py --create-user-config --ihp

      - name: Verify the pinned declarative insertion and stop point
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'workflow-src/scripts/ci')
          from librelane.flows.classic import Classic
          from native_post_antenna_screen import SUBSTITUTIONS
          ids = [step.id for step in Classic.Substitute(SUBSTITUTIONS).Steps]
          final = ids.index('OpenROAD.RepairAntennas-1')
          assert final == ids.index('OpenROAD.ResizerTimingPostGRT') + 1
          assert final < ids.index('OpenROAD.DetailedRouting')
          print('Verified native Classic insertion:', ids[final-1:final+2])
          PY

      - name: Run clean synthesis and strict native electrical margin screen
        timeout-minutes: 130
        run: |
          python workflow-src/scripts/ci/ci_flow_watch.py \
            --log runs/native-resync-cfg-staging-setup-reserve-console.log \
            --heartbeat 30 --synthesis-timeout 900 --total-timeout 6900 --docker-stats \
            -- python -u workflow-src/scripts/ci/native_resync_cfg_staging_screen.py

      - name: Stop remaining flow containers after failure
        if: failure() || cancelled()
        run: docker ps -q | xargs -r docker stop -t 10

      - name: Upload early gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-resync-cfg-staging-setup-reserve-gates-${{ github.run_id }}
          path: |
            runs/native-resync-cfg-staging-setup-reserve-console.watch.json
            runs/native-stock-screen/antenna/*-openroad-checkantennas/or_metrics_out.json
            runs/native-stock-screen/antenna/*-openroad-checkantennas/reports/*.rpt
            runs/native-stock-screen/gates.json
            runs/native-stock-screen/recipe.json
            runs/native-stock-screen/timing/comparison.json
            runs/native-stock-screen/timing/after-*/*-openroad-stamidpnr/capture_setup.rpt
            runs/native-stock-screen/timing/after-*/*-openroad-stamidpnr/capture_hold.rpt
            src/config_native_stock.json
            runs/native-stock-screen/flow/*-openroad-resizertimingpostgrt/config.json
            runs/native-stock-screen/flow/*-openroad-resizertimingpostgrt/openroad-resizertimingpostgrt.log
            runs/native-stock-screen/flow/*-openroad-resizertimingpostgrt/or_metrics_out.json
            runs/native-stock-screen/flow/*-openroad-repairantennas*/**/config.json
            runs/native-stock-screen/flow/*-openroad-repairantennas*/**/*.log
            runs/native-stock-screen/flow/*-openroad-repairantennas*/**/or_metrics_out.json
            runs/native-stock-screen/flow/*-openroad-cts/config.json
            runs/native-stock-screen/flow/*-openroad-cts/cts.rpt
            runs/native-stock-screen/flow/*-openroad-cts/openroad-cts.log
            runs/native-stock-screen/flow/*-openroad-repairdesignpostgrt/config.json
            runs/native-stock-screen/flow/*-openroad-repairdesignpostgrt/or_metrics_out.json
            runs/native-stock-screen/flow/*-openroad-repairdesignpostgrt/openroad-repairdesignpostgrt.log
          if-no-files-found: warn

      - name: Upload matched screen evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gds-native-resync-cfg-staging-setup-reserve-${{ matrix.strategy == 'AREA 0' && 'area0' || 'area1' }}-${{ github.run_id }}
          path: |
            runs/native-resync-cfg-staging-setup-reserve-console.log
            runs/native-resync-cfg-staging-setup-reserve-console.watch.json
            runs/native-stock-screen/**
            src/**
            info.yaml
            workflow-src/spikes/r4_floorplan/*.patch
          if-no-files-found: warn
