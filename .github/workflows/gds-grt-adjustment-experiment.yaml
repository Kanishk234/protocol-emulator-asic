name: gds-grt-adjustment-experiment

on:
  workflow_dispatch:
    inputs:
      grt_adjustment:
        description: Global-route capacity adjustment for the pinned R4 candidate
        required: true
        default: "0.16"
        type: choice
        options:
          - "0.12"
          - "0.16"

permissions:
  contents: read

concurrency:
  group: gds-grt-adjustment-3393eea
  cancel-in-progress: false

jobs:
  harden:
    name: Full R4 hardening at GRT_ADJUSTMENT=${{ inputs.grt_adjustment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PDK_ROOT: /home/runner/pdk
      CANDIDATE_SHA: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
      GRT_ADJUSTMENT: ${{ inputs.grt_adjustment }}

    steps:
      - name: Check out the measured R4 candidate
        uses: actions/checkout@v6
        with:
          ref: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
          fetch-depth: 0
          submodules: recursive

      - name: Check out Tiny Tapeout tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ihp-sg13cmos5l
          path: tt

      - name: Check out the pinned IHP installer
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-gds-action
          ref: ihp-cmos5l
          path: .tt-gds-action

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tt/requirements.txt

      - name: Install Tiny Tapeout prerequisites
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: librsvg2-bin pngquant ghdl-llvm
          version: tinytapeout_gds_action

      - name: Install flow dependencies
        run: pip install -r tt/requirements.txt

      - name: Install IHP PDK
        run: ./.tt-gds-action/install_sg13cmos5l.sh

      - name: Install pinned LibreLane
        run: pip install librelane==3.1.0.dev3

      - name: Validate candidate and prepare generated config
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          grt_adjustment = os.environ["GRT_ADJUSTMENT"]
          assert grt_adjustment in {"0.12", "0.16"}, grt_adjustment

          cfg = json.loads(Path("src/config.json").read_text())
          assert float(cfg["CLOCK_PERIOD"]) == 20.0
          assert int(cfg["PL_TARGET_DENSITY_PCT"]) == 56

          defs = Path("src/trw_defs.vh").read_text().splitlines()
          expected = {
              "TRW_LANES": "2",
              "TRW_UNITS": "4",
              "TRW_PC_UNITS_PULSE": "4'b0001",
              "TRW_PC_UNITS_CARRIER": "4'b0001",
              "TRW_PC_UNITS_BITSYNC": "4'b0001",
          }
          for name, value in expected.items():
              assert f"`define {name} {value}" in defs, name
          print(f"Pinned candidate: {os.environ['CANDIDATE_SHA']}")
          print("Candidate shape: 2 lanes, 4 pin units, U0 full; 20 ns; density 56%")
          print(f"Flow-only override: GRT_ADJUSTMENT={grt_adjustment}; all hardware inputs unchanged")
          PY
          python tt/tt_tool.py --create-user-config --ihp

      - name: Run full LibreLane hardening with GRT adjustment override
        timeout-minutes: 330
        run: |
          set -euo pipefail
          mkdir -p runs/wokwi
          python -m librelane \
            --pdk-root "$PDK_ROOT" \
            --docker-no-tty \
            --dockerized \
            --pdk ihp-sg13cmos5l \
            --manual-pdk \
            --run-tag wokwi \
            --force-run-dir runs/wokwi \
            --hide-progress-bar \
            --override-config "GRT_ADJUSTMENT=$GRT_ADJUSTMENT" \
            src/config_merged.json

      - name: Print route and cell summaries
        if: success()
        run: |
          python tt/tt_tool.py --print-stats --ihp >> "$GITHUB_STEP_SUMMARY"
          python tt/tt_tool.py --print-cell-category --ihp >> "$GITHUB_STEP_SUMMARY"

      - name: Create Tiny Tapeout submission artifact
        if: success()
        run: python tt/tt_tool.py --create-tt-submission --ihp

      - name: Render GDS preview
        if: success()
        run: python tt/tt_tool.py --create-png --ihp

      - name: Upload route and signoff logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: GDS_logs-${{ github.run_id }}
          path: |
            src/*
            runs/wokwi/*
          if-no-files-found: warn

      - name: Upload Tiny Tapeout submission
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: tt_submission
          path: |
            src/*
            docs/*
            tt_submission/*
            info.yaml
            LICENSE

      - name: Upload GDS preview
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: gds_render-${{ github.run_id }}
          path: gds_render.png
          if-no-files-found: warn

  precheck:
    needs: harden
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: harden
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the measured R4 candidate
        uses: actions/checkout@v6
        with:
          ref: 3393eea9a58c5cad9077cc360a8515d0e5ec8284
          submodules: recursive

      - name: Run gate-level tests on the experimental netlist
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l
