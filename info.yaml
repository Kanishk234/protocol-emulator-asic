project:
  title: 'TRIPWIRE: programmable protocol emulator'
  author: Kanishk, Krithik
  discord: ''
  description: 2 lanes, 4 timed pin units, multicast channels and programmable SRAM
    routines; UART, SPI and I2C demonstrated in simulation
  language: Verilog
  clock_hz: 50000000
  tiles: 8x4
  top_module: tt_um_tripwire
  source_files:
  - tt_um_tripwire.v
  - trw_chip.v
  - trw_sync.v
  - trw_fabric.v
  - trw_chan_port.v
  - trw_chan_prod.v
  - trw_host.v
  - trw_spi.v
  - trw_lane.v
  - trw_alu.v
  - trw_slots.v
  - trw_sram.v
  - trw_pin_cfg.v
  - trw_pin_io.v
  - trw_pin_tx.v
  - trw_pin_rx.v
  - trw_pin_bs.v
  - trw_pin_unit.v
  - trw_pins.v
pinout:
  ui[0]: PIN (ui0)
  ui[1]: PIN (ui1)
  ui[2]: PIN (ui2)
  ui[3]: PIN (ui3)
  ui[4]: HOST CS_n
  ui[5]: HOST SCK
  ui[6]: HOST MOSI
  ui[7]: PIN (ui7)
  uo[0]: PIN (uo0)
  uo[1]: PIN (uo1)
  uo[2]: PIN (uo2)
  uo[3]: HOST MISO
  uo[4]: PIN (uo4)
  uo[5]: PIN (uo5)
  uo[6]: IRQ
