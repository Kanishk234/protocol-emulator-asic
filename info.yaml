  uio[0]: PIN (uio0)
  uio[1]: PIN (uio1)
  uio[2]: PIN (uio2)
  uio[3]: PIN (uio3)
  uio[4]: PIN (uio4)
  uio[5]: PIN (uio5)
  uio[6]: PIN (uio6)
  uio[7]: PIN (uio7)
