name: repo-audit
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pyyaml==6.0.3 pytest==8.4.2
      - name: Repository and qualified-input audit
        run: python scripts/ci/repo_audit.py
      - name: Maintained CI helper tests
        run: PYTHONPATH=scripts/ci python -m pytest -q scripts/ci
