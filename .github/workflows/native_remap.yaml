name: native C2 combinational remap diagnostic
on:
  push:
    branches: [efpga]
    paths:
      - 'test_internal/cloud_native_remap.py'
      - '.github/workflows/native_remap.yaml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: warp-native-remap-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      PDK_ROOT: ${{ github.workspace }}/build/cloud_pdk
    steps:
      - uses: actions/checkout@v6
      - name: Standard tools and project simulation venv
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog yosys python3-venv
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install -r test/requirements.txt pyyaml==6.0.3
      - name: Fetch authenticated diagnostic inputs and exact gate simulator
        timeout-minutes: 10
        run: |
          bash spikes/cloud/fetch_checkpoint.sh
          bash spikes/cloud/fetch_pdk.sh
          mkdir -p "$HOME/.cache/warp/iverilog-13" build/native_remap_input/passing_control
          curl -sfL -o build/iverilog13.deb https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb
          dpkg-deb -x build/iverilog13.deb "$HOME/.cache/warp/iverilog-13"
          timeout 120s gh run download 37659171115 --repo "$GITHUB_REPOSITORY" \
            --name native-lut-variant-37659171115 --dir build/native_remap_input/passing_control
          timeout 120s gh release download compact-checkpoint-20261006-iter8 --repo "$GITHUB_REPOSITORY" \
            --pattern native-stage-c2.tar.gz --dir build/native_remap_input
      - name: Remap and prove one tile; loaded control, negative baseline and candidate
        timeout-minutes: 38
        run: |
          source .venv/bin/activate
          python test_internal/cloud_native_remap.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-remap-${{ github.run_id }}
          path: build/native_remap_evidence/
          retention-days: 3
