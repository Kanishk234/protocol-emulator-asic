name: capture queue boundaries
on:
  push:
    branches: [efpga]
    paths:
      - 'protocols/uart_capture/**'
      - '.github/workflows/capture_queue.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Project simulation environment
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog python3-venv
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install -r test/requirements.txt
      - name: Full and empty simultaneous queue boundaries
        run: |
          source .venv/bin/activate
          cd protocols/uart_capture/test
          for shift in 0 2; do
            make STAMP_SHIFT="$shift" COCOTB_RESULTS_FILE="results_$shift.xml"
          done
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for shift in (0, 2):
              root = ET.parse(Path(f'results_{shift}.xml')).getroot()
              assert len(root.findall('.//testcase')) == 1
              assert not any(root.findall('.//' + tag) for tag in ('failure', 'error', 'skipped'))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capture-queue-${{ github.run_id }}
          path: protocols/uart_capture/test/results_*.xml
          retention-days: 1
