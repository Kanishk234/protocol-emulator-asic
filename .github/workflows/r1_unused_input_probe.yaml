name: R1 unused LUT input sensitivity
on:
  workflow_dispatch:
  push:
    branches: [efpga]
    paths: [.github/workflows/r1_unused_input_probe.yaml]
permissions:
  contents: read
  actions: read
concurrency:
  group: warp-r1-unused-input-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/efpga'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare virtual environment and guard tests
        run: |
          bash scripts/setup_venv.sh
          source .venv/bin/activate
          python -m pytest -q tools/profiling/tests/test_r1_unused_lut_probe.py tools/profiling/tests/test_r1_configuration_audit.py tools/profiling/tests/test_r1_run_timing.py
      - name: Authenticate original failed timing capsule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source .venv/bin/activate
          PYTHONPATH=tools python - <<'PY'
          import hashlib, json, os, subprocess, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'spikes/r1')
          from unused_lut_probe import SOURCE_RUN, ARTIFACT_ID, ARCHIVE_SHA, context
          repo = os.environ['GITHUB_REPOSITORY']
          run = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{SOURCE_RUN}']))
          artifact = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{ARTIFACT_ID}']))
          context(run, artifact)
          archive = Path(os.environ['RUNNER_TEMP']) / 'original-timing.zip'
          with archive.open('wb') as output:
              subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{ARTIFACT_ID}/zip'], stdout=output, check=True)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == ARCHIVE_SHA
          root = Path('build/r1_timing'); root.mkdir(parents=True, exist_ok=False)
          with zipfile.ZipFile(archive) as bundle:
              names = bundle.namelist()
              assert len(names) == len(set(names))
              assert all(not Path(n).is_absolute() and '..' not in Path(n).parts for n in names)
              bundle.extractall(root)
          Path('build/unused-lut-source.json').write_text(json.dumps(dict(run=run, artifact=artifact), indent=2)+'\n')
          PY
          PYTHONPATH=tools python spikes/r1/unused_lut_probe.py prepare --capsule build/r1_timing --out build/r1_unused_input --target unused-input-select --trace-edges
      - name: Measure original and candidate with pinned edge-report syntax
        timeout-minutes: 10
        run: |
          set -euo pipefail
          image=ghcr.io/librelane/librelane@sha256:d109140b8f17fc54f4fca998beb8124f4949404ec52e339eebd2250854a18b5a
          docker pull "$image"
          docker image inspect "$image" > build/r1_unused_input/image.json
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$image" \
            sh -c 'set -eu; sta -version > build/r1_unused_input/sta-version.txt; yosys -Q -T -s build/r1_unused_input/export.ys > build/r1_unused_input/export.log; for label in control candidate; do for policy in static dynamic; do timeout 90s sta -no_init -no_splash -exit "build/r1_unused_input/${label}_${policy}.tcl" > "build/r1_unused_input/${label}_${policy}.log" 2>&1; done; done'
      - name: Independently compare every observed configuration bit with loaded frames
        run: |
          source .venv/bin/activate
          PYTHONPATH=tools python spikes/r1/configuration_audit.py \
            --native build/r1_unused_input/all-native.json \
            --snapshot build/r1_timing/functional/quiescent/configuration-state.json \
            --image build/r1_timing/functional/quiescent/quiesced.wbit \
            --out build/r1_unused_input/configuration-audit.json
      - name: Require original failure reproduction and retain measured outcome
        run: |
          source .venv/bin/activate
          PYTHONPATH=tools python spikes/r1/unused_lut_probe.py audit --out build/r1_unused_input
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r1-unused-input-${{ github.run_id }}
          path: |
            build/r1_unused_input/
            build/unused-lut-source.json
          if-no-files-found: error
          retention-days: 90
