name: design-set profiling evidence
on:
  workflow_dispatch:
  push:
    branches: [efpga]
    paths:
      - 'test_internal/cloud_profile_evidence.py'
      - '.github/workflows/profile_evidence.yaml'
permissions:
  contents: read
concurrency:
  group: warp-profile-evidence-${{ github.ref }}
  cancel-in-progress: false
env:
  OSS_CAD_SUITE_TAG: '2026-06-29'
jobs:
  profile:
    if: github.ref == 'refs/heads/efpga'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Python prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Cache pinned synthesis suite
        id: ocs
        uses: actions/cache@v5
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-${{ env.OSS_CAD_SUITE_TAG }}
      - name: Fetch pinned synthesis suite
        if: steps.ocs.outputs.cache-hit != 'true'
        run: |
          D=${OSS_CAD_SUITE_TAG//-/}
          curl -sfL -o /tmp/warp-profile-ocs.tgz "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$OSS_CAD_SUITE_TAG/oss-cad-suite-linux-x64-$D.tgz"
          tar -xzf /tmp/warp-profile-ocs.tgz -C ~
      - name: Project venv
        run: scripts/setup_venv.sh
      - name: Profile only the four design-set workloads on all six variants
        timeout-minutes: 12
        run: |
          source .venv/bin/activate
          export PATH="$HOME/oss-cad-suite/bin:$PATH"
          python test_internal/cloud_profile_evidence.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: design-set-profile-${{ github.run_id }}
          path: build/profile_evidence/
          retention-days: 30
          if-no-files-found: error
