name: R1 fixed-placement targeted relocation
on:
  workflow_dispatch:
  push:
    branches: [efpga]
    paths: [.github/workflows/r1_fixed_relocation.yaml]
permissions:
  contents: read
  actions: read
concurrency:
  group: warp-r1-fixed-relocation
  cancel-in-progress: false
jobs:
  placement:
    if: github.ref == 'refs/heads/efpga'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: tools:test_internal:spikes/r1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        with:
          path: ~/.cache/warp/ocs-2026-09-27
          key: oss-cad-suite-nextpnr-2026-09-27
      - name: Authenticate frozen synthesized design and compiler model
        timeout-minutes: 15
        run: |
          bash scripts/setup_venv.sh
          source .venv/bin/activate
          python -m pytest -q tools/profiling/tests/test_r1_fixed_relocation.py
          bash scripts/fetch_nextpnr.sh
          python - <<'PY'
          import json,os
          from pathlib import Path
          from assembly_fetch import api,admit_run,artifact
          from fixed_relocation import prepare
          row=json.loads(Path('spikes/r1/routed_timing_sources.json').read_text())['sources']['capsule']
          repo=os.environ['GITHUB_REPOSITORY']
          producer=api(f'repos/{repo}/actions/runs/{row["run"]["id"]}')
          admit_run(producer,row['run'])
          target=Path('build/r1_placement_sources').resolve();target.mkdir(parents=True,exist_ok=False)
          capsule=artifact(repo,row['artifact'],target)/row['member']
          prepare(capsule,Path('build/r1_placement_trial'))
          Path('build/r1_placement_trial/producer.json').write_text(json.dumps(producer,indent=2)+'\n')
          PY
      - name: Restore exact image then reroute fixed placements and one targeted LC move
        timeout-minutes: 35
        run: |
          source .venv/bin/activate
          python spikes/r1/fixed_relocation.py run --out build/r1_placement_trial
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r1-fixed-relocation-${{ github.run_id }}
          path: build/r1_placement_trial/
          include-hidden-files: true
          retention-days: 90
