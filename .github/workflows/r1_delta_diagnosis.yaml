name: R1 stalled relocation read only VPI diagnosis
on:
  workflow_dispatch:
  push:
    branches: [efpga]
    paths: [.github/workflows/r1_delta_diagnosis.yaml]
permissions:
  contents: read
  actions: read
concurrency:
  group: warp-r1-delta-diagnosis
  cancel-in-progress: false
jobs:
  native:
    if: github.ref == 'refs/heads/efpga'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PDK_ROOT: ${{ github.workspace }}/build/sa_pdk
      PYTHONPATH: tools:test_internal:spikes/r1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Authenticate original native exports and new SA image
        timeout-minutes: 18
        run: |
          bash scripts/setup_venv.sh
          source .venv/bin/activate
          python - <<'PY'
          import json,os
          from pathlib import Path
          from assembly_fetch import api,admit_run,artifact
          from sa_functional import prepare
          sources=json.loads(Path('spikes/r1/routed_timing_sources.json').read_text())['sources']
          sources={name:sources[name] for name in ('capsule','native')}
          sources['trial']={
            'run':{'id':44676960615,'head_sha':'4ef3050aeeedb37238a54509a526eb49e897a63b','head_branch':'efpga','run_attempt':1,'conclusion':'success','path':'.github/workflows/r1_fixed_relocation.yaml'},
            'artifact':{'id':14602995056,'name':'r1-fixed-relocation-44676960615','digest':'sha256:45178670906bd43c1519c46e6c7c154eaf1dd47d2ce3e4b3db808420496cceeb','size_in_bytes':264030,'source_run':44676960615},'member':'.'}
          repo=os.environ['GITHUB_REPOSITORY'];target=Path('build/sa_sources').resolve();target.mkdir(parents=True,exist_ok=False)
          roots={}
          for name,row in sources.items():
              producer=api(f'repos/{repo}/actions/runs/{row["run"]["id"]}')
              admit_run(producer,row['run'])
              roots[name]=str(artifact(repo,row['artifact'],target)/row['member'])
              (target/(name+'.producer.json')).write_text(json.dumps(producer,indent=2)+'\n')
          (target/'locations.json').write_text(json.dumps(roots,indent=2)+'\n')
          prepare(**roots,out=Path('build/sa_functional'),trial_kind='fixed_relocation')
          PY
          bash spikes/cloud/fetch_pdk.sh
          mkdir -p build/sa_iverilog
          curl -sfL https://github.com/TinyTapeout/iverilog/releases/download/v13.0/iverilog_13.0-1_amd64.deb -o build/sa_iverilog.deb
          dpkg-deb -x build/sa_iverilog.deb build/sa_iverilog
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          roots=json.loads(Path('build/sa_sources/locations.json').read_text())
          expected=json.loads((Path(roots['capsule'])/'functional/quiescent/configured-smoke.json').read_text())['tool_binary_sha256']
          for name,digest in expected.items():
              assert hashlib.sha256((Path('build/sa_iverilog/usr/bin')/name).read_bytes()).hexdigest()==digest
          PY
      - name: Replay original control and stalled image with read only VPI observer
        timeout-minutes: 12
        run: |
          source .venv/bin/activate
          gcc -shared -fPIC -O2 -I build/sa_iverilog/usr/include/iverilog spikes/r1/delta_watchdog.c -o build/delta_watchdog.vpi
          icarus_root="$PWD/build/sa_iverilog"
          for mode in 0 1; do
            "$icarus_root/usr/bin/iverilog" -B "$icarus_root/usr/lib/ivl" -g2012 -s wp_delta_watchdog_fixture \
              -Pwp_delta_watchdog_fixture.OSCILLATE=$mode -o "build/delta-fixture-$mode.vvp" spikes/r1/delta_watchdog_fixture.v
            status=0
            timeout 20s "$icarus_root/usr/bin/vvp" -M "$icarus_root/usr/lib/ivl" -m "$PWD/build/delta_watchdog" \
              "build/delta-fixture-$mode.vvp" > "build/sa_functional/delta-fixture-$mode.log" 2>&1 || status=$?
            if [ "$mode" = 0 ]; then
              test "$status" = 0
              ! grep -q 'DELTA_WATCHDOG stuck' "build/sa_functional/delta-fixture-$mode.log"
            else
              test "$status" = 2
              grep -q 'DELTA_WATCHDOG stuck' "build/sa_functional/delta-fixture-$mode.log"
            fi
          done
          timeout --kill-after=10s 600s python spikes/r1/delta_diagnosis.py --out build/sa_functional \
            --pdk "$PDK_ROOT/ihp-sg13cmos5l" --icarus build/sa_iverilog --watchdog build/delta_watchdog.vpi > build/sa_functional/delta.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r1-delta-diagnosis-${{ github.run_id }}
          path: |
            build/sa_functional/
            build/sa_sources/*.producer.json
            build/sa_sources/*.metadata.json
          include-hidden-files: true
          retention-days: 90
